<style>
:root{--bg:#0b1020;--panel:#121a2d;--panel2:#18223a;--text:#eef2ff;--muted:#9aa8c2;--accent:#7dd3fc;--danger:#fb7185;--good:#86efac;--gold:#fcd34d;--line:#293653;--shadow:0 12px 35px #0005}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#09101e,#0e1424 60%,#0a0f1c);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{border:1px solid var(--line);background:#17223a;color:var(--text);border-radius:12px;padding:11px 13px;cursor:pointer}button:active{transform:translateY(1px)}button.primary{background:#2563eb;border-color:#3b82f6}button.good{background:#166534;border-color:#22c55e}button.danger{background:#4c1722;border-color:#9f1239}.hidden{display:none!important}.app{max-width:760px;margin:auto;padding:12px 12px 40px}.topbar{position:sticky;top:0;z-index:20;background:#0b1020ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:9px 0}.brand{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand h1{font-size:20px;margin:0}.small{font-size:12px}.muted{color:var(--muted)}.card{background:linear-gradient(180deg,#121a2df2,#10182af2);border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0;box-shadow:var(--shadow)}.hero{margin-top:10px}.herohead{display:flex;justify-content:space-between;gap:12px;align-items:start}.hero h2{margin:0 0 2px;font-size:20px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#202c47;border:1px solid var(--line);font-size:11px;color:#cbd5e1}.hud{position:sticky;top:51px;z-index:15;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:9px 0;background:#0b1020f5;padding:6px 0;border-bottom:1px solid var(--line)}.hud .box{min-width:0;background:#151f35;border:1px solid var(--line);border-radius:10px;padding:7px;text-align:center}.hud b{display:block;font-size:13px}.hud span{font-weight:700}.nav{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:10px 0}.nav button{padding:8px 3px;font-size:11px;background:#10192c}.nav button.active{background:#243555;border-color:#4b648f}.section-title{display:flex;justify-content:space-between;align-items:center;gap:8px}.scene-title{font-size:21px;margin:4px 0}.scene-text{white-space:pre-line;font-size:16px}.choice{width:100%;text-align:left;margin:7px 0;padding:13px;background:#151f35}.choice strong{display:block}.choice span{display:block;color:#aebbd0;font-size:12px;margin-top:3px}.statrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #25304a}.bar{height:9px;background:#252f45;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;width:0;background:#60a5fa}.hpbar>i{background:#fb7185}.energybar>i{background:#facc15}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.modal{position:fixed;inset:0;background:#020617dd;z-index:50;overflow:auto;padding:18px}.modal .card{max-width:650px;margin:30px auto}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#aebbd0;margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0c1426;color:var(--text)}.combatbox{border-color:#713f12;background:linear-gradient(180deg,#241b12,#141a29)}.combat-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tech{border-color:#3b5c91;background:#16253e}.tech.locked{opacity:.55}.log{display:flex;flex-direction:column;gap:8px}.logitem{border-left:3px solid #3b82f6;padding:8px 10px;background:#10182a;border-radius:0 10px 10px 0}.summary{border:1px solid #475569;background:#111c31}.season-end{border-color:#7c5a15;background:linear-gradient(180deg,#211b0e,#111827)}.npc{border:1px solid var(--line);padding:10px;border-radius:12px;background:#111a2c}.npc h4{margin:0}.pill{font-size:11px;padding:3px 7px;border:1px solid var(--line);border-radius:99px;color:#cbd5e1}.footer-actions{display:flex;flex-wrap:wrap;gap:7px}.menu{min-height:100vh;display:flex;align-items:center;justify-content:center}.menu .card{width:min(650px,100%);padding:22px}.menu h1{font-size:32px;margin:0}.menu .subtitle{font-size:16px;color:#b5c2d8}.feature{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.feature div{background:#10182a;border:1px solid var(--line);border-radius:12px;padding:10px}.notice{padding:10px;border-radius:11px;background:#101a2c;border:1px solid var(--line);color:#c8d3e7}.right{text-align:right}@media(max-width:520px){.nav{grid-template-columns:repeat(3,1fr)}.grid,.two,.feature{grid-template-columns:1fr}.hud{grid-template-columns:repeat(3,1fr)}.hud .box{font-size:12px}.app{padding-left:9px;padding-right:9px}.combat-actions{grid-template-columns:1fr}.scene-title{font-size:19px}}
</style>

<body>
<div id="root"></div>
<div id="modal" class="modal hidden"></div>
<script>
'use strict';
const VERSION='16.2';const KEY='MHA_ROAD_V16_2_SAVE';
const $=id=>document.getElementById(id);const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const rnd=a=>Math.floor(Math.random()*a);const pick=a=>a[rnd(a.length)];
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let S=null,scene=null,combat=null,activeTab='story';
const STAT_LABEL={force:'Force',vitesse:'Vitesse',defense:'Défense',intelligence:'Intelligence',endurance:'Endurance',controle:'Contrôle',courage:'Courage'};
const EQUIP={head:[['Casquette renforcée','+1 défense, +1 vitesse',1,0,1,0,0,0,0]],torso:[['Veste matelassée','+3 défense, +1 endurance',0,0,3,0,1,0,0]],arms:[['Gants d’entraînement','+2 force, +1 contrôle',2,0,0,0,0,1,0]],legs:[['Chaussures de course','+2 vitesse, +1 endurance',0,2,0,0,1,0,0]],support:[['Bracelet d’assistance','+2 intelligence, +1 contrôle',0,0,0,2,0,1,0]]};
const QUIRKS=[
{id:'force',name:'Impulsion',family:'Force',desc:'Tu amplifies brutalement la force de tes mouvements.',weak:'Les articulations encaissent les usages répétés.',tech:[['Impact concentré','Une frappe courte qui inflige des dégâts élevés.',12,'damage',1.45],['Onde de choc','Une impulsion à distance, moins puissante mais sûre.',16,'damage',1.15],['Renforcement','Tu renforces ton corps pour réduire les dégâts reçus.',14,'guard',.55]]},
{id:'speed',name:'Accélération',family:'Vitesse',desc:'Tu peux accélérer ton corps par impulsions successives.',weak:'Les changements brutaux épuisent rapidement ton endurance.',tech:[['Dash','Une attaque rapide difficile à anticiper.',12,'damage',1.25],['Pas fantôme','Tu esquives et prépares ton prochain coup.',15,'guard',.7],['Surcharge','Une accélération extrême qui augmente les dégâts mais coûte cher.',22,'damage',1.8]]},
{id:'heat',name:'Thermokinésie',family:'Élément',desc:'Tu manipules la chaleur autour de ton corps.',weak:'La surchauffe limite les utilisations rapprochées.',tech:[['Jet thermique','Une projection de chaleur directe.',14,'damage',1.35],['Mur thermique','Une barrière qui réduit fortement les dégâts.',16,'guard',.45],['Surchauffe','Tu pousses la puissance au maximum au prix d’un contrecoup.',24,'damage',2.0]]},
{id:'shadow',name:'Ombre',family:'Ombre',desc:'Tu manipules les ombres proches pour gêner et frapper.',weak:'Ton potentiel diminue dans les environnements très exposés.',tech:[['Lame d’ombre','Une attaque précise.',13,'damage',1.3],['Voile','Tu te fonds dans les ombres et réduis les dégâts.',15,'guard',.5],['Entrave','Tu immobilises brièvement l’adversaire.',18,'stun',.35]]},
{id:'gravity',name:'Gravité',family:'Gravité',desc:'Tu modifies localement le poids et la trajectoire des objets.',weak:'Les manipulations lourdes demandent beaucoup d’énergie.',tech:[['Pression','Tu alourdis violemment la cible.',16,'damage',1.45],['Allègement','Tu réduis ton poids pour mieux encaisser et esquiver.',12,'guard',.6],['Zone gravitationnelle','Une technique puissante mais très coûteuse.',25,'damage',2.05]]},
{id:'sound',name:'Résonance',family:'Son',desc:'Tu produis et manipules des vibrations.',weak:'Les fortes fréquences te désorientent aussi.',tech:[['Onde sonore','Une attaque à distance.',13,'damage',1.3],['Résonance défensive','Tu détournes les vibrations des impacts.',15,'guard',.5],['Fréquence brisée','Une attaque instable capable de déséquilibrer.',20,'stun',.5]]}
];
const NAMES=['Yuto','Mina','Ren','Aiko','Sora','Kenji','Hana','Daichi','Noa','Riku','Mei','Kaito','Aya','Haru','Nana','Toma','Kenta','Emi'];
const SURNAMES=['Sato','Kobayashi','Mori','Tanaka','Aoki','Nakamura','Ishida','Fujita','Kato','Sakai'];
const TRAITS=['réservé','ambitieux','protecteur','provocateur','curieux','studieux','imprévisible','sociable'];
function baseState(){return {version:VERSION,player:{name:'',age:14,gender:'',personality:'Curieux'},school:'Collège municipal',schoolYear:'4e',day:1,season:1,action:0,seasonActions:[],seasonHistory:[],money:250,hp:100,maxHp:100,energy:100,maxEnergy:100,rep:0,stats:{force:8,vitesse:8,defense:8,intelligence:8,endurance:8,controle:8,courage:8},equipment:{head:null,torso:null,arms:null,legs:null,support:null},quirk:null,quirkXP:0,techniques:{},relations:{},npcs:[],memories:[],decisions:[],timeline:[],worldNews:[],seenEvents:{},storyFlags:{},seasonSummary:null,injury:0,started:false,gameOver:false};}
function normalize(x){const b=baseState();const s=Object.assign(b,x||{});s.player=Object.assign(b.player,x?.player||{});s.stats=Object.assign(b.stats,x?.stats||{});s.equipment=Object.assign(b.equipment,x?.equipment||{});s.relations=x?.relations||{};s.seasonActions=x?.seasonActions||[];s.seasonHistory=x?.seasonHistory||[];s.memories=x?.memories||[];s.decisions=x?.decisions||[];s.timeline=x?.timeline||[];s.worldNews=x?.worldNews||[];s.seenEvents=x?.seenEvents||{};s.storyFlags=x?.storyFlags||{};s.npcs=x?.npcs||[];return s;}
function save(){if(S)localStorage.setItem(KEY,JSON.stringify(S));}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x){S=normalize(x);return true}}catch(e){}return false}
function log(kind,text){S.timeline.push({day:S.day,season:S.season,kind,text});S.timeline=S.timeline.slice(-100);S.memories.push({day:S.day,season:S.season,text});S.memories=S.memories.slice(-40)}
function effectiveStat(k){let v=S.stats[k]||0;for(const slot of Object.keys(S.equipment)){const id=S.equipment[slot];if(!id)continue;const item=EQUIP[slot]?.find(x=>x[0]===id);if(item){const keys=['force','vitesse','defense','intelligence','endurance','controle','courage'];v+=item[keys.indexOf(k)+2]||0}}return v}
function statLine(k){const base=S.stats[k]||0,eff=effectiveStat(k),bonus=eff-base;return `<div class="statrow"><span>${STAT_LABEL[k]}</span><b>${eff}${bonus?` <span class="muted">(+${bonus})</span>`:''}</b></div>`}
function generateNPCs(){const used=new Set();S.npcs=[];for(let i=0;i<10;i++){let n;do{n=`${pick(NAMES)} ${pick(SURNAMES)}`}while(used.has(n));used.add(n);const q=pick(QUIRKS);S.npcs.push({id:'npc'+i,name:n,age:13+rnd(3),class:`${rnd(2)?'4e':'3e'} ${String.fromCharCode(65+rnd(4))}`,trait:pick(TRAITS),goal:pick(['devenir héros','protéger sa famille','prouver sa valeur','entrer dans une bonne école','simplement profiter du collège']),quirk:q.name,alive:true,importance:i<4?'secondary':'background',relation:0,arc:0});S.relations[n]=0}}
function playerEffective(){return S.quirk?S.quirk.name:'Alter non révélé'}
function schoolContext(){return S.schoolYear==='4e'?'collège':'lycée'}
const EVENTS=[
{id:'arrival',title:'Une place à trouver',type:'Vie scolaire',once:true,text:()=>`La sonnerie vient de retentir. Dans la cour du collège, les groupes se forment naturellement : certains se connaissent depuis des années, d’autres cherchent encore où se placer. Tu repères ${S.npcs[0]?.name||'un élève'} près du portail.`,choices:[['Aller lui parler','Tu fais le premier pas. Cela pourrait devenir le début d’une vraie relation.',()=>relation(0,3)] ,['Observer avant de choisir','Tu préfères comprendre les dynamiques de la classe avant de t’impliquer.',()=>{S.stats.intelligence++;remember('Observation','Tu as pris le temps d’observer ta nouvelle classe.')}]]},
{id:'club',title:'Le club après les cours',type:'Vie scolaire',text:()=>`Après les cours, plusieurs portes sont ouvertes. Dans le gymnase, un petit groupe s’entraîne. Dans la salle d’à côté, des élèves montent un projet technique. Plus loin, quelqu’un travaille seul.`,choices:[['Rejoindre l’entraînement','Tu cherches à progresser physiquement.',()=>{S.stats.force++;S.stats.endurance++;remember('Entraînement','Tu as choisi l’entraînement physique.')}],['Aider au projet technique','Tu privilégies la compréhension et la préparation.',()=>{S.stats.intelligence++;S.stats.controle++;remember('Projet','Tu as participé à un projet technique.')}],['Rester seul et réfléchir','Tu prends du recul.',()=>{S.energy=Math.min(S.maxEnergy,S.energy+15);S.stats.courage++;}]]},
{id:'class-conflict',title:'Une remarque de trop',type:'Relation',text:()=>`Pendant un exercice, ${S.npcs[1]?.name||'un camarade'} critique ouvertement ta manière de faire. Ce n’est pas vraiment une insulte. C’est pire : il semble sincèrement penser que tu n’es pas à la hauteur.`,choices:[['Répondre calmement','Tu lui demandes ce qui lui fait penser ça.',()=>{relation(1,-1);S.stats.intelligence++;remember('Confrontation',`${S.npcs[1]?.name||'Un camarade'} a remis tes capacités en question.`)}],['Le provoquer en duel','Tu préfères répondre par les actes.',()=>{relation(1,-2);startCombat('rival')}],['Laisser passer','Tu refuses de lui donner de l’importance.',()=>{S.stats.courage++;relation(1,1)}]]},
{id:'friend-help',title:'Un camarade en difficulté',type:'Relation',text:()=>`${S.npcs[2]?.name||'Un camarade'} reste après les cours pour refaire un exercice. Tu comprends vite qu’il n’arrive pas à suivre et qu’il n’ose demander de l’aide à personne.`,choices:[['L’aider','Tu prends le temps de lui expliquer.',()=>{relation(2,4);S.stats.intelligence++;remember('Entraide',`${S.npcs[2]?.name||'Un camarade'} se souviendra de ton aide.`)}],['Lui proposer de travailler ensemble','Tu transformes la difficulté en entraînement commun.',()=>{relation(2,3);S.energy-=5}],['Partir','Tu as déjà suffisamment de choses à gérer.',()=>{relation(2,-1)}]]},
{id:'teacher',title:'Après le cours',type:'École',text:()=>`Ton professeur de collège te retient quelques minutes. Il ne parle pas de devenir héros. Il parle de discipline, de maîtrise de soi et de la manière dont tu réagis quand quelque chose ne se passe pas comme prévu.`,choices:[['Écouter réellement','Tu prends ses remarques au sérieux.',()=>{S.stats.intelligence++;S.stats.controle++;remember('Professeur','Un professeur a remarqué ton comportement.')}],['Défendre ton point de vue','Tu expliques pourquoi tu as agi comme tu l’as fait.',()=>{S.stats.courage++;}],['Changer de sujet','Tu n’as pas envie de parler de ça aujourd’hui.',()=>{S.energy=Math.min(S.maxEnergy,S.energy+8)}]]},
{id:'quirk-sign',title:'Quelque chose ne va pas',type:'Alter',need:()=>!S.quirk&&S.day>=3,text:()=>`Depuis quelques jours, tu remarques de petites anomalies. Un objet bouge légèrement lorsque tu es énervé. Ou peut-être que tu l’as simplement imaginé. Aujourd’hui, le phénomène est trop net pour être ignoré.`,choices:[['Chercher à reproduire le phénomène','Tu expérimentes prudemment.',()=>discoverQuirk(false)],['En parler à un adulte','Tu préfères ne pas prendre de risque.',()=>discoverQuirk(true)],['Faire comme si de rien n’était','Tu gardes le doute pour toi.',()=>{S.stats.courage++;S.storyFlags.quirkDelay=true}]]},
{id:'exam',title:'Le bilan médical',type:'Alter',need:()=>!S.quirk&&S.day>=5,text:()=>`Un contrôle médical scolaire approche. Tu pourrais profiter de l’examen pour demander des informations plus précises sur ton facteur d’Alter. Mais une fois les résultats obtenus, il sera difficile de continuer à faire semblant de ne rien savoir.`,choices:[['Faire les examens','Tu veux enfin une réponse.',()=>discoverQuirk(true)],['Attendre encore','Tu préfères garder cette part d’inconnu.',()=>{S.stats.courage++;S.storyFlags.quirkDelay=true}]]},
{id:'training',title:'Un entraînement qui tourne mal',type:'Entraînement',text:()=>`Le gymnase est presque vide. Avec deux camarades, tu improvises un exercice. Au départ tout se passe bien. Puis quelqu’un perd le contrôle et le matériel vole dans ta direction.`,choices:[['Protéger ton camarade','Tu prends le risque d’intervenir.',()=>{S.stats.courage++;S.energy-=8;startCombat('accident')}],['Esquiver et analyser','Tu cherches la meilleure réaction plutôt que la plus spectaculaire.',()=>{S.stats.vitesse++;S.stats.intelligence++;}],['Arrêter l’exercice','Tu préfères éviter qu’un accident arrive.',()=>{S.stats.defense++;S.energy+=5}]]},
{id:'npc-news',title:'Quelqu’un a changé',type:'Monde',text:()=>{const n=S.npcs.find(x=>x.importance==='secondary'&&x.arc>0)||S.npcs[3];return `${n?.name||'Un élève'} n’est plus exactement la même personne qu’il y a quelques semaines. Son comportement a changé et plusieurs élèves commencent à le remarquer.`},choices:[['Lui demander ce qui se passe','Tu t’intéresses directement à son changement.',()=>{const i=3;relation(i,3);S.npcs[i].arc++;remember('Changement',`${S.npcs[i].name} semble suivre une nouvelle voie.`)}],['Observer à distance','Tu cherches à comprendre avant d’intervenir.',()=>{S.stats.intelligence++;S.npcs[3].arc++;}],['Ne pas t’en mêler','Tu as tes propres problèmes.',()=>{S.stats.courage++;}]]},
{id:'rumor',title:'Une rumeur circule',type:'Monde',text:()=>`À la pause, une rumeur circule dans les couloirs : un élève du collège aurait manifesté un Alter inhabituel. Personne ne sait exactement ce qui s’est passé.`,choices:[['Chercher la vérité','Tu veux savoir ce qui s’est réellement passé.',()=>{S.stats.intelligence++;S.rep++;remember('Rumeur','Une rumeur sur un Alter inhabituel circule au collège.')}],['Ignorer la rumeur','Tu ne veux pas participer aux racontars.',()=>{S.stats.courage++;}],['Demander à quelqu’un de confiance','Tu évites les spéculations et cherches une source fiable.',()=>{relation(0,1);S.stats.intelligence++;}]]}
];
function remember(title,text){log(title,text);S.seasonActions.push({title,text});}
function relation(i,delta){const n=S.npcs[i];if(!n)return; n.relation=clamp((n.relation||0)+delta,-100,100);S.relations[n.name]=n.relation;remember('Relation',`${n.name} : ${delta>0?'ta relation se rapproche.':'une distance s’installe.'}`)}
function discoverQuirk(adult){if(S.quirk)return;S.quirk=JSON.parse(JSON.stringify(pick(QUIRKS)));S.quirkXP=0;S.techniques={};S.quirk.tech.forEach((_,i)=>{if(i===0)S.techniques[i]=1});remember('Découverte de l’Alter',`Ton Alter est ${S.quirk.name}. ${S.quirk.desc}`);if(adult)S.rep++;}
function availableEvents(){let pool=EVENTS.filter(e=>(!e.need||e.need())&&(!e.once||!S.seenEvents[e.id]));if(!pool.length)pool=EVENTS.filter(e=>(!e.need||e.need())&&((S.seenEvents[e.id]||0)<2));if(!pool.length)pool=EVENTS;pool.sort((a,b)=>(S.seenEvents[a.id]||0)-(S.seenEvents[b.id]||0));return pool.slice(0,5)}
function generateScene(){const pool=availableEvents();let e=pick(pool.slice(0,Math.min(3,pool.length)));if(scene&&pool.length>1){const alt=pool.filter(x=>x.id!==scene.id);e=pick(alt)}scene=e;S.seenEvents[e.id]=(S.seenEvents[e.id]||0)+1;S.action++;S.day++;worldTick();save();render();}
function worldTick(){S.npcs.forEach(n=>{if(Math.random()<.22){n.arc+=1;if(Math.random()<.12)S.worldNews.unshift(`${n.name} poursuit son propre objectif : ${n.goal}.`)}});S.worldNews=S.worldNews.slice(0,12);if(S.action>0&&S.action%7===0)endSeason()}
function choose(i){if(!scene)return;const c=scene.choices[i];if(!c)return;const id=scene.id;scene=null;let result='';try{result=c[2]()}catch(e){result='Une erreur inattendue est survenue, mais ta progression a été conservée.';console.error(e)}remember('Décision',result||`Tu as choisi : ${c[0]}`);save();if(!combat){render();setTimeout(()=>generateScene(),250)}else render()}
function startCombat(kind){combat={kind,turn:1,enemy:kind==='rival'?{name:'Daichi',hp:70,maxHp:70,attack:9,quirk:'Renforcement',analyzed:0}:kind==='accident'?{name:'Exercice instable',hp:55,maxHp:55,attack:7,quirk:'Inconnu',analyzed:0}:{name:'Adversaire',hp:65,maxHp:65,attack:8,quirk:'Inconnu',analyzed:0},guard:false,stun:0,log:[],ended:false};S.energy=Math.min(S.maxEnergy,S.energy+10);render();}
function combatAction(type,index=null){if(!combat||combat.ended)return;let c=combat, e=c.enemy;let msg='';c.guard=false;if(type==='attack'){const dmg=Math.max(1,Math.round(7+effectiveStat('force')*.55+rnd(5)));e.hp=clamp(e.hp-dmg,0,e.maxHp);msg=`Tu frappes et infliges ${dmg} dégâts.`}else if(type==='guard'){c.guard=true;msg='Tu adoptes une posture défensive. Les prochains dégâts seront fortement réduits.'}else if(type==='analyze'){e.analyzed++;msg=e.analyzed>=2?`Tu comprends mieux son Alter : ${e.quirk}.`:`Tu observes ses mouvements. Encore une analyse pourrait révéler davantage.`;S.stats.intelligence++}else if(type==='tech'){const t=S.quirk?.tech[index];if(!t||!S.techniques[index])return;if(S.energy<t[2]){msg='Tu n’as pas assez d’énergie pour utiliser cette technique.'}else{S.energy-=t[2];if(t[3]==='damage'){const dmg=Math.max(2,Math.round((8+effectiveStat('force')*.45)*t[4]));e.hp=clamp(e.hp-dmg,0,e.maxHp);msg=`${t[0]} inflige ${dmg} dégâts.`;S.quirkXP+=4}else if(t[3]==='guard'){c.guard=true;msg=`${t[0]} réduit fortement les dégâts du prochain tour.`;S.quirkXP+=3}else if(t[3]==='stun'){const dmg=Math.max(1,Math.round(5+effectiveStat('controle')*.3));e.hp=clamp(e.hp-dmg,0,e.maxHp);c.stun=1;msg=`${t[0]} inflige ${dmg} dégâts et déséquilibre l’adversaire.`;S.quirkXP+=5}}}else if(type==='flee'){if(Math.random()<.45){endCombat(false,'Tu parviens à quitter le combat.');return}else msg='Tu n’arrives pas à trouver une ouverture pour fuir.'}c.log.unshift(msg);if(e.hp<=0){endCombat(true,'Victoire !');return}if(c.stun){c.stun=0;c.log.unshift('L’adversaire est encore déséquilibré et perd son tour.')}else{let dmg=Math.max(1,e.attack+rnd(5)-Math.floor(effectiveStat('defense')*.25));if(c.guard)dmg=Math.max(1,Math.round(dmg*.35));S.hp=clamp(S.hp-dmg,0,S.maxHp);c.log.unshift(`${e.name} te touche et inflige ${dmg} dégâts.`);if(S.hp<=0){endCombat(false,'Tu es mis hors de combat.');return}}c.turn++;if(S.quirk&&S.quirkXP>=12&&Object.keys(S.techniques).length<2){S.techniques[1]=1;c.log.unshift(`✨ Nouvelle technique maîtrisée : ${S.quirk.tech[1][0]}.`)}save();render()}
function endCombat(win,text){combat.ended=true;combat.log.unshift(text);if(win){const heal=Math.round(S.maxHp*.28);const en=Math.round(S.maxEnergy*.25);S.hp=clamp(S.hp+heal,0,S.maxHp);S.energy=clamp(S.energy+en,0,S.maxEnergy);S.quirkXP+=6;remember('Combat',`${text} Tu récupères ${heal} PV et ${en} énergie après l’affrontement.`)}else{S.hp=Math.max(1,Math.round(S.maxHp*.2));remember('Combat',text)}save();render()}
function endSeason(){if(S.seasonSummary)return;const important=S.seasonActions.slice(-8);S.seasonSummary={season:S.season,actions:S.action,highlights:important.map(x=>x.text).slice(-5),consequences:[...new Set(S.seasonActions.map(x=>x.title))].slice(-6)};S.seasonHistory.push(S.seasonSummary);S.season++;S.seasonActions=[];S.action=0;S.hp=clamp(S.hp+Math.round(S.maxHp*.45),0,S.maxHp);S.energy=S.maxEnergy;S.seasonSummary.pending=true;log('Fin de saison',`La saison ${S.season-1} se termine. Ton parcours a laissé des traces.`);save()}
function upgradeTech(){if(!S.quirk)return;const next=Object.keys(S.techniques).length;if(next<S.quirk.tech.length&&S.quirkXP>=12+next*10){S.techniques[next]=1;S.quirkXP=0;remember('Maîtrise d’Alter',`Tu débloques ${S.quirk.tech[next][0]}.`);save();render()}}
function equip(slot,id){S.equipment[slot]=id;save();render()}
function unequip(slot){S.equipment[slot]=null;save();render()}
function createPlayer(){const name=$('pname').value.trim();if(!name){alert('Choisis un prénom ou un nom pour commencer.');return}S=baseState();S.player.name=name;S.player.age=Number($('page').value)||14;S.player.gender=$('pgender').value;S.player.personality=$('ppers').value;generateNPCs();S.started=true;log('Début',`${name} commence son histoire au collège.`);closeModal();generateScene()}
function startNew(){S=null;scene=null;combat=null;openCreation()}
function resume(){if(!load()){alert('Aucune sauvegarde trouvée.');return}scene=null;combat=null;render()}
function openCreation(){ $('modal').innerHTML=`<div class="card"><h2>Créer ton personnage</h2><p class="muted">Tu as 14 ans et tu commences au collège. Ton parcours héroïque n’est pas encore écrit. Ton Alter sera découvert par l’histoire, pas choisi dans un menu.</p><div class="field"><label>Nom / prénom</label><input id="pname" maxlength="24" placeholder="Ex. Ethan"></div><div class="field"><label>Âge</label><select id="page"><option>13</option><option selected>14</option><option>15</option></select></div><div class="field"><label>Genre</label><select id="pgender"><option>Non précisé</option><option>Garçon</option><option>Fille</option><option>Autre</option></select></div><div class="field"><label>Personnalité dominante</label><select id="ppers"><option>Curieux</option><option>Ambitieux</option><option>Protecteur</option><option>Prudent</option><option>Provocateur</option></select></div><div class="notice">Tes choix influencent la manière dont certaines situations apparaîtront, mais ils ne verrouillent pas ton personnage.</div><div class="footer-actions"><button class="primary" onclick="createPlayer()">Commencer l’histoire</button><button onclick="closeModal()">Annuler</button></div></div>`;$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}
function exportSave(){if(!S)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='mha-road-v16.2-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function importSave(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=normalize(JSON.parse(r.result));save();scene=null;combat=null;render()}catch(e){alert('Sauvegarde invalide.')}};r.readAsText(f)};i.click()}
function newGame(){if(confirm('Recommencer une nouvelle partie ?')){localStorage.removeItem(KEY);startNew()}}
function tab(t){activeTab=t;render()}
function renderMenu(){ $('root').innerHTML=`<div class="app menu"><div class="card"><h1>MHA Road</h1><p class="subtitle">V16.2 — RPG narratif au collège</p><div class="feature"><div>👥 <b>PNJ vivants</b><br><span class="muted">Des camarades avec leurs propres objectifs.</span></div><div>🧬 <b>Alter évolutif</b><br><span class="muted">Techniques découvertes et maîtrisées en jouant.</span></div><div>📖 <b>Saisons</b><br><span class="muted">Arcs, conséquences et résumés.</span></div><div>⚔️ <b>Combats tactiques</b><br><span class="muted">PV, énergie, techniques et décisions.</span></div></div><button class="primary" style="width:100%;margin:5px 0" onclick="startNew()">✨ Nouvelle partie</button><button style="width:100%;margin:5px 0" onclick="resume()">▶️ Continuer</button><button style="width:100%;margin:5px 0" onclick="importSave()">📦 Importer une sauvegarde</button><p class="small muted">Version ${VERSION} • sauvegarde locale</p></div></div>`}
function render(){if(!S||!S.started){renderMenu();return}const eff={hp:S.hp,maxHp:S.maxHp,en:S.energy,maxEn:S.maxEnergy};$('root').innerHTML=`<div class="app"><div class="topbar"><div class="brand"><div><h1>MHA Road</h1><span class="small muted">Saison ${S.season} • Action ${S.action}</span></div><span class="tag">${schoolContext()}</span></div></div><div class="hero"><div class="herohead"><div><h2>${escapeHTML(S.player.name)}</h2><div class="muted small">${S.player.age} ans • ${escapeHTML(S.school)}</div></div><span class="tag">${escapeHTML(playerEffective())}</span></div></div><div class="hud"><div class="box">❤️ <b>${eff.hp}/${eff.maxHp}</b><div class="bar hpbar"><i style="width:${eff.hp/eff.maxHp*100}%"></i></div></div><div class="box">⚡ <b>${eff.en}/${eff.maxEn}</b><div class="bar energybar"><i style="width:${eff.en/eff.maxEn*100}%"></i></div></div><div class="box">💰 <b>${S.money} ¥</b></div></div><div class="nav">${[['story','📖 Histoire'],['character','👤 Personnage'],['alter','🧬 Alter'],['world','🌍 Monde'],['equip','🎒 Équipement'],['journal','📜 Journal']].map(x=>`<button class="${activeTab===x[0]?'active':''}" onclick="tab('${x[0]}')">${x[1]}</button>`).join('')}</div><div id="content"></div></div>`;renderTab()}
function renderTab(){const c=$('content');if(activeTab==='story')renderStory(c);else if(activeTab==='character')renderCharacter(c);else if(activeTab==='alter')renderAlter(c);else if(activeTab==='world')renderWorld(c);else if(activeTab==='equip')renderEquip(c);else renderJournal(c)}
function renderStory(c){let h='';if(S.seasonSummary?.pending){h+=`<div class="card season-end"><h2>🎬 Résumé de la saison ${S.season-1}</h2><p>Cette saison a changé quelque chose dans ton parcours. Voici les moments que le monde retiendra.</p><ul>${S.seasonSummary.highlights.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul><p><b>Conséquences :</b> ${S.seasonSummary.consequences.join(' • ')}</p><button class="primary" onclick="S.seasonSummary=null;save();render()">Continuer vers la saison ${S.season}</button></div>`}if(combat){h+=renderCombat();}else if(scene){h+=`<div class="card"><div class="muted small">${scene.type} • Jour ${S.day}</div><h2 class="scene-title">${escapeHTML(scene.title)}</h2><p class="scene-text">${escapeHTML(scene.text())}</p>${scene.choices.map((x,i)=>`<button class="choice" onclick="choose(${i})"><strong>${escapeHTML(x[0])}</strong><span>${escapeHTML(x[1])}</span></button>`).join('')}</div>`}else h+=`<div class="card"><p>Le monde continue autour de toi.</p><button class="primary" onclick="generateScene()">Continuer</button></div>`;h+=`<div class="card"><div class="section-title"><h3>Résumé actuel</h3><span class="pill">${S.seasonActions.length} événements</span></div><p class="muted">${escapeHTML(S.seasonActions.slice(-2).map(x=>x.text).join(' '))||'Ta saison commence à peine.'}</p></div>`;c.innerHTML=h}
function renderCombat(){const e=combat.enemy;const q=S.quirk;return `<div class="card combatbox"><div class="section-title"><h2>⚔️ Combat — Tour ${combat.turn}</h2><span class="tag">${combat.kind==='rival'?'Duel scolaire':'Situation imprévue'}</span></div><p><b>${escapeHTML(e.name)}</b> • Alter : ${e.analyzed>=2?escapeHTML(e.quirk):'???'}</p><div>❤️ ${e.hp}/${e.maxHp}<div class="bar hpbar"><i style="width:${e.hp/e.maxHp*100}%"></i></div></div><hr style="border-color:var(--line);border-width:1px 0 0;margin:12px 0"><p><b>${escapeHTML(S.player.name)}</b> • ❤️ ${S.hp}/${S.maxHp} • ⚡ ${S.energy}/${S.maxEnergy}</p>${combat.ended?`<div class="notice"><b>${escapeHTML(combat.log[0]||'Combat terminé.')}</b><div class="log">${combat.log.slice(1,5).map(x=>`<div>${escapeHTML(x)}</div>`).join('')}</div></div><button class="primary" style="margin-top:9px" onclick="combat=null;generateScene()">Continuer</button>`:`<div class="combat-actions"><button class="choice" onclick="combatAction('attack')"><strong>⚔️ Attaquer</strong><span>7 + Force × 0,55 dégâts environ. Coût faible.</span></button><button class="choice" onclick="combatAction('guard')"><strong>🛡️ Garde</strong><span>Réduit fortement les dégâts du prochain tour.</span></button><button class="choice" onclick="combatAction('analyze')"><strong>🔎 Analyser</strong><span>Révèle progressivement l’Alter ennemi et augmente ta compréhension.</span></button><button class="choice" onclick="combatAction('flee')"><strong>↩️ Repli</strong><span>45 % de chance de quitter le combat immédiatement.</span></button></div>${q?`<h3>🧬 Techniques de ${escapeHTML(q.name)}</h3><div class="combat-actions">${q.tech.map((t,i)=>`<button class="choice tech ${S.techniques[i]?'':'locked'}" onclick="combatAction('tech',${i})"><strong>${S.techniques[i]?'🧬':'🔒'} ${escapeHTML(t[0])}</strong><span>${escapeHTML(t[1])} • ${t[2]} énergie${S.techniques[i]?'':' • à maîtriser'}</span></button>`).join('')}</div>`:'<div class="notice">Ton Alter n’est pas encore révélé. Le combat repose pour l’instant sur tes capacités naturelles.</div>'}<div class="log" style="margin-top:10px">${combat.log.slice(0,5).map(x=>`<div class="logitem">${escapeHTML(x)}</div>`).join('')}</div>`}</div>`}
function renderCharacter(c){c.innerHTML=`<div class="card"><h2>👤 Personnage</h2><p>${escapeHTML(S.player.name)} • ${S.player.age} ans • ${escapeHTML(S.player.personality)}</p><div>${Object.keys(STAT_LABEL).map(statLine).join('')}</div><div class="notice" style="margin-top:12px">Les nombres hors parenthèses sont tes capacités naturelles. Les <b>(+X)</b> viennent de ton équipement actuellement porté.</div></div><div class="card"><h3>Progression</h3><p>Réputation : <b>${S.rep}</b></p><p>Jours vécus : <b>${S.day}</b></p><p>Décisions mémorisées : <b>${S.decisions.length+S.memories.length}</b></p></div>`}
function renderAlter(c){if(!S.quirk){c.innerHTML=`<div class="card"><h2>🧬 Alter</h2><h3>Alter non révélé</h3><p>Tu es encore au collège. Ton potentiel peut se manifester naturellement au fil de l'histoire.</p><div class="notice">Ne cherche pas à choisir ton Alter : découvre-le en vivant ton histoire.</div></div>`;return}const q=S.quirk;c.innerHTML=`<div class="card"><h2>🧬 ${escapeHTML(q.name)}</h2><p><span class="tag">${escapeHTML(q.family)}</span></p><p>${escapeHTML(q.desc)}</p><p class="muted">Contrecoup : ${escapeHTML(q.weak)}</p><p>Maîtrise : <b>${S.quirkXP} XP</b></p><h3>Techniques</h3>${q.tech.map((t,i)=>`<div class="statrow"><span><b>${S.techniques[i]?'':'🔒 '}${escapeHTML(t[0])}</b><br><span class="muted">${escapeHTML(t[1])}</span></span><span>${t[2]}⚡</span></div>`).join('')}<button class="good" style="margin-top:10px" onclick="upgradeTech()">Développer une nouvelle technique</button></div>`}
function renderWorld(c){c.innerHTML=`<div class="card"><h2>🌍 Monde vivant</h2><p class="muted">Tes camarades poursuivent leurs propres objectifs, même lorsque tu ne les regardes pas.</p>${S.npcs.map((n,i)=>`<div class="npc" style="margin:8px 0"><h4>${escapeHTML(n.name)} <span class="pill">${n.age} ans • ${escapeHTML(n.class)}</span></h4><div class="small muted">${escapeHTML(n.trait)} • objectif : ${escapeHTML(n.goal)}</div><div class="small">Alter : ${escapeHTML(n.quirk)} • relation : ${n.relation}</div></div>`).join('')}</div><div class="card"><h3>📰 Ce qui se passe sans toi</h3>${S.worldNews.length?S.worldNews.map(x=>`<p class="logitem">${escapeHTML(x)}</p>`).join(''):'<p class="muted">Pour l’instant, le collège est calme.</p>'}</div>`}
function renderEquip(c){c.innerHTML=`<div class="card"><h2>🎒 Équipement</h2><p class="muted">Un seul objet par emplacement. Les bonus sont appliqués aux statistiques effectives.</p>${Object.entries(EQUIP).map(([slot,items])=>{const current=S.equipment[slot];return `<div class="card" style="margin:9px 0"><div class="section-title"><b>${slot==='head'?'Tête':slot==='torso'?'Torse':slot==='arms'?'Bras':slot==='legs'?'Jambes':'Support'}</b>${current?`<button onclick="unequip('${slot}')">Retirer</button>`:''}</div>${items.map(it=>`<div class="statrow"><span><b>${escapeHTML(it[0])}</b><br><span class="muted">${escapeHTML(it[1])}</span></span><button ${current===it[0]?'disabled':''} onclick="equip('${slot}','${it[0].replace(/'/g,"\\'")}')">${current===it[0]?'Équipé':'Équiper'}</button></div>`).join('')}</div>`}).join('')}</div>`}
function renderJournal(c){c.innerHTML=`<div class="card"><h2>📜 Journal</h2>${S.timeline.length?`<div class="log">${[...S.timeline].reverse().map(x=>`<div class="logitem"><span class="small muted">Saison ${x.season} • jour ${x.day} • ${escapeHTML(x.kind)}</span><br>${escapeHTML(x.text)}</div>`).join('')}</div>`:'<p class="muted">Ton histoire commence ici.</p>'}</div><div class="card"><div class="footer-actions"><button onclick="save()">💾 Sauvegarder</button><button onclick="exportSave()">📦 Exporter</button><button onclick="importSave()">📥 Importer</button><button class="danger" onclick="newGame()">↻ Nouvelle partie</button></div></div>`}
window.addEventListener('beforeunload',save);if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});renderMenu();
</script>
</body>
</html>
