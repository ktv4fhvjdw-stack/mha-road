 if(!S.alter||S.noAlter){S.summary='Tu n’as pas d’Alter à expérimenter pour le moment.';return null;}
 if(S.cooldowns.experiment>S.day){S.summary=`Ton corps a besoin de récupérer avant une nouvelle expérimentation. Encore ${S.cooldowns.experiment-S.day} jour(s).`;return null;}

function chooseWeighted(cs){let recent=new Set(S.recentEvents.slice(-5));let usable=cs.filter(x=>!recent.has(x.title));if(!usable.length)usable=cs;let total=usable.reduce((a,x)=>a+(x.weight||1),0),r=Math.random()*total;for(const x of usable){r-=x.weight||1;if(r<=0)return x}return usable[0]}

}
function maybeArc(){if(S.arc&&!S.arc.closed)return; if(chance(.08)){let n=getNPC();S.arc={title:'Une piste qui ne disparaît pas',stage:1,setup:`Depuis quelques jours, plusieurs détails autour de ${n.name} ne concordent pas.`,follow:`La piste se précise. ${n.name} semble lié à une décision prise par ${S.factions[n.faction].name}.`,targetPlace:n.place,faction:n.faction,pending:true,closed:false};} }
function discoverAFO(){if(!S.noAlter||!S.latentAFO||S.alter||S.flags.afoDiscovered)return false;if(S.day<12)return false;if(!chance(.035))return false;S.flags.afoDiscovered=true;S.alterStatus='revealed';S.alter=alterGenerate(['Échange','Absorption','Concept'].includes(pick(FAMILY)[0])?pick(FAMILY):FAMILY[29],true);S.alter.name='All For One';S.alter.desc='Un Alter capable de percevoir, extraire et conserver certaines propriétés d’autres Alters, sous des conditions encore inconnues.';S.summary='Tu découvres que ton absence apparente d’Alter cachait quelque chose de beaucoup plus dangereux.';remember(S.summary,'revelation','character');timeline('Révélation','Ton Alter latent commence à se manifester.','afo');return true}
function maybeOFA(){if(S.ofa||S.flags.ofaThread)return false;if(S.noAlter&&S.flags.afoDiscovered)return false;if(S.day<25)return false;if(!chance(.012))return false;S.flags.ofaThread=true;S.ofa={stage:1,focus:null,inheritScore:0};S.summary='Quelqu’un semble avoir remarqué quelque chose dans ta manière de réagir sous pression.';remember(S.summary,'secret','character');return true}
function stealAFO(){if(!S.alter||S.alter.name!=='All For One')return`Tu ne possèdes pas encore ce pouvoir.`;let target=S.npcs.find(n=>n.alter&&n.known&&relation(n).trust<0&&n.alive);if(!target)return`Tu ne trouves aucune cible dont tu comprends suffisamment l’Alter pour tenter un vol.`;if(!chance(.45)){S.hp=clamp(S.hp-8,1,S.maxHp);return`Tu essaies de forcer le mécanisme, mais échoues. Le contrecoup te blesse.`}S.stolen.push({from:target.id,alter:structuredClone(target.alter),mastery:0});target.alter=null;return`Tu réussis à arracher l’Alter de ${target.name}. Il est maintenant stocké en toi, mais tu ne le maîtrises pas.`}
function afoScene(){scene={kind:'afo',title:'Le pouvoir que tu n’avais jamais compris',text:'Ton Alter réagit à la présence d’un autre pouvoir. Pour la première fois, tu comprends instinctivement comment il fonctionne.',choices:[
 ['Analyser sans toucher',()=>{S.flags.afoAnalyze=true;return`Tu comprends une partie du mécanisme sans prendre le risque de le voler.`}],
 ['Chercher à voler un Alter',()=>stealAFO()],
 ['Ne rien tenter',()=>`Tu refuses de céder à l’instinct. Cette maîtrise pourrait te protéger plus tard.`]
 ]};}
function applyResult(result){if(result===null)return;if(result)S.summary=result;S.day++;S.seasonActions++;S.energy=clamp(S.energy+4,0,S.maxEnergy);npcTick();maybeArc();discoverAFO();maybeOFA();if(S.seasonActions>=8){S.season++;S.seasonActions=0;S.seasonHistory.unshift(`Fin de la saison ${S.season}.`);S.hp=S.maxHp;S.energy=S.maxEnergy;S.summary=(S.summary||'')+' La saison se termine : tu récupères complètement et de nouveaux enjeux apparaissent.'}save();scene=null;render()}
function choose(i){if(!scene)return;let fn=scene.choices[i]?.[1];if(!fn)return;let result=fn();if(combat)return render();applyResult(result)}
function startCombat(force=false){if(S.cooldowns.combat>S.day&&!force)return`Tu n’es pas encore remis de ton dernier affrontement.`;let e=pick(S.npcs.filter(n=>n.role==='villain'&&n.alive&&(!n.known||relation(n).rivalry>0)))||npc('villain');e.known=true;combat={enemy:{id:e.id,name:e.name,hp:55+e.alter?.level*8||55,maxHp:55+e.alter?.level*8||55,alter:e.alter},turn:1,log:['Le combat commence.'],ended:false,guard:false};S.cooldowns.combat=S.day+2;render();return null}
function fight(type,index=0){if(!combat||combat.ended)return;if(type==='guard'){combat.guard=true;combat.log.unshift('Tu te protèges et observes.')}else if(type==='analyze'){if(combat.enemy.alter){combat.enemy.alter.known=true;combat.log.unshift(`Tu comprends mieux l’Alter de ${combat.enemy.name}.`);S.memories.unshift({day:S.day,text:`Alter de ${combat.enemy.name} analysé.`})}}else if(type==='attack'){let d=Math.max(4,Math.round(5+effective('force')*.6+rnd(6)));combat.enemy.hp-=d;combat.log.unshift(`Ton attaque inflige ${d} dégâts.`)}else if(type==='tech'){let t=S.alter?.techniques[index];if(!t||S.energy<t.cost)return;S.energy-=t.cost;let d=Math.max(5,Math.round((effective(t.effect==='guard'?'defense':'force')*.45)*t.power));combat.enemy.hp-=d;combat.log.unshift(`${t.name} inflige ${d} dégâts.`)}if(combat.enemy.hp<=0){combat.ended=true;S.summary=`Victoire contre ${combat.enemy.name}.`;S.hp=clamp(S.hp+18,1,S.maxHp);S.energy=clamp(S.energy+10,0,S.maxEnergy);rep('hero',1);timeline('Combat',S.summary,'combat');save();render();return}let d=Math.max(3,Math.round(7+rnd(8)-effective('defense')*.2));if(combat.guard)d=Math.round(d*.45);combat.guard=false;S.hp=clamp(S.hp-d,0,S.maxHp);combat.log.unshift(`${combat.enemy.name} te touche pour ${d} dégâts.`);if(S.hp<=0){S.hp=Math.round(S.maxHp*.25);S.summary='Tu es mis hors de combat et dois te remettre.';combat.ended=true}save();render()}
const ITEMS=[['head','Casque léger',{defense:1},180],['body','Veste renforcée',{defense:2,endurance:1},320],['hands','Gants techniques',{technique:2,controle:1},400],['feet','Chaussures de mobilité',{vitesse:2},360],['tool','Analyseur portable',{intelligence:2,controle:1},500],['tool','Kit médical',{endurance:2},420],['body','Protection souple',{endurance:2},280]];
function buy(id){let it=ITEMS.find(x=>x[1]===id);if(!it||S.money<it[3])return;S.money-=it[3];S.equipment.owned.push({id:id+'_'+Date.now(),slot:it[0],name:it[1],bonus:it[2]});S.summary=`Tu achètes ${it[1]}.`;save();render()}
function equip(id){let x=S.equipment.owned.find(i=>i.id===id);if(!x)return;S.equipment.slots[x.slot]=x.id;S.summary=`Tu équipes ${x.name}.`;save();render()}
function creation(){modal(`<h2>Créer ton personnage</h2><div class="field"><label>Nom</label><input id="name" placeholder="Ton nom"></div><div class="field"><label>Genre</label><select id="gender"><option>Non précisé</option><option>Garçon</option><option>Fille</option></select></div><div class="field"><label>Personnalité</label><select id="pers">${PERSONAL.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Origine</label><select id="origin"><option value="alter">Alter apparent</option><option value="none">Aucun Alter apparent</option></select></div><p class="muted small">Ton âge de départ est 14 ans. Un personnage Sans Alter peut suivre une vraie progression physique, technique, stratégique et sociale. Une anomalie AFO existe seulement pour une infime minorité.</p><div class="two"><button onclick="closeModal()">Annuler</button><button class="primary" onclick="start()">Commencer</button></div>`)}
function start(){S=base();S.started=true;S.player={name:$('name').value.trim()||'Sans nom',gender:$('gender').value,personality:$('pers').value};S.noAlter=$('origin').value==='none';S.latentAFO=S.noAlter&&chance(.018);if(!S.noAlter){S.alter=alterGenerate();S.alterStatus='known';}else S.alterStatus='none';buildWorld();closeModal();S.summary=`Ton histoire commence. Tu as ${S.age} ans.`;remember(S.summary,'start');save();startScene()}
function modal(html){$('modal').innerHTML='<div>'+html+'</div>';$('modal').classList.remove('hidden')};function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}
function newGame(){if(confirm('Effacer la partie actuelle ?')){localStorage.removeItem(KEY);S=null;scene=null;combat=null;renderMenu()}}
function exportSave(){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mha-road-v20-save.json';a.click();URL.revokeObjectURL(a.href)}
function importSave(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let f=i.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{S=normalize(JSON.parse(r.result));S.started=true;save();render()}catch(e){alert('Sauvegarde invalide')}};r.readAsText(f)};i.click()}
function renderMenu(){$('root').innerHTML=`<div class="app"><div class="card"><span class="tag">V20 • moteur refondu</span><h1>MHA Road</h1><p class="story">Un RPG narratif procédural dans l’univers de My Hero Academia.</p><div class="grid"><div class="card"><b>🧬 36 familles</b><div class="small muted">Alters composés et évolutifs.</div></div><div class="card"><b>🌍 Monde vivant</b><div class="small muted">PNJ, relations et factions évoluent.</div></div><div class="card"><b>🧠 Mémoire</b><div class="small muted">Les choix laissent des traces.</div></div><div class="card"><b>⚡ AFO / OFA</b><div class="small muted">Voies rares et conditionnelles.</div></div></div><button class="primary" style="width:100%" onclick="creation()">▶ Nouvelle partie</button>${load()?'<button style="width:100%;margin-top:8px" onclick="S=load();render()">↩ Continuer</button>':''}<button style="width:100%;margin-top:8px" onclick="importSave()">📥 Importer</button></div></div>`}
function render(){if(!S||!S.started){renderMenu();return}let hp=100*S.hp/S.maxHp,en=100*S.energy/S.maxEnergy;$('root').innerHTML=`<div class="app"><div class="top"><div class="hud"><div class="meter"><b>❤️ ${S.hp}/${S.maxHp}</b><div class="bar"><i style="width:${hp}%"></i></div></div><div class="meter energy"><b>⚡ ${S.energy}/${S.maxEnergy}</b><div class="bar"><i style="width:${en}%"></i></div></div><div class="meter money"><b>💰 ${S.money}¥</b><span class="small">Jour ${S.day} • ${S.age} ans</span></div></div><div class="tabs">${[['story','Histoire'],['char','Personnage'],['alter','Alter'],['world','Monde'],['gear','Équipement'],['journal','Journal']].map(([k,v])=>`<button onclick="activeTab='${k}';render()">${v}</button>`).join('')}</div></div>${activeTab==='story'?story():activeTab==='char'?character():activeTab==='alter'?alterView():activeTab==='world'?worldView():activeTab==='gear'?gearView():journal()}</div>`}
function story(){let html='';if(S.summary)html+=`<div class="card"><span class="tag">Ce qui vient de se passer</span><p>${S.summary}</p><button onclick="S.summary='';render()">Continuer</button></div>`;if(combat)return html+combatView();if(scene){html+=`<div class="card"><span class="tag">${scene.kind}</span><h2 class="eventTitle">${scene.title}</h2><p class="story">${scene.text}</p>`;scene.choices.forEach((c,i)=>html+=`<button class="choice" onclick="choose(${i})">${c[0]}</button>`);html+='</div>'}else html+=`<div class="card"><h2>Que fais-tu ?</h2><button class="primary" onclick="startScene()">Poursuivre la journée</button>${S.alter&&!S.noAlter?`<button class="choice" onclick="doExperiment()">🧪 Expérimenter ${S.cooldowns.experiment>S.day?'(repos nécessaire)':''}</button>`:''}<button class="choice" onclick="startCombat()">⚔️ Chercher une confrontation</button></div>`;return html}
function combatView(){let e=combat.enemy;return `<div class="card dangerCard"><span class="tag">Combat</span><h2>${e.name}</h2><p>PV adverse : ${e.hp}/${e.maxHp}</p>${combat.log.slice(0,7).map(x=>`<div class="log">${x}</div>`).join('')}${combat.ended?`<button onclick="combat=null;applyResult('')">Continuer</button>`:`<div class="two"><button onclick="fight('attack')">Attaquer</button><button onclick="fight('guard')">Se défendre</button><button onclick="fight('analyze')">Analyser</button>${S.alter?.techniques?.map((t,i)=>`<button onclick="fight('tech',${i})">${t.name}</button>`).join('')}</div>`}</div>`}
function character(){return `<div class="card"><h2>${S.player.name}</h2><p>${S.player.personality} • ${S.noAlter?'Sans Alter apparent':S.alter?.name||'Inconnu'}</p><div class="grid">${Object.entries(S.stats).map(([k,v])=>`<div class="meter"><b>${k}</b><span>${effective(k)}</span></div>`).join('')}</div><h3>Dernières traces</h3>${S.memories.slice(0,8).map(m=>`<div class="log"><span class="small muted">J${m.day}</span> ${m.text}</div>`).join('')}</div>`}
function alterView(){if(!S.alter)return `<div class="card"><h2>Alter</h2><p class="muted">Aucun Alter apparent. Ta progression passe par ton corps, ta technique, ton intelligence, ton équipement et tes relations.</p></div>`;let a=S.alter;return `<div class="card"><span class="tag">${a.family}</span><h2>${a.name}</h2><p>${a.desc}</p><p><b>Principe :</b> ${a.principle}<br><b>Manifestation :</b> ${a.manifestation}<br><b>Condition :</b> ${a.condition}<br><b>Portée :</b> ${a.range}<br><b>Coût :</b> ${a.cost}</p><p class="dangerText"><b>Limite :</b> ${a.limit}</p><p>Maîtrise ${a.mastery} • Niveau ${a.level} • XP ${S.alterXP}</p><h3>Découvertes</h3>${a.discoveries.length?a.discoveries.map(x=>`<div class="log">${x}</div>`).join(''):'<span class="muted">Aucune découverte supplémentaire.</span'}<h3>Techniques</h3>${a.techniques.length?a.techniques.map(t=>`<div class="card"><b>${t.name}</b><br><span class="small muted">${t.description} • coût ${t.cost}</span></div>`).join(''):'<span class="muted">Aucune technique personnelle.</span'}${a.name==='All For One'?`<button class="danger" onclick="afoScene();render()">👐 Explorer AFO</button>`:''}</div>`}
function worldView(){return `<div class="card"><h2>Monde vivant</h2><p>${S.npcs.filter(n=>n.alive).length} personnages actifs.</p><h3>Factions</h3>${Object.entries(S.factions).map(([k,f])=>`<div class="row"><span>${f.name}</span><b>${f.rep}</b></div>`).join('')}</div><div class="card"><h3>Personnes connues</h3>${S.npcs.filter(n=>n.known).slice(0,15).map(n=>{let r=relation(n);return `<div class="log"><b>${n.name}</b> <span class="pill">${n.role}</span><br><span class="small muted">confiance ${r.trust} • respect ${r.respect} • affection ${r.affection} • rivalité ${r.rivalry}</span></div>`}).join('')||'<span class="muted">Tu ne connais encore personne intimement.</span>'}</div>`}
function gearView(){return `<div class="card"><h2>Boutique</h2>${ITEMS.map(x=>`<div class="row" style="margin:10px 0"><span><b>${x[1]}</b><br><span class="small muted">${Object.entries(x[2]).map(([k,v])=>`+${v} ${k}`).join(' • ')}</span></span><button onclick="buy('${x[1]}')">${x[3]}¥</button></div>`).join('')}</div><div class="card"><h2>Équipement</h2>${S.equipment.owned.map(x=>`<div class="row" style="margin:9px 0"><span>${x.name}<br><span class="small muted">slot ${x.slot}</span></span><button onclick="equip('${x.id}')">Équiper</button></div>`).join('')||'<span class="muted">Inventaire vide.</span>'}</div><div class="card"><button onclick="exportSave()">📤 Exporter</button><button onclick="importSave()">📥 Importer</button><button class="danger" onclick="newGame()">Nouvelle partie</button></div>`}
function journal(){return `<div class="card"><h2>Journal</h2>${S.timeline.map(x=>`<div class="log"><span class="small muted">J${x.day} • ${x.title}</span><br>${x.text}</div>`).join('')||'<span class="muted">Aucun événement mémorisé.</span>'}</div>`}
window.addEventListener('load',()=>{S=load();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js?v='+VERSION).catch(()=>{})});
</script></body></html>
