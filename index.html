<div class="app">
<header class="top"><div><div class="brand">MHA ROAD</div><div class="muted small">Une histoire héroïque dont tes choix changent réellement la trajectoire.</div></div><span class="version">V16.0 CLEAN</span></header>

<script>
'use strict';
const VERSION=16, SCHEMA=16, GAME_ID='MHA_ROAD';
const $=id=>document.getElementById(id);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const uid=(p='id')=>p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]));
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
let state=null;
const defaults=()=>({gameId:GAME_ID,version:VERSION,saveVersion:VERSION,schemaVersion:SCHEMA,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),
 player:{name:'',age:15,route:'hero',stats:{force:5,vitesse:5,technique:5,endurance:5,intelligence:5,controle:5},hp:100,maxHp:100,energy:100,maxEnergy:100,money:500,style:{mobile:0,protector:0,tactician:0,aggressive:0,support:0}},
 alter:{name:null,type:null,rarity:'unknown',description:'Ton Alter n’a pas encore été identifié.',mastery:0,level:0,xp:0,known:[],unknown:['Application inconnue'],limits:[],weaknesses:[]},
 world:{season:1,action:0,actionTarget:7,phase:'school',week:1,year:1,heat:0,heroInfluence:0,villainInfluence:0,news:[]},
 relations:{Izuku:{trust:0,respect:0,affection:0,rivalry:0,fear:0,debt:0,memory:[]},Ochaco:{trust:0,respect:0,affection:0,rivalry:0,fear:0,debt:0,memory:[]},Shoto:{trust:0,respect:0,affection:0,rivalry:0,fear:0,debt:0,memory:[]},Katsuki:{trust:0,respect:0,affection:0,rivalry:5,fear:0,debt:0,memory:[]},Momo:{trust:0,respect:0,affection:0,rivalry:0,fear:0,debt:0,memory:[]},Tenya:{trust:0,respect:0,affection:0,rivalry:0,fear:0,debt:0,memory:[]},Eijiro:{trust:0,respect:0,affection:0,rivalry:0,fear:0,debt:0,memory:[]},Tsuyu:{trust:0,respect:0,affection:0,rivalry:0,fear:0,debt:0,memory:[]}},
 factions:{ua:0,heroes:0,police:0,civilians:0,villains:0,support:0},npcs:{},equipment:{head:null,torso:null,arms:null,legs:null,support:null},inventory:[],techniques:[],memories:[],decisions:{},arcs:{rivalry:{stage:0,status:'dormant'},alter:{stage:0,status:'unknown'},hero:{stage:0,status:'active'}},timeline:[],combat:null,currentScene:null,log:[],runEnded:false});
function normalize(s){const d=defaults();s=s&&typeof s==='object'?s:{};const out=Object.assign(d,s);out.player=Object.assign(d.player,s.player||{});out.player.stats=Object.assign(d.player.stats,s.player?.stats||{});out.player.style=Object.assign(d.player.style,s.player?.style||{});out.alter=Object.assign(d.alter,s.alter||{});out.world=Object.assign(d.world,s.world||{});out.relations=Object.assign(d.relations,s.relations||{});out.factions=Object.assign(d.factions,s.factions||{});out.equipment=Object.assign(d.equipment,s.equipment||{});out.arcs=Object.assign(d.arcs,s.arcs||{});out.version=VERSION;out.saveVersion=VERSION;out.schemaVersion=SCHEMA;out.gameId=GAME_ID;return out}
function migrate(raw){const s=normalize(raw); if(raw?.version<16){s.timeline=s.timeline||[];s.memories=s.memories||[];s.log=s.log||[];s.player=Object.assign(defaults().player,s.player||{});addTimeline('Migration','Ta progression V15.5 a été convertie vers le moteur V16.');} return s}
function save(){if(!state)return false;state.updatedAt=new Date().toISOString();try{localStorage.setItem('MHA_ROAD_V16_SAVE',JSON.stringify(state));return true}catch(e){toast('Sauvegarde impossible : '+e.message);return false}}
function load(){try{const raw=JSON.parse(localStorage.getItem('MHA_ROAD_V16_SAVE')||'null');if(!raw)return false;state=migrate(raw);return true}catch(e){toast('Sauvegarde corrompue ou illisible.');return false}}
function exportSave(){if(!state)return;const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mha-road-v16-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importSave(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=migrate(JSON.parse(r.result));save();render();toast('Sauvegarde importée.')}catch(e){toast('Fichier de sauvegarde invalide.')}};r.readAsText(f)};i.click()}
function toast(t){const x=$('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove('show'),2600)}
function addTimeline(title,text,meta=''){if(!state)return;state.timeline.unshift({id:uid('tl'),season:state.world.season,action:state.world.action,title,text,meta,at:new Date().toISOString()});state.timeline=state.timeline.slice(0,100)}
function remember(title,text){state.memories.unshift({id:uid('mem'),title,text,season:state.world.season});state.memories=state.memories.slice(0,40)}
function decision(id,text){state.decisions[id]={text,season:state.world.season,action:state.world.action};}
function rel(name,e={}){const r=state.relations[name]||(state.relations[name]={trust:0,respect:0,affection:0,rivalry:0,fear:0,debt:0,memory:[]});for(const k of ['trust','respect','affection','rivalry','fear','debt'])r[k]=clamp((r[k]||0)+(e[k]||0),-100,100);if(e.memory)r.memory.unshift({text:e.memory,season:state.world.season});return r}
function rep(f,n){state.factions[f]=clamp((state.factions[f]||0)+n,-100,100)}
const alters=[{name:'Impulsion cinétique',type:'Émission',rarity:'peu commun',desc:'Tu peux transmettre et modifier une impulsion mécanique.',apps:['Impact concentré','Déplacement explosif'],limits:['Rebond imprévisible'],weak:['Espaces confinés']},{name:'Gravité locale',type:'Émission',rarity:'rare',desc:'Tu modifies localement la gravité dans une zone limitée.',apps:['Allègement','Ancrage'],limits:['Forte fatigue'],weak:['Perturbation de concentration']},{name:'Ombre',type:'Transformation',rarity:'rare',desc:'Tu peux manipuler une matière d’ombre liée à ta présence.',apps:['Voile','Lame d’ombre'],limits:['Lumière intense'],weak:['Surexposition']},{name:'Forge',type:'Création',rarity:'peu commun',desc:'Tu crées des objets simples à partir de ton énergie.',apps:['Outil instantané','Renfort'],limits:['Masse limitée'],weak:['Épuisement']},{name:'Overdrive',type:'Transformation',rarity:'très rare',desc:'Ton corps pousse temporairement ses capacités au-delà de leur seuil normal.',apps:['Surcharge musculaire','Accélération'],limits:['Contrecoup'],weak:['Durée courte']},{name:'Résonance',type:'Émission',rarity:'rare',desc:'Tu détectes et influences certaines vibrations autour de toi.',apps:['Détection','Onde'],limits:['Bruit ambiant'],weak:['Saturation']}];
const chars=['Izuku','Ochaco','Shoto','Katsuki','Momo','Tenya','Eijiro','Tsuyu'];
const scenes=[
{id:'school_intro',kind:'scene',title:'Le premier matin',place:'U.A.',text:'La salle est plus bruyante que tu ne l’imaginais. Les conversations se croisent, les regards évaluent les nouveaux visages. Aizawa entre sans prévenir et dépose une pile de feuilles sur le bureau.',choices:[{label:'Observer avant d’agir',desc:'Tu prends le temps de comprendre les dynamiques.',effects:{intelligence:1,style:{tactician:2}},rel:{Izuku:{trust:1},Momo:{respect:1}},memory:'Tu as choisi d’observer avant de te dévoiler.'},{label:'Te présenter franchement',desc:'Tu assumes ta présence et vas vers les autres.',effects:{force:1,style:{support:1}},rel:{Eijiro:{trust:2},Ochaco:{affection:1}},memory:'Tu as fait le premier pas vers la classe.'},{label:'Provoquer Katsuki',desc:'Tu testes immédiatement le caractère explosif du groupe.',effects:{technique:1,style:{aggressive:2}},rel:{Katsuki:{rivalry:4}},arc:'rivalry'}]},
{id:'training',kind:'training',title:'Exercice de maîtrise',place:'Terrain d’entraînement',text:'Un exercice simple devient rapidement un test de contrôle. Le professeur observe moins la puissance brute que la manière dont tu t’adaptes.',choices:[{label:'Chercher la puissance',effects:{force:2,style:{aggressive:2}},rep:{heroes:1}},{label:'Travailler la précision',effects:{technique:2,controle:1,style:{tactician:2}},alterXP:2},{label:'Protéger les autres',effects:{endurance:1,style:{protector:3}},rel:{Ochaco:{trust:2},Eijiro:{respect:1}},rep:{civilians:2}}]},
{id:'relation',kind:'relation',title:'Après les cours',place:'Couloir de l’U.A.',text:'Quelqu’un t’attend près des casiers. Ce n’est pas une mission. Juste un moment où une relation peut réellement changer.',choices:[{label:'Prendre le temps d’écouter',effects:{style:{support:2}},rel:{Izuku:{trust:3},Tsuyu:{trust:2}}},{label:'Parler de tes ambitions',effects:{intelligence:1},rel:{Shoto:{respect:2},Momo:{trust:1}}},{label:'Défier ton rival',effects:{force:1,style:{aggressive:2}},rel:{Katsuki:{rivalry:5}},arc:'rivalry'}]},
{id:'mission',kind:'mission',title:'Première intervention',place:'Quartier commerçant',text:'Une alerte tombe pendant l’exercice. Un individu masqué a provoqué un mouvement de panique. Tu n’es pas encore un héros confirmé, mais tu es assez proche pour agir.',choices:[{label:'Évacuer les civils',effects:{endurance:1,style:{protector:3}},rep:{civilians:4,heroes:1},combat:{enemy:'Voyou masqué',hp:55,objective:'protect'}},{label:'Analyser avant d’intervenir',effects:{intelligence:2,style:{tactician:2}},alterXP:2,combat:{enemy:'Voyou masqué',hp:55,objective:'analyze'}},{label:'L’arrêter immédiatement',effects:{force:2,style:{aggressive:2}},rep:{heroes:2,villains:-2},combat:{enemy:'Voyou masqué',hp:65,objective:'defeat'}}]},
{id:'exam',kind:'exam',title:'Épreuve sous pression',place:'Zone d’examen',text:'Le terrain est construit pour te faire choisir entre vitesse, technique et protection. Le résultat compte, mais la manière dont tu le traverses aussi.',choices:[{label:'Prendre la voie la plus rapide',effects:{vitesse:2,style:{mobile:3}},combat:{enemy:'Drone d’entraînement',hp:70,objective:'survive'}},{label:'Chercher le meilleur angle',effects:{technique:1,intelligence:1,style:{tactician:2}},combat:{enemy:'Drone d’entraînement',hp:70,objective:'analyze'}},{label:'Secourir les figurants',effects:{endurance:1,style:{protector:3}},rep:{civilians:4},rel:{Ochaco:{trust:2}},combat:{enemy:'Drone d’entraînement',hp:60,objective:'protect'}}]},
{id:'quiet',kind:'scene',title:'Une journée presque normale',place:'U.A.',text:'Pour une fois, aucune alarme. Tu peux t’entraîner, parler, observer les autres ou simplement souffler. Ces moments comptent aussi.',choices:[{label:'T’entraîner seul',effects:{technique:1,alterXP:1}},{label:'Passer du temps avec quelqu’un',effects:{style:{support:1}},rel:{Ochaco:{affection:2},Eijiro:{trust:2}}},{label:'Explorer l’école',effects:{intelligence:1},memory:'Tu as découvert une partie moins visible de l’U.A.'}]}
];
function chooseScene(){const a=[];for(const s of scenes){if(s.id==='school_intro'&&state.world.season!==1)continue;if(s.id==='mission'&&Math.random()>.48)continue;if(s.id==='exam'&&state.world.season<2)continue;a.push(s)}return pick(a.length?a:scenes)}
function generateScene(){let s=chooseScene();const combatChance=state.world.season>=2&&Math.random()<.22;if(combatChance&&s.id!=='mission'&&s.id!=='exam'){s=Object.assign({},s,{combat:{enemy:pick(['Émeutier équipé','Voyou à Alter inconnu','Drone de sécurité']),hp:rand(45,80),objective:pick(['defeat','protect','survive','analyze'])}})}state.currentScene=s;addTimeline('Nouvelle scène',s.title,s.place);save()}
function applyEffects(e={}){const p=state.player;for(const k of ['force','vitesse','technique','endurance','intelligence','controle'])if(e[k])p.stats[k]=clamp(p.stats[k]+e[k],1,99);if(e.money)p.money=Math.max(0,p.money+e.money);if(e.energy)p.energy=clamp(p.energy+e.energy,0,p.maxEnergy);if(e.hp)p.hp=clamp(p.hp+e.hp,1,p.maxHp);if(e.style)for(const k in e.style)p.style[k]=(p.style[k]||0)+e.style[k];if(e.alterXP)gainAlterXP(e.alterXP)}
function applyChoice(c){applyEffects(c.effects);if(c.rel)for(const [n,e] of Object.entries(c.rel))rel(n,e);if(c.rep)for(const [f,n] of Object.entries(c.rep))rep(f,n);if(c.memory)remember('Décision importante',c.memory);if(c.memory)decision(uid('decision'),c.memory);if(c.arc)state.arcs[c.arc].stage++;
const s=state.currentScene;if(s){if(c.combat){startCombat(c.combat);return true;}if(s.id==='school_intro')state.arcs.hero.stage++;if(s.id==='relation')state.arcs.hero.stage++;}return false}
function gainAlterXP(n){state.alter.xp+=n;while(state.alter.xp>=10){state.alter.xp-=10;state.alter.mastery++;if(state.alter.mastery%3===0)discoverTechnique()}}
function discoverTechnique(){if(!state.alter.name)return;const data=alters.find(x=>x.name===state.alter.name);const next=data?.apps?.find(x=>!state.alter.known.includes(x));if(next){state.alter.known.push(next);state.alter.unknown=state.alter.unknown.filter(x=>x!==next);remember('Nouvelle application','Ton Alter révèle une application : '+next+'.');}}
function choose(i){if(!state||state.combat||!state.currentScene)return;const c=state.currentScene.choices[i];if(!c)return;const startsCombat=applyChoice(c);state.log.unshift({season:state.world.season,action:state.world.action,text:c.label});state.currentScene=null;if(!startsCombat)advanceAction();save();render()}
function advanceAction(){state.world.action++;state.world.week++;worldTick();if(state.world.action>=state.world.actionTarget){endSeason();return}state.player.energy=clamp(state.player.energy+18,0,state.player.maxEnergy);generateScene()}
function worldTick(){for(const n of chars){const x=state.npcs[n]||(state.npcs[n]={level:1,influence:0,status:'active'});x.level+=Math.random()*.15;x.influence+=rand(-1,2)}if(Math.random()<.35)state.world.news.unshift(pick(['Un héros professionnel gagne en influence.','Une rumeur circule sur un nouveau criminel.','L’U.A. renforce la sécurité de ses élèves.','Une agence cherche de nouveaux stagiaires.']));state.world.news=state.world.news.slice(0,5)}
function planSeason(){const s=state.world.season;state.world.actionTarget=s%5===0?rand(8,12):rand(6,9);if(state.arcs.rivalry.stage>=2)state.world.actionTarget=Math.max(state.world.actionTarget,8)}
function endSeason(){const old=state.world.season;addTimeline('Fin de saison','La saison '+old+' touche à sa conclusion.');remember('Fin de saison','Tu as traversé la saison '+old+' avec '+state.world.action+' actions.');state.world.season++;state.world.action=0;planSeason();state.player.energy=state.player.maxEnergy;state.player.hp=state.player.maxHp;state.world.phase=state.world.season<4?'school':'agency';generateSeasonFinale(old);save();render();}
function generateSeasonFinale(old){const key=state.arcs.rivalry.stage>=3?'rival':state.factions.civilians>=8?'protector':state.alter.mastery>=3?'alter':'general';const text={rival:'Katsuki ne te regarde plus comme un simple camarade. Votre rivalité devient impossible à ignorer.',protector:'Les civils commencent à retenir ton nom pour les bonnes raisons.',alter:'Tu comprends enfin une chose essentielle sur ton Alter : sa puissance dépend de ta maîtrise.',general:'Une nouvelle période commence. Tes choix précédents commencent à dessiner ta réputation.'}[key];state.currentScene={id:'finale_'+old,title:'Finale de saison',place:'U.A.',text,choices:[{label:'Assumer cette évolution',effects:{intelligence:1},memory:text},{label:'Chercher à faire mieux',effects:{controle:1,style:{tactician:1}},alterXP:1},{label:'Te fixer un nouvel objectif',effects:{endurance:1},style:{mobile:1}}]};addTimeline('Finale',text,'Saison '+old)}
function startCombat(cfg){state.combat={id:uid('combat'),enemy:cfg.enemy,hp:cfg.hp,maxHp:cfg.hp,turn:1,objective:cfg.objective||'defeat',guard:0,analysis:0,enemyAlterKnown:false,log:[],startedAt:new Date().toISOString()};addTimeline('Combat',`Affrontement contre ${cfg.enemy}.`,`Objectif : ${objectiveLabel(cfg.objective)}`);render()}
function objectiveLabel(x){return ({defeat:'vaincre',protect:'protéger',survive:'survivre',analyze:'analyser'})[x]||'vaincre'}
function fight(action){const c=state.combat;if(!c)return;const p=state.player;let dmg=0;if(action==='attack'){dmg=Math.max(5,p.stats.force+rand(2,7));p.style.aggressive++;}if(action==='tech'){dmg=Math.max(6,p.stats.technique+rand(3,9));p.energy=Math.max(0,p.energy-10);gainAlterXP(1);p.style.tactician++;}if(action==='guard'){c.guard=12+p.stats.endurance;rel('Eijiro',{respect:1});}if(action==='analyze'){c.analysis++;p.stats.intelligence++;p.style.tactician++;if(c.analysis>=2)c.enemyAlterKnown=true;}if(action==='protect'){c.guard=20+p.stats.endurance;p.style.protector+=2;rep('civilians',2);}if(action==='escape'){state.combat=null;remember('Retrait tactique','Tu as choisi de te replier plutôt que de prendre un risque inutile.');advanceAction();save();render();return}
if(dmg)c.hp-=dmg;c.log.unshift({turn:c.turn,who:'toi',text:action+' · '+dmg+' dégâts'});if(c.hp<=0){finishCombat(true);return}const enemyDmg=Math.max(0,rand(5,12)-Math.floor(c.guard/8));p.hp=clamp(p.hp-enemyDmg,0,p.maxHp);c.guard=0;c.log.unshift({turn:c.turn,who:'ennemi',text:`L’ennemi inflige ${enemyDmg} dégâts.`});c.turn++;if(c.objective==='survive'&&c.turn>=5){finishCombat(true);return}if(p.hp<=0){state.runEnded=true;state.combat=null;addTimeline('Défaite','Tu es tombé au combat.','Fin de parcours');save();render();return}save();render()}
function finishCombat(success){const c=state.combat;if(success){remember('Combat remporté',`Tu as terminé un affrontement contre ${c.enemy}.`);rep('heroes',2);if(c.objective==='protect')rep('civilians',3);if(c.enemyAlterKnown)remember('Alter analysé',`Tu as compris une partie de l’Alter de ${c.enemy}.`);state.player.energy=Math.max(0,state.player.energy-12);state.combat=null;advanceAction();}else{state.combat=null;advanceAction()}save();render()}
function setAlter(){const a=pick(alters);state.alter.name=a.name;state.alter.type=a.type;state.alter.rarity=a.rarity;state.alter.description=a.desc;state.alter.limits=a.limits;state.alter.weaknesses=a.weak;state.alter.known=[];state.alter.unknown=[...a.apps];state.arcs.alter.status='discovered';state.arcs.alter.stage=1;remember('Alter découvert',`Ton Alter a été identifié : ${a.name}.`);addTimeline('Découverte',`Ton Alter est ${a.name}.`);save();render()}
const gear=[{id:'helmet',slot:'head',name:'Casque tactique',cost:180,bonus:'Intelligence +2',effects:{intelligence:2}},{id:'vest',slot:'torso',name:'Gilet renforcé',cost:220,bonus:'Endurance +2',effects:{endurance:2}},{id:'braces',slot:'arms',name:'Renforts articulaires',cost:250,bonus:'Force +2',effects:{force:2}},{id:'boots',slot:'legs',name:'Bottes de mobilité',cost:230,bonus:'Vitesse +2',effects:{vitesse:2}},{id:'support',slot:'support',name:'Module de contrôle',cost:300,bonus:'Contrôle +2',effects:{controle:2}},{id:'visor',slot:'head',name:'Visière d’analyse',cost:280,bonus:'Technique +2',effects:{technique:2}}];
function buy(id){const g=gear.find(x=>x.id===id);if(!g||state.player.money<g.cost)return toast('Pas assez d’argent.');state.player.money-=g.cost;state.inventory.push({...g,uid:uid(g.id)});addTimeline('Équipement acheté',g.name);save();render();toast(g.name+' ajouté à ton inventaire.')}
function equip(uidx){const item=state.inventory.find(x=>x.uid===uidx);if(!item)return;const old=state.equipment[item.slot];if(old){toast('Emplacement déjà occupé. Déséquipe d’abord l’objet.');return}state.equipment[item.slot]=item;applyGear(item,1);addTimeline('Équipement équipé',item.name);save();render()}
function unequip(slot){const item=state.equipment[slot];if(!item)return;applyGear(item,-1);state.equipment[slot]=null;addTimeline('Équipement retiré',item.name);save();render()}
function applyGear(item,dir){for(const [k,v] of Object.entries(item.effects||{}))state.player.stats[k]=clamp(state.player.stats[k]+v*dir,1,99)}
function gearSlot(slot){return state.equipment[slot]||null}
function startNew(){state=defaults();state.player.name='';state.currentScene=null;openCharacterCreation()}
function openCharacterCreation(){showModal(`<h2>Créer ton personnage</h2><div class="stack"><label>Prénom<input id="newName" maxlength="24" placeholder="Ton prénom"></label><label>Voie initiale<select id="newRoute"><option value="hero">Élève héroïque</option><option value="support">Support / stratégie</option></select></label><div class="notice">Ton Alter ne sera pas choisi directement. Il sera découvert plus tard, selon ton histoire.</div><button class="primary" onclick="createPlayer()">Commencer l’histoire</button></div>`)}
function createPlayer(){const name=($('newName').value||'Inconnu').trim();state.player.name=name;state.player.route=$('newRoute').value;addTimeline('Début','Ton histoire commence à U.A.','Saison 1');state.npcs={};planSeason();generateScene();closeModal();save();render();}
function resume(){if(!load()){startNew();return}render()}
function nav(){const items=[['home','🏠 Histoire'],['character','👤 Personnage'],['alter','🧬 Alter'],['world','🌍 Monde'],['equipment','🎒 Équipement'],['journal','📖 Journal']];$('mainNav').innerHTML=items.map(([id,t])=>`<button data-nav="${id}">${t}</button>`).join('');$('mainNav').onclick=e=>{const b=e.target.closest('[data-nav]');if(!b)return;show(b.dataset.nav)}}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===id));render()}
function statRows(){return Object.entries(state.player.stats).map(([k,v])=>`<div class="stat"><span>${({force:'Force',vitesse:'Vitesse',technique:'Technique',endurance:'Endurance',intelligence:'Intelligence',controle:'Contrôle'})[k]}</span><div class="bar"><div class="fill" style="width:${Math.min(100,v*3)}%"></div></div><b>${v}</b></div>`).join('')}
function home(){if(!state)return `<div class="card hero center"><h1>MHA Road V16</h1><p class="muted">RPG narratif dynamique, hors ligne et pensé pour Safari.</p><button class="primary" onclick="startNew()">Nouvelle partie</button><button class="ghost" onclick="resume()">Charger la sauvegarde</button></div>`;if(state.runEnded)return `<div class="card dangerbox"><h2>Parcours terminé</h2><p>Ton histoire s’est arrêtée ici.</p><button class="primary" onclick="startNew()">Nouvelle partie</button><button class="ghost" onclick="exportSave()">Exporter</button></div>`;if(state.combat)return combatHtml();const s=state.currentScene;return `<div class="card hero"><div class="row"><div><span class="pill">Saison ${state.world.season}</span><span class="pill">Action ${state.world.action+1}/${state.world.actionTarget}</span></div><span class="pill">${state.world.phase}</span></div><h1>${esc(s?.title||'Ton histoire')}</h1><div class="muted">${esc(s?.place||'U.A.')}</div><p>${esc(s?.text||'Choisis une direction pour commencer.')}</p></div>${s?`<div class="card"><h2>Que fais-tu ?</h2>${s.choices.map((c,i)=>`<button class="choice" onclick="choose(${i})"><strong>${esc(c.label)}</strong><small>${esc(c.desc||'Cette décision peut modifier tes relations, ta réputation ou ton évolution.')}</small></button>`).join('')}</div>`:`<div class="card"><button class="primary" onclick="generateScene();render()">Continuer</button></div>`}<div class="grid3"><div class="kpi"><span class="muted">PV</span><b>${state.player.hp}/${state.player.maxHp}</b></div><div class="kpi"><span class="muted">Énergie</span><b>${state.player.energy}/${state.player.maxEnergy}</b></div><div class="kpi"><span class="muted">Argent</span><b>${state.player.money} ¥</b></div></div>`}
function combatHtml(){const c=state.combat;return `<div class="card dangerbox"><span class="pill">COMBAT</span><h1>${esc(c.enemy)}</h1><div class="combatEnemy"><span>PV ennemi</span><b>${Math.max(0,c.hp)}/${c.maxHp}</b></div><div class="bar"><div class="fill" style="width:${Math.max(0,c.hp/c.maxHp*100)}%"></div></div><p class="muted">Objectif : ${objectiveLabel(c.objective)}. Tour ${c.turn}.</p>${c.analysis?`<div class="notice">Analyse ${c.analysis}/2 ${c.enemyAlterKnown?'— Alter ennemi partiellement identifié.':'— encore des indices à obtenir.'}</div>`:''}<div class="combatActions"><button class="primary" onclick="fight('attack')">⚔️ Attaquer</button><button onclick="fight('tech')">🧬 Technique</button><button onclick="fight('guard')">🛡️ Garde</button><button onclick="fight('analyze')">🔎 Analyser</button><button onclick="fight('protect')">🤝 Protéger</button><button class="ghost" onclick="fight('escape')">↩️ Repli</button></div><hr><div class="list">${c.log.slice(0,6).map(x=>`<div class="item"><small>Tour ${x.turn} · ${x.who==='toi'?'Toi':'Ennemi'}</small><br>${esc(x.text)}</div>`).join('')}</div></div>`}
function character(){if(!state)return '<div class="card">Aucune partie.</div>';return `<div class="card hero"><h1>${esc(state.player.name||'Personnage')}</h1><p class="muted">Âge ${state.player.age} · ${state.player.route==='hero'?'Voie héroïque':'Support / stratégie'}</p>${statRows()}</div><div class="card"><h2>Style qui se dessine</h2><div class="grid3">${Object.entries(state.player.style).map(([k,v])=>`<div class="kpi"><span class="muted">${k}</span><b>${v}</b></div>`).join('')}</div></div><div class="card"><h2>Sauvegarde</h2><div class="actions"><button onclick="save();toast('Sauvegarde effectuée.')">Sauvegarder</button><button onclick="exportSave()">Exporter</button><button onclick="importSave()">Importer</button></div></div>`}
function alter(){if(!state)return '<div class="card">Aucune partie.</div>';if(!state.alter.name)return `<div class="card hero"><h1>🧬 Alter</h1><p>Son identité reste inconnue.</p><div class="notice">Tu ne peux pas choisir directement ton Alter. L’histoire révélera progressivement ce qui te correspond.</div><button class="primary" onclick="setAlter()">Découvrir ton Alter</button></div>`;return `<div class="card hero"><span class="pill">${esc(state.alter.type)}</span><span class="pill">${esc(state.alter.rarity)}</span><h1>${esc(state.alter.name)}</h1><p>${esc(state.alter.description)}</p><p class="muted">Maîtrise ${state.alter.mastery} · XP ${state.alter.xp}/10</p></div><div class="grid"><div class="card"><h2>Applications connues</h2>${state.alter.known.map(x=>`<div class="item">✓ ${esc(x)}</div>`).join('')||'<p class="muted">Aucune application totalement maîtrisée.</p>'}</div><div class="card"><h2>Encore inconnues</h2>${state.alter.unknown.map(x=>`<div class="item">???</div>`).join('')||'<p class="positive">Toutes les applications connues.</p>'}</div></div><div class="card"><h2>Limites</h2>${state.alter.limits.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}<h2>Faiblesses</h2>${state.alter.weaknesses.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>`}
function world(){if(!state)return '<div class="card">Aucune partie.</div>';return `<div class="card"><h1>🌍 Monde vivant</h1><p class="muted">Le monde évolue entre tes actions.</p><div class="grid">${chars.map(n=>{const x=state.npcs[n]||{level:1,influence:0,status:'actif'};const r=state.relations[n]||{};return `<div class="item"><b>${n}</b><br><small>Niv. ${x.level.toFixed(1)} · Influence ${x.influence}</small><br><span class="pill">Confiance ${r.trust||0}</span><span class="pill">Respect ${r.respect||0}</span><span class="pill">Rivalité ${r.rivalry||0}</span></div>`}).join('')}</div></div><div class="card"><h2>Factions</h2><div class="grid3">${Object.entries(state.factions).map(([k,v])=>`<div class="kpi"><span class="muted">${k}</span><b class="${v>=0?'positive':'negative'}">${v}</b></div>`).join('')}</div></div><div class="card"><h2>Nouvelles</h2>${state.world.news.map(x=>`<div class="item">${esc(x)}</div>`).join('')||'<p class="muted">Aucune nouvelle notable.</p>'}</div>`}
function equipment(){if(!state)return '<div class="card">Aucune partie.</div>';const slots={head:'Tête',torso:'Torse',arms:'Bras',legs:'Jambes',support:'Support'};return `<div class="card"><h1>🎒 Équipement</h1><p class="muted">Un seul équipement par emplacement. Les bonus ne s’appliquent que lorsqu’il est équipé.</p><div class="equip">${Object.entries(slots).map(([s,n])=>{const x=gearSlot(s);return `<div class="slot ${x?'filled':''}"><b>${n}</b><p>${x?esc(x.name):'<span class="muted">Vide</span>'}</p>${x?`<small>${esc(x.bonus)}</small><br><button onclick="unequip('${s}')">Déséquiper</button>`:''}</div>`}).join('')}</div></div><div class="card"><h2>Inventaire</h2>${state.inventory.map(x=>`<div class="item row"><div><b>${esc(x.name)}</b><br><small>${esc(x.bonus)} · ${x.cost} ¥</small></div><button ${state.equipment[x.slot]?'disabled':''} onclick="equip('${x.uid}')">Équiper</button></div>`).join('')||'<p class="muted">Ton inventaire est vide.</p>'}</div><div class="card"><h2>Boutique</h2>${gear.map(x=>`<div class="item row"><div><b>${esc(x.name)}</b><br><small>${esc(x.bonus)}</small></div><button onclick="buy('${x.id}')">${x.cost} ¥</button></div>`).join('')}</div>`}
function journal(){if(!state)return '<div class="card">Aucune partie.</div>';return `<div class="card"><h1>📖 Journal</h1><p class="muted">Les décisions importantes restent ici et peuvent revenir plus tard dans l’histoire.</p>${state.memories.map(x=>`<div class="item"><b>${esc(x.title)}</b><br><small>Saison ${x.season}</small><p>${esc(x.text)}</p></div>`).join('')||'<p class="muted">Pas encore de souvenir majeur.</p>'}</div><div class="card"><h2>Chronologie</h2><div class="timeline">${state.timeline.map(x=>`<div class="item"><b>${esc(x.title)}</b><br><small>S${x.season} · action ${x.action}</small><p>${esc(x.text)}</p><small>${esc(x.meta||'')}</small></div>`).join('')}</div></div>`}
function render(){if(!state){$('mainNav').classList.add('hidden');$('home').innerHTML=home();['character','alter','world','equipment','journal'].forEach(id=>$(id).innerHTML='');return}$('mainNav').classList.remove('hidden');$('home').innerHTML=home();$('character').innerHTML=character();$('alter').innerHTML=alter();$('world').innerHTML=world();$('equipment').innerHTML=equipment();$('journal').innerHTML=journal()}
function showModal(html){$('modalBody').innerHTML=html;$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
nav();if(!load()){state=null;render()}else{render()}
window.startNew=startNew;window.resume=resume;window.createPlayer=createPlayer;window.choose=choose;window.fight=fight;window.show=show;window.generateScene=generateScene;window.startCombat=startCombat;window.setAlter=setAlter;window.buy=buy;window.equip=equip;window.unequip=unequip;window.save=save;window.exportSave=exportSave;window.importSave=importSave;window.closeModal=closeModal;window.MHA_ROAD_DEBUG=()=>JSON.parse(JSON.stringify({version:VERSION,schema:SCHEMA,state}));
</script>
</body></html>
