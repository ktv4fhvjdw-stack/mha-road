<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>MHA Road — V16.3</title>
<style>
:root{--bg:#080d18;--panel:#111a2b;--panel2:#17233a;--line:#293853;--text:#edf3ff;--muted:#9caac2;--accent:#7dd3fc;--good:#86efac;--warn:#fcd34d;--bad:#fb7185}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{border:1px solid var(--line);background:#17233a;color:var(--text);border-radius:11px;padding:11px 13px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button.primary{background:#2563eb;border-color:#3b82f6}button.good{background:#166534;border-color:#22c55e}button.warn{background:#594414;border-color:#a78324}button.danger{background:#4b1723;border-color:#9f1239}.hidden{display:none!important}.app{max-width:780px;margin:auto;padding:0 10px 30px}.top{position:sticky;top:0;z-index:30;background:#080d18ed;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:8px 0}.brand{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand h1{font-size:19px;margin:0}.small{font-size:12px}.muted{color:var(--muted)}.tag,.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;background:#1a2740;padding:3px 8px;font-size:11px}.hud{position:sticky;top:48px;z-index:25;background:#080d18f2;padding:6px 0;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;border-bottom:1px solid var(--line)}.hudbox{background:#121d31;border:1px solid var(--line);border-radius:9px;padding:5px 7px;text-align:center;font-size:11px}.hudbox b{display:block;font-size:13px}.bar{height:7px;background:#263148;border-radius:99px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;width:0}.hp i{background:#fb7185}.en i{background:#facc15}.tabs{position:sticky;top:91px;z-index:24;background:#080d18f0;padding:7px 0;display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.tabs button{padding:8px 2px;font-size:11px}.tabs button.active{background:#263b61;border-color:#5875a8}.card{background:linear-gradient(180deg,#111a2bf7,#0f1829f7);border:1px solid var(--line);border-radius:15px;padding:14px;margin:9px 0}.scene{min-height:250px}.scenehead{display:flex;justify-content:space-between;gap:8px;align-items:start}.scene h2{margin:2px 0 8px;font-size:21px}.scene p{font-size:16px;white-space:pre-line}.choice{display:block;width:100%;text-align:left;margin:7px 0;padding:13px;background:#16233a}.choice b{display:block}.choice span{display:block;font-size:12px;color:#aebbd0;margin-top:3px}.after{border-color:#36547e;background:#101f35}.after h3{margin-top:0}.consequence{border-left:3px solid #60a5fa;padding-left:9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #243149}.npc,.shopitem,.faction{border:1px solid var(--line);border-radius:11px;padding:10px;background:#101a2b;margin:7px 0}.log{display:flex;flex-direction:column;gap:7px}.logitem{padding:8px 10px;background:#101a2b;border-left:3px solid #3b82f6;border-radius:0 9px 9px 0}.combat{border-color:#815117;background:linear-gradient(180deg,#251c11,#111a2b)}.combatgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.combat-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tech{border-color:#41638e;background:#172942}.modal{position:fixed;inset:0;z-index:100;background:#020617e8;overflow:auto;padding:15px}.modal .card{max-width:650px;margin:25px auto}.field{margin:9px 0}.field label{display:block;font-size:12px;color:#aebbd0;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:#0b1425;color:var(--text)}.menu{min-height:100vh;display:flex;align-items:center}.menu .card{width:100%;padding:20px}.menu h1{font-size:31px;margin:0}.feature{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.feature div{padding:10px;border:1px solid var(--line);border-radius:10px;background:#101a2b}.notice{padding:10px;border:1px solid var(--line);border-radius:10px;background:#0f1a2c}.right{text-align:right}.money{color:#fcd34d}.positive{color:#86efac}.negative{color:#fb7185}.footer{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:560px){.hud{grid-template-columns:repeat(4,1fr)}.hudbox{font-size:10px}.hudbox b{font-size:12px}.tabs{grid-template-columns:repeat(3,1fr);top:90px}.grid,.combatgrid,.feature{grid-template-columns:1fr}.scene{min-height:0}}
</style></head><body><div id="root"></div><div id="modal" class="modal hidden"></div>
<script>
'use strict';
const VERSION='16.3', KEY='MHA_ROAD_V16_3_SAVE';
const $=id=>document.getElementById(id), clamp=(n,a,b)=>Math.max(a,Math.min(b,n)), rnd=n=>Math.floor(Math.random()*n), pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const STAT={force:'Force',vitesse:'Vitesse',defense:'Défense',intelligence:'Intelligence',endurance:'Endurance',controle:'Contrôle',courage:'Courage'};
let S=null,scene=null,combat=null,activeTab='story',shopEvent=null;
const EQUIPMENT=[
['head','Tête','Casquette renforcée',650,{defense:1,vitesse:1},'Un équipement simple et discret.'],['head','Tête','Casque léger',1800,{defense:3},'Protège mieux, mais alourdit légèrement les mouvements.'],['head','Tête','Visière tactique',4200,{intelligence:2,controle:2},'Aide à analyser rapidement une situation.'],
['torso','Torse','Veste matelassée',1200,{defense:3,endurance:1},'Protection quotidienne.'],['torso','Torse','Gilet renforcé',3600,{defense:5,vitesse:-1},'Solide mais peu discret.'],['torso','Torse','Gilet d’intervention',7800,{defense:3,endurance:2,courage:1},'Conçu pour les situations dangereuses.'],
['arms','Bras','Gants d’entraînement',800,{force:2,controle:1},'Pour travailler les mouvements.'],['arms','Bras','Gantelets renforcés',3100,{force:4,controle:1},'Favorise les frappes puissantes.'],['arms','Bras','Brassards de précision',5200,{controle:4,intelligence:1},'Pour les Alters demandant beaucoup de précision.'],
['legs','Jambes','Chaussures de course',1000,{vitesse:2,endurance:1},'Légères et polyvalentes.'],['legs','Jambes','Chaussures renforcées',2900,{vitesse:3,defense:1},'Plus résistantes aux chocs.'],['legs','Jambes','Bottes d’intervention',6500,{vitesse:2,endurance:3,defense:1},'Conçues pour durer sur le terrain.'],
['support','Support','Bracelet d’assistance',2500,{intelligence:2,controle:1},'Petit outil polyvalent.'],['support','Support','Analyseur portable',5600,{intelligence:4,controle:2},'Améliore l’analyse des Alters.'],['support','Support','Module de soutien',9500,{controle:3,endurance:2,force:1},'Équipement avancé à usage spécialisé.']
];
const QUIRKS=[
{id:'impulsion',name:'Impulsion',family:'Force',desc:'Tu amplifies brutalement la force de tes mouvements.',weak:'Les articulations encaissent les usages répétés.',tech:[['Impact concentré',12,'damage',1.45],['Onde de choc',16,'damage',1.15],['Renforcement',14,'guard',.55]]},
{id:'acceleration',name:'Accélération',family:'Vitesse',desc:'Tu peux accélérer ton corps par impulsions successives.',weak:'Les changements brutaux épuisent rapidement ton endurance.',tech:[['Dash',12,'damage',1.3],['Pas fantôme',15,'guard',.65],['Surcharge',22,'damage',1.8]]},
{id:'thermo',name:'Thermokinésie',family:'Élément',desc:'Tu manipules la chaleur autour de ton corps.',weak:'La surchauffe limite les utilisations rapprochées.',tech:[['Jet thermique',14,'damage',1.35],['Mur thermique',16,'guard',.45],['Surchauffe',24,'damage',2]]},
{id:'ombre',name:'Ombre',family:'Ombre',desc:'Tu manipules les ombres proches pour gêner et frapper.',weak:'Ton potentiel diminue dans les environnements très exposés.',tech:[['Lame d’ombre',13,'damage',1.3],['Voile',15,'guard',.5],['Entrave',18,'stun',.4]]},
{id:'gravite',name:'Gravité',family:'Gravité',desc:'Tu modifies localement le poids et la trajectoire des objets.',weak:'Les manipulations lourdes demandent beaucoup d’énergie.',tech:[['Pression',16,'damage',1.45],['Allègement',12,'guard',.6],['Zone gravitationnelle',25,'damage',2.05]]},
{id:'resonance',name:'Résonance',family:'Son',desc:'Tu produis et manipules des vibrations.',weak:'Les fortes fréquences te désorientent aussi.',tech:[['Onde sonore',13,'damage',1.3],['Résonance défensive',15,'guard',.5],['Fréquence brisée',20,'stun',.5]]}];
const FIRST=['Yuto','Mina','Ren','Aiko','Sora','Kenji','Hana','Daichi','Noa','Riku','Mei','Kaito','Aya','Haru','Nana','Toma','Kenta','Emi','Rei','Koki'];
const LAST=['Sato','Kobayashi','Mori','Tanaka','Aoki','Nakamura','Ishida','Fujita','Kato','Sakai'];
const TRAITS=['réservé','ambitieux','protecteur','provocateur','curieux','studieux','imprévisible','sociable','méfiant','compétitif'];
const FACTIONS={
hero:{name:'Voie héroïque',desc:'Ceux qui veulent protéger les autres et gagner leur place parmi les héros.',threshold:0},support:{name:'Support & Technologie',desc:'Ingénieurs, analystes et inventeurs qui préfèrent préparer le terrain.',threshold:0},underground:{name:'Réseau clandestin',desc:'Un milieu ambigu où information, argent et services circulent hors des institutions.',threshold:0},vigilante:{name:'Justiciers indépendants',desc:'Ceux qui pensent que les institutions sont parfois trop lentes.',threshold:0},civil:{name:'Voie civile',desc:'Une vie sans carrière héroïque, mais avec ses propres ambitions.',threshold:0}};
function base(){return {version:VERSION,started:false,player:{name:'',gender:'',personality:'Curieux'},school:'Collège municipal',schoolYear:'4e',age:14,day:1,season:1,action:0,seasonActions:[],seasonHistory:[],money:250,hp:100,maxHp:100,energy:100,maxEnergy:100,rep:0,stats:{force:8,vitesse:8,defense:8,intelligence:8,endurance:8,controle:8,courage:8},equipment:{head:null,torso:null,arms:null,legs:null,support:null},inventory:[],quirk:null,quirkXP:0,techniques:[],relations:{},npcs:[],memories:[],decisions:[],timeline:[],worldNews:[],seenEvents:{},eventCooldown:{},storyFlags:{},factions:{hero:0,support:0,underground:0,vigilante:0,civil:0},factionStatus:'undecided',arc:{id:null,name:'Vie quotidienne',progress:0,threads:[]},afterAction:null,seasonSummary:null,injury:0,ai:{enabled:false,endpoint:'https://api.openai.com/v1/responses',model:'gpt-5.6-luna',apiKey:''},gameOver:false};}
function normalize(x){let b=base(),s=Object.assign(b,x||{});s.player=Object.assign(b.player,x?.player||{});s.stats=Object.assign(b.stats,x?.stats||{});s.equipment=Object.assign(b.equipment,x?.equipment||{});s.factions=Object.assign(b.factions,x?.factions||{});s.ai=Object.assign(b.ai,x?.ai||{});s.arc=Object.assign(b.arc,x?.arc||{});s.seasonActions=x?.seasonActions||[];s.seasonHistory=x?.seasonHistory||[];s.inventory=x?.inventory||[];s.memories=x?.memories||[];s.decisions=x?.decisions||[];s.timeline=x?.timeline||[];s.worldNews=x?.worldNews||[];s.npcs=x?.npcs||[];s.relations=x?.relations||{};s.seenEvents=x?.seenEvents||{};s.eventCooldown=x?.eventCooldown||{};return s;}
function save(){if(S){localStorage.setItem(KEY,JSON.stringify(S));}}
function load(){try{let x=localStorage.getItem(KEY);return x?normalize(JSON.parse(x)):null}catch(e){return null}}
function newGame(){if(confirm('Commencer une nouvelle partie ?')){localStorage.removeItem(KEY);S=null;scene=null;combat=null;renderMenu()}}
function exportSave(){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mha-road-v16.3-save.json';a.click();URL.revokeObjectURL(a.href)}
function importSave(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{S=normalize(JSON.parse(r.result));S.started=true;save();scene=null;render()}catch(e){alert('Sauvegarde invalide.')}};r.readAsText(f)};i.click()}
function startNew(){openCreation()}
function openCreation(){openModal(`<div class="card"><h2>Créer ton personnage</h2><div class="field"><label>Prénom / nom</label><input id="cname" placeholder="Ton nom"></div><div class="field"><label>Genre</label><select id="cgender"><option>Non précisé</option><option>Garçon</option><option>Fille</option></select></div><div class="field"><label>Personnalité dominante</label><select id="cpers"><option>Curieux</option><option>Protecteur</option><option>Ambitieux</option><option>Prudent</option><option>Provocateur</option><option>Réservé</option></select></div><div class="notice">Tu commences au collège. Ton âge et ton évolution scolaire sont gérés par l'histoire : tu n'as rien à choisir ici. Ton Alter n'est pas sélectionné à la création.</div><button class="primary" style="width:100%;margin-top:10px" onclick="createPlayer()">Commencer</button></div>`)}
function createPlayer(){let name=$('cname').value.trim()||'Inconnu';S=base();S.started=true;S.player={name,gender:$('cgender').value,personality:$('cpers').value};generateNPCs();addTimeline('Début','Tu arrives au collège avec une année devant toi. Rien n’est encore décidé.','début');scene=makeEvent('school_start');closeModal();save();render()}
function generateNPCs(){let used=new Set();for(let i=0;i<14;i++){let n;do{n=pick(FIRST)+' '+pick(LAST)}while(used.has(n));used.add(n);let q=pick(['Force','Accélération','Brume','Écho','Cristal','Métamorphose','Lumière','Gravité','Sans révélation']);S.npcs.push({id:'npc'+i,name:n,age:13+rnd(3),class:`${pick(['4e','3e'])} ${pick(['A','B','C','D'])}`,trait:pick(TRAITS),goal:pick(['progresser en cours','trouver sa place','devenir plus fort','protéger quelqu’un','être reconnu','comprendre son Alter','quitter le collège plus tard','se rapprocher d’un groupe']),quirk:q,relation:0,arc:pick(['amitié','rivalité','apprentissage','secret','indépendance']),active:i<8})}}
function addTimeline(title,text,kind='histoire'){S.timeline.push({title,text,kind,day:S.day,season:S.season});S.timeline=S.timeline.slice(-100)}
function remember(text,importance=1){S.memories.push({text,importance,day:S.day,season:S.season});S.memories=S.memories.slice(-80)}
function decide(text){S.decisions.push({text,day:S.day,season:S.season});S.decisions=S.decisions.slice(-60);remember(text,2)}
function schoolContext(){return S.schoolYear==='4e'?'Collège • 4e':S.schoolYear==='3e'?'Collège • 3e':S.school}
function seasonName(){return ['Printemps','Été','Automne','Hiver'][S.season-1]||'Printemps'}
function effective(stat){let n=S.stats[stat]||0,b=0;Object.values(S.equipment).forEach(id=>{let it=EQUIPMENT.find(x=>x[2]===id);if(it)b+=it[4][stat]||0});return n+b}
function equipmentBonus(stat){return effective(stat)-(S.stats[stat]||0)}
function equip(id){let it=EQUIPMENT.find(x=>x[2]===id);if(!it||S.money<it[3])return;let old=S.equipment[it[0]];if(old)return;if(!S.inventory.includes(id))return;S.equipment[it[0]]=id;S.inventory=S.inventory.filter(x=>x!==id);addTimeline('Équipement',`Tu équipes ${id}.`,'équipement');save();render()}
function unequip(slot){let id=S.equipment[slot];if(id){S.inventory.push(id);S.equipment[slot]=null;save();render()}}
function buy(id){let it=EQUIPMENT.find(x=>x[2]===id);if(!it||S.money<it[3]||S.inventory.includes(id)||S.equipment[it[0]]===id)return;S.money-=it[3];S.inventory.push(id);addTimeline('Achat',`Tu achètes ${id} pour ${it[3]} ¥.`,'achat');S.afterAction={title:'Achat effectué',text:`Tu quittes la boutique avec ${id}. Tu devras choisir le bon moment pour l’utiliser.`,effects:[`-${it[3]} ¥`,`Objet ajouté à l’inventaire`]};closeShop();save();render()}
function openShop(){shopEvent={items:EQUIPMENT.filter(x=>!S.inventory.includes(x[2])&&S.equipment[x[0]]!==x[2]).sort(()=>Math.random()-.5).slice(0,8)};render()}
function closeShop(){shopEvent=null}
function statLine(k){let b=equipmentBonus(k);return `<div class="row"><span>${STAT[k]}</span><b>${effective(k)} ${b?`<span class="positive">(+${b})</span>`:''}</b></div>`}
function affinity(id,delta){S.factions[id]=clamp((S.factions[id]||0)+delta,-100,100)}
function evaluateFaction(){let vals=Object.entries(S.factions).sort((a,b)=>b[1]-a[1]);if(vals[0][1]<8)return;let top=vals[0][0];S.factionCandidate=top;remember(`Tes choix commencent à te rapprocher de ${FACTIONS[top].name}.`,1);if(!S.storyFlags.factionHint){S.storyFlags.factionHint=true;addTimeline('Orientation',`Une voie semble progressivement correspondre à ta manière d’agir : ${FACTIONS[top].name}.`,'faction')}}
function factionScoreText(){return Object.entries(S.factions).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row"><span>${FACTIONS[k].name}</span><b>${v>0?'+':''}${v}</b></div>`).join('')}
function applyFactionConsequences(type){if(type==='help')affinity('hero',2),affinity('civil',1);if(type==='study')affinity('support',2);if(type==='risk')affinity('vigilante',2),affinity('hero',1);if(type==='secret')affinity('underground',2);if(type==='avoid')affinity('civil',2);evaluateFaction()}
const EVENT_DEFS=[
{id:'school_start',type:'École',title:'Une place à trouver',weight:5,once:true,text:()=>`La sonnerie vient de retentir. Dans la cour, les groupes se forment déjà. Tu peux t’asseoir près de quelqu’un, observer ou chercher un endroit tranquille.`,choices:[['Aller vers un groupe','Tu prends le risque de te faire remarquer.',()=>{applyFactionConsequences('help');relRandom(2);return 'Tu t’intègres un peu plus vite que prévu.'}],['Observer avant de choisir','Tu préfères comprendre les dynamiques.',()=>{applyFactionConsequences('study');S.stats.intelligence++;return 'Tu repères déjà les élèves qui semblent diriger les autres.'}],['Rester seul','Tu gardes tes distances.',()=>{applyFactionConsequences('avoid');return 'Tu profites du calme, mais personne ne sait encore vraiment qui tu es.'}]]},
{id:'class_surprise',type:'École',title:'Interrogation surprise',weight:4,cool:4,text:()=>`Le professeur pose une feuille sur chaque table. Tu n’avais rien prévu aujourd’hui. La première question te semble abordable, la suite beaucoup moins.`,choices:[['Faire au mieux','Tu avances sans paniquer.',()=>{S.energy-=5;return 'Tu rends une copie correcte. Pas brillante, mais sérieuse.'}],['Analyser méthodiquement','Tu prends quelques secondes pour organiser ton raisonnement.',()=>{S.energy-=7;S.stats.intelligence++;applyFactionConsequences('study');return 'Ton raisonnement est propre et le professeur le remarque.'}],['Regarder autour de toi','Tu cherches discrètement une piste.',()=>{S.rep--;affinity('underground',2);return 'Tu obtiens une petite information, mais tu sais que ce n’était pas très réglo.'}]]},
{id:'club',type:'École',title:'Le club après les cours',weight:4,cool:5,text:()=>`Après les cours, plusieurs salles sont ouvertes. Un club de sport, un atelier technique et un petit groupe d’élèves qui s’entraînent ensemble attirent ton attention.`,choices:[['Rejoindre l’entraînement','Tu préfères apprendre en faisant.',()=>{S.energy-=10;S.stats.endurance++;applyFactionConsequences('risk');return 'L’entraînement est exigeant. Tu découvres que certains élèves prennent déjà leur progression très au sérieux.'}],['Passer à l’atelier','Tu t’intéresses aux outils et aux équipements.',()=>{S.energy-=6;S.stats.intelligence++;applyFactionConsequences('study');return 'Tu passes du temps à comprendre comment certains équipements peuvent compenser les limites d’un Alter.'}],['Rentrer','Tu gardes ton énergie.',()=>{S.energy+=5;return 'Tu rentres tôt. Ce choix semble banal, mais il te laisse du temps pour autre chose.'}]]},
{id:'rumor',type:'Social',title:'Une rumeur circule',weight:4,cool:6,text:()=>{let n=pick(S.npcs);return `Dans le couloir, plusieurs élèves parlent de ${n.name}. Personne ne semble avoir toute l’histoire. Tu pourrais laisser passer ou chercher à comprendre.`},choices:[['Demander directement','Tu préfères entendre sa version.',()=>{let n=pick(S.npcs);n.relation+=4;remember(`Tu as choisi de vérifier une rumeur avant de juger quelqu’un.`,2);applyFactionConsequences('help');return `${n.name} semble apprécier que tu ne te sois pas contenté des rumeurs.`}],['Répéter ce que tu as entendu','Tu alimentes la discussion.',()=>{affinity('underground',2);return 'La rumeur se répand encore plus vite. Tu ne sais pas encore quelles conséquences cela aura.'}],['Ne pas intervenir','Tu refuses d’entrer dans l’histoire.',()=>{return 'Tu passes ton chemin. Le problème ne disparaît pas pour autant.'}]]},
{id:'help',type:'Social',title:'Un camarade en difficulté',weight:5,cool:5,text:()=>{let n=pick(S.npcs);return `${n.name} semble avoir un problème avec un exercice et commence à perdre patience. Plusieurs personnes pourraient l’aider, mais personne ne bouge.`},choices:[['L’aider','Tu prends du temps pour lui expliquer.',()=>{S.energy-=6;relRandom(5);applyFactionConsequences('help');remember('Tu as pris le temps d’aider un camarade en difficulté.');return 'Vous terminez l’exercice ensemble. Une confiance simple commence à s’installer.'}],['Lui montrer comment réfléchir','Tu ne donnes pas la réponse, tu expliques la méthode.',()=>{S.stats.intelligence++;relRandom(3);applyFactionConsequences('help');return 'La méthode fonctionne. Il pourra probablement refaire l’exercice seul la prochaine fois.'}],['Continuer ton travail','Tu n’as pas envie de sacrifier ton propre temps.',()=>{applyFactionConsequences('avoid');return 'Tu continues ton travail. Personne ne t’en veut ouvertement, mais l’occasion de créer un lien est passée.'}]]},
{id:'training_fail',type:'École',title:'L’entraînement qui tourne mal',weight:3,cool:8,text:()=>`Un exercice physique devient plus intense que prévu. Un élève perd le contrôle de son Alter et la situation dégénère en quelques secondes.`,choices:[['Protéger les autres','Tu interviens malgré le danger.',()=>{S.hp-=12;S.courage++;applyFactionConsequences('help');return 'Tu encaisses une partie du choc et permets aux autres de se mettre à l’abri.'}],['Chercher la cause','Tu observes avant de bouger.',()=>{S.energy-=8;S.stats.intelligence++;applyFactionConsequences('study');return 'Tu repères le déclencheur et aides le professeur à arrêter l’exercice.'}],['Prendre du recul','Tu évites de te mettre inutilement en danger.',()=>{applyFactionConsequences('avoid');return 'Tu recules à temps. Tu n’es pas blessé, mais tu comprends que les Alters peuvent devenir dangereux très vite.'}]]},
{id:'first_sign',type:'Alter',title:'Quelque chose ne va pas',weight:2,cool:12,need:()=>!S.quirk,text:()=>`Depuis quelques jours, tu remarques des choses étranges : un mouvement qui va trop vite, un objet qui réagit, une sensation que tu n’arrives pas à expliquer. Aujourd’hui, le phénomène se reproduit devant quelqu’un.`,choices:[['Essayer de reproduire le phénomène','Tu veux comprendre ce qui t’arrive.',()=>discoverQuirk()],['Faire comme si de rien n’était','Tu refuses de paniquer.',()=>{S.storyFlags.quirkSuspicion=true;return 'Tu gardes ton calme, mais le doute ne disparaît pas.'}],['En parler à quelqu’un','Tu acceptes de ne pas comprendre seul.',()=>{S.storyFlags.quirkSuspicion=true;relRandom(3);return 'La personne t’écoute sans se moquer. Tu n’as toujours pas de réponse, mais tu n’es plus seul face au problème.'}]]},
{id:'faction_invite',type:'Orientation',title:'Une proposition inattendue',weight:2,cool:20,need:()=>!!S.factionCandidate&&S.factionStatus==='undecided',text:()=>{let k=S.factionCandidate;return `Tes choix récents ont attiré l’attention de personnes liées à ${FACTIONS[k].name}. Elles te proposent de découvrir leur manière de fonctionner. Rien ne t’oblige encore à les rejoindre.`},choices:[['Accepter la proposition','Tu veux découvrir cette voie de l’intérieur.',()=>{let k=S.factionCandidate;S.factionStatus=k;remember(`Tu as rejoint ${FACTIONS[k].name}.`,3);addTimeline('Faction',`Tu rejoins ${FACTIONS[k].name}.`,'faction');return `Tu acceptes de rejoindre ${FACTIONS[k].name}. Ce choix ouvrira désormais des événements propres à cette voie.`}],['Refuser pour le moment','Tu préfères garder toutes les portes ouvertes.',()=>{return 'Tu refuses de t’engager maintenant. Les différentes voies restent accessibles si tes choix futurs changent.'}],['Demander à rencontrer quelqu’un d’autre','Tu veux comparer avant de choisir.',()=>{let other=Object.entries(S.factions).filter(([k])=>k!==S.factionCandidate).sort((a,b)=>b[1]-a[1])[0]?.[0];if(other){S.factionCandidate=other;return `Tu demandes à entendre une autre voie : ${FACTIONS[other].name}.`}return 'Personne d’autre ne semble prêt à te proposer quoi que ce soit.'}]]},
{id:'shop',type:'Ville',title:'La boutique du quartier',weight:2,cool:7,text:()=>`Sur le chemin du retour, tu remarques une boutique spécialisée dans les équipements d’entraînement et de protection. La vitrine présente du matériel pour tous les budgets.`,choices:[['Entrer dans la boutique','Tu regardes ce que tu pourrais acheter.',()=>{openShop();return 'Tu entres. Certains équipements sont accessibles, d’autres devront attendre.'}],['Regarder sans acheter','Tu compares les prix.',()=>{return 'Tu mémorises quelques références. Ton argent reste intact.'}],['Passer ton chemin','Tu n’as pas besoin de dépenser maintenant.',()=>{return 'Tu continues ton chemin.'}]]},
{id:'odd_meeting',type:'Ville',title:'Une rencontre inattendue',weight:2,cool:9,text:()=>`Dans une rue secondaire, tu remarques une personne qui observe discrètement les élèves. Elle ne porte aucun uniforme. Quand vos regards se croisent, elle détourne la tête.`,choices:[['La suivre à distance','Tu veux comprendre ce qu’elle cherche.',()=>{applyFactionConsequences('secret');S.storyFlags.undergroundContact=true;return 'Tu découvres un contact potentiel, mais tu ne sais pas encore s’il est fiable.'}],['Prévenir un adulte','Tu ne prends pas de risque inutile.',()=>{applyFactionConsequences('help');return 'L’adulte prend ton signalement au sérieux. Tu as peut-être évité un problème.'}],['Ignorer la scène','Tu ne veux pas t’attirer d’ennuis.',()=>{applyFactionConsequences('avoid');return 'Tu continues ton chemin. Pourtant, cette silhouette te reste en tête.'}]]},
{id:'rival',type:'Social',title:'Une provocation',weight:2,cool:10,text:()=>`Un élève te provoque devant plusieurs camarades. Il ne cherche pas seulement une dispute : il veut voir comment tu réagis sous pression.`,choices:[['Répondre sans reculer','Tu acceptes la confrontation.',()=>{applyFactionConsequences('risk');startCombat('Rival scolaire');return 'La confrontation devient physique.'}],['Refuser le jeu','Tu ne lui donnes pas la réaction qu’il attend.',()=>{S.stats.courage++;applyFactionConsequences('hero');return 'La provocation tombe à plat. Ton calme intrigue davantage que ta colère.'}],['Chercher à comprendre','Tu lui demandes ce qu’il veut réellement.',()=>{S.stats.intelligence++;return 'Il hésite. Derrière la provocation, il semble surtout vouloir être reconnu.'}]]},
{id:'exam_project',type:'École',title:'Projet en groupe',weight:4,cool:7,text:()=>`Le professeur annonce un projet à réaliser à plusieurs. Tu ne choisis pas tes partenaires : le groupe est imposé.`,choices:[['Prendre la coordination','Tu répartis les tâches.',()=>{S.stats.courage++;affinity('hero',2);return 'Le groupe avance plus vite lorsque chacun sait ce qu’il doit faire.'}],['Te concentrer sur la partie technique','Tu préfères produire quelque chose de solide.',()=>{S.stats.intelligence++;affinity('support',2);return 'Ta partie devient le socle du projet.'}],['Laisser chacun faire','Tu évites de diriger les autres.',()=>{affinity('civil',2);return 'Le groupe avance de façon désordonnée, mais chacun garde sa liberté.'}]]},
{id:'alone_walk',type:'Ville',title:'Le chemin du retour',weight:4,cool:3,text:()=>`La journée se termine. Tu rentres seul et tu as quelques minutes pour réfléchir à ce qui s’est passé ces derniers jours.`,choices:[['Réfléchir à tes choix','Tu fais le point.',()=>{S.stats.intelligence++;return 'Certaines décisions commencent à prendre un sens lorsque tu les regardes avec un peu de recul.'}],['T’entraîner discrètement','Tu profites de l’endroit pour travailler.',()=>{S.energy-=8;S.stats.endurance++;return 'Tu répètes quelques mouvements jusqu’à sentir la fatigue.'}],['Rentrer directement','Tu préfères récupérer.',()=>{S.energy=clamp(S.energy+12,0,S.maxEnergy);return 'Tu rentres plus tôt et récupères une partie de ton énergie.'}]]}
];
function relRandom(d){let n=pick(S.npcs.filter(x=>x.active));if(n){n.relation=clamp(n.relation+d,-100,100);S.relations[n.id]=n.relation}}
function discoverQuirk(){let q=pick(QUIRKS);S.quirk=q.id;S.quirkXP=3;S.techniques=[0];remember(`Ton Alter ${q.name} s’est manifesté pour la première fois.`,3);addTimeline('Alter découvert',`Ton Alter ${q.name} s’est manifesté.`,'alter');return `Le phénomène se précise enfin. Ton Alter est ${q.name}. Tu n’en maîtrises encore presque rien.`}
function availableEvents(){let candidates=EVENT_DEFS.filter(e=>!e.need||e.need()).filter(e=>!e.once||!S.seenEvents[e.id]);let fresh=candidates.filter(e=>(S.eventCooldown[e.id]||0)<=0);if(fresh.length)candidates=fresh;if(!candidates.length)candidates=EVENT_DEFS.filter(e=>!e.need||e.need()).filter(e=>(S.eventCooldown[e.id]||0)<=0);if(!candidates.length)candidates=EVENT_DEFS.filter(e=>!e.need||e.need());let scored=candidates.map(e=>{let w=e.weight||1;if(e.type==='École')w*=S.schoolYear==='4e'||S.schoolYear==='3e'?2:1;if(e.id==='shop'&&S.money>500)w*=1.4;if(e.id==='faction_invite'&&S.factionCandidate&&S.factionStatus==='undecided')w*=3;if(e.id==='first_sign'&&!S.quirk)w*=2;if(e.id==='rival'&&S.relations)w*=1+(Math.max(...Object.values(S.relations),0)/100);return {e,w}});let total=scored.reduce((a,x)=>a+x.w,0),r=Math.random()*total;for(let x of scored){r-=x.w;if(r<=0)return x.e}return scored[0].e}
function makeEvent(force){let e=force?EVENT_DEFS.find(x=>x.id===force):null;if(!e)e=availableEvents();if(!e)return null;S.eventCooldown[e.id]=e.cool||3;Object.keys(S.eventCooldown).forEach(k=>{if(k!==e.id)S.eventCooldown[k]=Math.max(0,(S.eventCooldown[k]||0)-1)});S.seenEvents[e.id]=(S.seenEvents[e.id]||0)+1;return {id:e.id,type:e.type,title:e.title,text:e.text,choices:e.choices,def:e}}
let generatingAI=false;
function aiChoiceAction(key){switch(key){case 'help':return()=>{applyFactionConsequences('help');relRandom(4);S.energy-=5;return 'Tu choisis d’aider malgré le temps que cela te coûte.'};case 'study':return()=>{applyFactionConsequences('study');S.stats.intelligence++;S.energy-=4;return 'Tu prends le temps d’observer et de comprendre avant d’agir.'};case 'risk':return()=>{applyFactionConsequences('risk');S.stats.courage++;S.energy-=7;return 'Tu acceptes le risque et agis sans attendre davantage.'};case 'secret':return()=>{applyFactionConsequences('secret');S.storyFlags.undergroundContact=true;return 'Tu gardes l’information pour toi et commences à creuser discrètement.'};case 'avoid':return()=>{applyFactionConsequences('avoid');return 'Tu préfères ne pas t’impliquer directement.'};case 'combat':return()=>{applyFactionConsequences('risk');startCombat('Adversaire imprévu');return 'La situation dégénère et tu dois te défendre.'};case 'shop':return()=>{openShop();return 'Tu entres dans une boutique spécialisée.'};default:return()=>{S.stats.intelligence++;return 'Tu prends une décision prudente et essaies de comprendre la situation.'}}}
function convertAIEvent(a){if(!a||!a.title||!a.text||!Array.isArray(a.choices)||a.choices.length<2)return null;let choices=a.choices.slice(0,4).map(c=>[String(c.label),String(c.hint||''),aiChoiceAction(String(c.actionKey||'study'))]);let id='ai_'+Date.now().toString(36)+'_'+rnd(9999);S.seenEvents[id]=(S.seenEvents[id]||0)+1;S.eventCooldown[id]=6;return {id,type:String(a.type||'Événement'),title:String(a.title),text:()=>String(a.text),choices,ai:true}}
async function generateScene(){if(combat)return;if(S.seasonSummary?.pending){render();return}S.action++;S.day++;worldTick();S.energy=clamp(S.energy+5,0,S.maxEnergy);generatingAI=false;render();if(S.ai.enabled){generatingAI=true;render();let ai=await generateAI();generatingAI=false;scene=convertAIEvent(ai)||makeEvent();}else scene=makeEvent();if(scene){S.seasonActions.push({title:scene.title,text:scene.text(),day:S.day});S.seasonActions=S.seasonActions.slice(-12)}save();render()}
function choose(i){if(!scene||combat)return;let c=scene.choices[i];if(!c)return;let before={hp:S.hp,energy:S.energy,money:S.money};let result='';try{result=c[2]();}catch(e){result='L’action s’est déroulée de manière imprévue.';console.error(e)}if(result)addTimeline(scene.title,result,'action');decide(`${scene.title} → ${c[0]}`);S.hp=clamp(S.hp,1,S.maxHp);S.energy=clamp(S.energy,0,S.maxEnergy);S.eventCooldown[scene.id]=Math.max(S.eventCooldown[scene.id]||0,3);if(combat){save();render();return}S.afterAction={title:scene.title,text:result||'Ton choix a fait avancer la situation.',effects:effects(before),eventType:scene.type};scene=null;if(S.seasonActions.length>=12)S.seasonActions.shift();if(S.action>=7){endSeason();return}save();render()}
function effects(b){let e=[];if(S.hp!==b.hp)e.push(`${S.hp-b.hp>0?'+':''}${S.hp-b.hp} PV`);if(S.energy!==b.energy)e.push(`${S.energy-b.energy>0?'+':''}${S.energy-b.energy} énergie`);if(S.money!==b.money)e.push(`${S.money-b.money>0?'+':''}${S.money-b.money} ¥`);return e}
function continueAfter(){S.afterAction=null;generateScene()}
function worldTick(){S.npcs.forEach(n=>{if(Math.random()<.4)n.goal=pick(['progresser en cours','trouver sa place','devenir plus fort','protéger quelqu’un','être reconnu','comprendre son Alter']);if(Math.random()<.22)n.relation=clamp(n.relation+pick([-1,1,1,2]),-100,100)});if(Math.random()<.35){let n=pick(S.npcs);S.worldNews.unshift(`${n.name} semble avancer dans son propre objectif : ${n.goal}.`);S.worldNews=S.worldNews.slice(0,8)}}
function endSeason(){let highs=S.seasonActions.slice(-6).map(x=>x.title),cons=[];if(S.factionStatus!=='undecided')cons.push(`Orientation : ${FACTIONS[S.factionStatus].name}`);if(S.quirk)cons.push(`Alter : ${QUIRKS.find(q=>q.id===S.quirk)?.name||S.quirk}`);if(!cons.length)cons.push('Ton orientation reste ouverte.');S.seasonHistory.push({season:S.season,year:Math.floor((S.day-1)/28)+1,highlights:highs});S.seasonSummary={pending:true,season:S.season,highlights:highs,consequences:cons};S.season=(S.season%4)+1;if(S.season===1){S.age++;if(S.age>=15&&S.schoolYear==='4e')S.schoolYear='3e';else if(S.age>=16&&S.schoolYear==='3e')S.school='Lycée municipal',S.schoolYear='Seconde'}S.action=0;S.seasonActions=[];S.hp=clamp(S.hp+Math.round(S.maxHp*.35),1,S.maxHp);S.energy=S.maxEnergy;worldTick();save();render()}
function startCombat(name){combat={enemy:{name,hp:58,maxHp:58,quirk:pick(['Force','Vitesse','Densité','Électricité','???']),analyzed:0},turn:1,guard:false,log:['Le combat commence.'],ended:false};scene=null}
function combatAction(type,index){if(!combat||combat.ended)return;let e=combat.enemy,q=S.quirk;if(type==='flee'){if(Math.random()<.5){combat.ended=true;combat.log.unshift('Tu parviens à quitter le combat.')}else{combat.log.unshift('Tu n’arrives pas à rompre le contact.');enemyTurn()}save();render();return}if(type==='analyze'){e.analyzed++;combat.log.unshift(e.analyzed>=2?`Alter révélé : ${e.quirk}.`:'Tu observes ses mouvements pour comprendre son Alter.');S.stats.intelligence++;if(e.analyzed>=2)remember(`Tu as découvert que l’Alter de ${e.name} est ${e.quirk}.`);enemyTurn();save();render();return}if(type==='guard'){combat.guard=true;combat.log.unshift('Tu te mets en garde.');enemyTurn();save();render();return}if(type==='attack'){let dmg=Math.max(4,Math.round(5+effective('force')*.55+rnd(5)));e.hp-=dmg;combat.log.unshift(`Ton attaque inflige ${dmg} dégâts.`);if(e.hp<=0)return combatWin();enemyTurn();save();render();return}if(type==='tech'&&q){let t=q.tech[index];if(!S.techniques.includes(index)||S.energy<t[1])return;S.energy-=t[1];if(t[2]==='damage'){let scale=q.id==='acceleration'?effective('vitesse'):q.id==='thermo'||q.id==='ombre'||q.id==='gravite'||q.id==='resonance'?effective('controle'):effective('force');let dmg=Math.max(7,Math.round(scale*.62*t[3]));e.hp-=dmg;combat.log.unshift(`${t[0]} inflige ${dmg} dégâts.`)}else if(t[2]==='guard'){combat.guard=true;combat.log.unshift(`${t[0]} te met en position défensive.`)}else{e.hp-=Math.round(10*t[3]);combat.log.unshift(`${t[0]} déséquilibre l’adversaire.`)}S.quirkXP+=3;if(S.quirkXP>=12&&!S.techniques.includes(1))S.techniques.push(1);if(e.hp<=0)return combatWin();enemyTurn();save();render()}}
function enemyTurn(){let d=Math.max(3,8+rnd(8)-Math.floor(effective('defense')*.22));if(combat.guard){d=Math.round(d*.45);combat.guard=false}S.hp=clamp(S.hp-d,0,S.maxHp);combat.log.unshift(`${combat.enemy.name} te touche et inflige ${d} dégâts.`);combat.turn++;if(S.hp<=0){combat.ended=true;S.hp=Math.max(1,Math.round(S.maxHp*.2));combat.log.unshift('Tu es mis hors de combat. Tu termines la scène blessé.');S.injury=2}}
function combatWin(){combat.ended=true;combat.log.unshift(`Victoire contre ${combat.enemy.name}.`);S.quirkXP+=6;S.hp=clamp(S.hp+Math.round(S.maxHp*.25),1,S.maxHp);S.energy=clamp(S.energy+15,0,S.maxEnergy);addTimeline('Combat',`Tu as remporté un combat contre ${combat.enemy.name}.`,'combat');}
function upgradeTech(){if(!S.quirk)return;let q=QUIRKS.find(x=>x.id===S.quirk);let next=q.tech.findIndex((_,i)=>!S.techniques.includes(i));if(next<0){alert('Toutes les techniques sont déjà connues.');return}let cost=next===1?12:25;if(S.quirkXP<cost){alert(`Il faut ${cost} XP d’Alter.`);return}S.quirkXP-=cost;S.techniques.push(next);remember(`Tu maîtrises maintenant la technique ${q.tech[next][0]}.`,2);save();render()}
async function generateAI(){if(!S.ai.enabled||!S.ai.apiKey){return null}let payload={model:S.ai.model||'gpt-5.6-luna',input:[{role:'system',content:[{type:'input_text',text:'Tu es le narrateur de MHA Road. Tu génères uniquement du contenu narratif cohérent. Ne modifie jamais directement les règles du jeu. Retourne strictement un objet JSON avec title, text, type et choices. Chaque choice contient label, hint et actionKey. Respecte le collège, les personnages existants et les décisions passées.'}]},{role:'user',content:[{type:'input_text',text:JSON.stringify({school:S.schoolYear,season:S.season,day:S.day,personality:S.player.personality,alter:S.quirk?QUIRKS.find(q=>q.id===S.quirk)?.name:null,npcs:S.npcs.slice(0,8).map(n=>({name:n.name,trait:n.trait,goal:n.goal,relation:n.relation})),memories:S.memories.slice(-8),decisions:S.decisions.slice(-8),factions:S.factions,arc:S.arc})}]}],text:{format:{type:'json_schema',name:'mha_event',strict:true,schema:{type:'object',properties:{title:{type:'string'},text:{type:'string'},type:{type:'string'},choices:{type:'array',items:{type:'object',properties:{label:{type:'string'},hint:{type:'string'},actionKey:{type:'string'}},required:['label','hint','actionKey'],additionalProperties:false}}},required:['title','text','type','choices'],additionalProperties:false}}}};
try{let r=await fetch(S.ai.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.ai.apiKey},body:JSON.stringify(payload)});if(!r.ok)throw Error('API '+r.status);let j=await r.json();let txt=j.output_text||j.output?.flatMap(x=>x.content||[]).find(x=>x.text)?.text;if(!txt)throw Error('Réponse IA vide');return JSON.parse(txt)}catch(e){console.warn(e);return null}}
function configureAI(){openModal(`<div class="card"><h2>🤖 Génération IA</h2><p class="muted">Mode hors ligne par défaut. Tu peux activer une API compatible avec l’API Responses d’OpenAI.</p><div class="field"><label>Activer l’IA</label><select id="aien"><option value="0" ${S.ai.enabled?'':'selected'}>Non</option><option value="1" ${S.ai.enabled?'selected':''}>Oui</option></select></div><div class="field"><label>Endpoint</label><input id="aiendpoint" value="${esc(S.ai.endpoint)}"></div><div class="field"><label>Modèle</label><input id="aimodel" value="${esc(S.ai.model)}"></div><div class="field"><label>Clé API</label><input id="aikey" type="password" value="${esc(S.ai.apiKey)}" placeholder="sk-..."></div><div class="notice">⚠️ Une clé API saisie dans un fichier HTML local est stockée côté navigateur et peut être récupérée par quelqu’un ayant accès à l’appareil. Pour un vrai déploiement public, utilise plutôt un petit proxy serveur.</div><button class="primary" style="margin-top:10px" onclick="saveAI()">Enregistrer</button></div>`)}
function saveAI(){S.ai.enabled=$('aien').value==='1';S.ai.endpoint=$('aiendpoint').value.trim()||'https://api.openai.com/v1/responses';S.ai.model=$('aimodel').value.trim()||'gpt-5.6-luna';S.ai.apiKey=$('aikey').value.trim();save();closeModal();render()}
function openModal(html){$('modal').innerHTML=html;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}
function tab(t){activeTab=t;render()}
function renderMenu(){$('root').innerHTML=`<div class="app menu"><div class="card"><h1>MHA Road</h1><p class="muted">V16.3 — moteur narratif refondu</p><div class="feature"><div>📱 <b>UI mobile</b><br><span class="muted">L’action et les combats restent lisibles sans long défilement.</span></div><div>🧠 <b>Mémoire narrative</b><br><span class="muted">Les décisions peuvent revenir bien plus tard.</span></div><div>🏴 <b>Factions</b><br><span class="muted">Tes choix orientent progressivement ton parcours.</span></div><div>🤖 <b>IA optionnelle</b><br><span class="muted">Événements générés avec fallback hors ligne.</span></div></div><button class="primary" style="width:100%;margin:5px 0" onclick="startNew()">✨ Nouvelle partie</button><button style="width:100%;margin:5px 0" onclick="resume()">▶️ Continuer</button><button style="width:100%;margin:5px 0" onclick="importSave()">📦 Importer</button><p class="small muted">Version ${VERSION} • sauvegarde locale</p></div></div>`}
function resume(){let x=load();if(!x){alert('Aucune sauvegarde trouvée.');return}S=x;scene=null;combat=null;render()}
function render(){if(!S||!S.started){renderMenu();return}let hp=S.hp/S.maxHp*100,en=S.energy/S.maxEnergy*100;$('root').innerHTML=`<div class="app"><div class="top"><div class="brand"><div><h1>MHA Road</h1><span class="small muted">${seasonName()} • action ${S.action}/7</span></div><span class="tag">${schoolContext()}</span></div></div><div class="hud"><div class="hudbox">❤️ <b>${S.hp}/${S.maxHp}</b><div class="bar hp"><i style="width:${hp}%"></i></div></div><div class="hudbox">⚡ <b>${S.energy}/${S.maxEnergy}</b><div class="bar en"><i style="width:${en}%"></i></div></div><div class="hudbox">💰 <b>${S.money} ¥</b></div><div class="hudbox">⭐ <b>${S.rep}</b><span class="small">réputation</span></div></div><div class="tabs">${[['story','📖 Histoire'],['character','👤 Personnage'],['alter','🧬 Alter'],['world','🌍 Monde'],['equip','🎒 Équipement'],['journal','📜 Journal']].map(x=>`<button class="${activeTab===x[0]?'active':''}" onclick="tab('${x[0]}')">${x[1]}</button>`).join('')}</div><div id="content"></div></div>`;renderTab()}
function renderTab(){let c=$('content');if(activeTab==='story')renderStory(c);else if(activeTab==='character')renderCharacter(c);else if(activeTab==='alter')renderAlter(c);else if(activeTab==='world')renderWorld(c);else if(activeTab==='equip')renderEquip(c);else renderJournal(c)}
function renderStory(c){let h='';if(generatingAI&&!scene&&!combat&&!S.afterAction){h+=`<div class="card"><h2>🤖 La situation se construit…</h2><p class="muted">Le moteur prépare une scène adaptée à tes décisions, tes relations et au monde actuel.</p></div>`}if(S.afterAction){h+=`<div class="card after"><h3>📖 Ce qui vient de se passer</h3><p>${esc(S.afterAction.text)}</p>${S.afterAction.effects?.length?`<div class="consequence"><b>Conséquences immédiates</b><br>${S.afterAction.effects.map(esc).join(' • ')}</div>`:''}<button class="primary" style="width:100%;margin-top:10px" onclick="continueAfter()">Continuer</button></div>`}if(S.seasonSummary?.pending){h+=`<div class="card"><h2>🎬 Fin de ${seasonName()}</h2><p>La saison est terminée. Voici les éléments qui auront compté.</p><ul>${S.seasonSummary.highlights.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p><b>Orientation :</b> ${S.seasonSummary.consequences.map(esc).join(' • ')}</p><button class="primary" onclick="S.seasonSummary.pending=false;save();generateScene()">Commencer la nouvelle saison</button></div>`}if(combat)h+=renderCombat();else if(scene&&!S.afterAction&&!S.seasonSummary?.pending)h+=`<div class="card scene"><div class="scenehead"><span class="tag">${esc(scene.type)}</span><span class="small muted">Jour ${S.day}</span></div><h2>${esc(scene.title)}</h2><p>${esc(scene.text())}</p>${scene.choices.map((x,i)=>`<button class="choice" onclick="choose(${i})"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></button>`).join('')}</div>`;else if(!S.afterAction&&!S.seasonSummary?.pending)h+=`<div class="card"><p>La journée continue.</p><button class="primary" onclick="generateScene()">Nouvelle situation</button></div>`;if(shopEvent)h+=renderShop();h+=`<div class="card"><div class="footer"><button onclick="save();alert('Sauvegardé.')">💾 Sauvegarder</button><button onclick="configureAI()">🤖 IA</button><button onclick="newGame()" class="danger">↻ Nouvelle partie</button></div></div>`;c.innerHTML=h}
function renderShop(){return `<div class="card"><div class="scenehead"><h2>🛍️ Boutique</h2><button onclick="closeShop();render()">Fermer</button></div><p class="muted">Tu disposes de <b class="money">${S.money} ¥</b>. Les objets achetés vont dans l’inventaire.</p>${shopEvent.items.map(it=>`<div class="shopitem"><div class="row"><span><b>${esc(it[2])}</b><br><span class="muted">${esc(it[5])}</span><br>${Object.entries(it[4]).map(([k,v])=>`${STAT[k]} ${v>0?'+':''}${v}`).join(' • ')}</span><button ${S.money<it[3]?'disabled':''} onclick="buy('${it[2].replace(/'/g,"\\'")}')">${it[3]} ¥</button></div></div>`).join('')}</div>`}
function renderCombat(){let e=combat.enemy,q=S.quirk;return `<div class="card combat"><div class="scenehead"><h2>⚔️ Combat</h2><span class="tag">Tour ${combat.turn}</span></div><div class="combatgrid"><div><b>${esc(e.name)}</b><div class="small muted">Alter : ${e.analyzed>=2?esc(e.quirk):'???'}</div><div class="bar hp"><i style="width:${e.hp/e.maxHp*100}%"></i></div><small>❤️ ${e.hp}/${e.maxHp}</small></div><div><b>${esc(S.player.name)}</b><div class="small muted">${q?esc(q.name):'Sans Alter révélé'}</div><div class="bar hp"><i style="width:${S.hp/S.maxHp*100}%"></i></div><small>❤️ ${S.hp}/${S.maxHp} • ⚡ ${S.energy}</small></div></div>${combat.ended?`<div class="notice" style="margin-top:10px"><b>${esc(combat.log[0])}</b><div class="log">${combat.log.slice(1,4).map(x=>`<div>${esc(x)}</div>`).join('')}</div></div><button class="primary" style="width:100%;margin-top:9px" onclick="combat=null;S.afterAction={title:'Combat terminé',text:'Le combat est terminé. Tu prends quelques secondes pour reprendre tes esprits.',effects:[]};save();render()">Continuer</button>`:`<div class="combat-actions" style="margin-top:10px"><button class="choice" onclick="combatAction('attack')"><b>⚔️ Attaquer</b><span>Attaque physique, coût faible.</span></button><button class="choice" onclick="combatAction('guard')"><b>🛡️ Garde</b><span>Réduit fortement les dégâts du prochain tour.</span></button><button class="choice" onclick="combatAction('analyze')"><b>🔎 Analyser</b><span>Après plusieurs observations, l’Alter ennemi est révélé.</span></button><button class="choice" onclick="combatAction('flee')"><b>↩️ Repli</b><span>Une chance de quitter le combat.</span></button></div>${q?`<h3>🧬 Techniques</h3><div class="combat-actions">${q.tech.map((t,i)=>`<button class="choice tech" ${!S.techniques.includes(i)||S.energy<t[1]?'disabled':''} onclick="combatAction('tech',${i})"><b>${S.techniques.includes(i)?'🧬':'🔒'} ${esc(t[0])}</b><span>${t[1]} énergie</span></button>`).join('')}</div>`:''}<div class="log" style="margin-top:8px">${combat.log.slice(0,5).map(x=>`<div class="logitem">${esc(x)}</div>`).join('')}</div>`}</div>`}
function renderCharacter(c){c.innerHTML=`<div class="card"><h2>👤 ${esc(S.player.name)}</h2><p class="muted">${esc(S.player.gender)} • ${esc(S.player.personality)} • ${schoolContext()}</p>${Object.keys(STAT).map(statLine).join('')}</div><div class="card"><h3>Orientation</h3>${factionScoreText()}<p class="muted">${S.factionStatus==='undecided'?'Aucune faction ne t’est attribuée. Tes choix font évoluer tes affinités.':`Tu t’orientes actuellement vers <b>${FACTIONS[S.factionStatus].name}</b>.`}</p></div><div class="card"><h3>Progression</h3><p>Jour ${S.day} • réputation ${S.rep} • décisions mémorisées ${S.decisions.length}</p><p class="muted">L’âge n’est pas choisi par le joueur : la progression temporelle le fera évoluer avec l’histoire.</p></div>`}
function renderAlter(c){if(!S.quirk){c.innerHTML=`<div class="card"><h2>🧬 Alter</h2><h3>Non révélé</h3><p>Ton Alter se manifestera au cours de l’histoire. Tu ne peux pas le choisir directement.</p></div>`;return}let q=QUIRKS.find(x=>x.id===S.quirk);c.innerHTML=`<div class="card"><h2>🧬 ${esc(q.name)}</h2><span class="tag">${esc(q.family)}</span><p>${esc(q.desc)}</p><p class="muted">Contrecoup : ${esc(q.weak)}</p><p>Maîtrise : <b>${S.quirkXP} XP</b></p>${q.tech.map((t,i)=>`<div class="row"><span><b>${S.techniques.includes(i)?'':'🔒 '}${esc(t[0])}</b><br><span class="muted">Technique ${i+1}</span></span><span>${t[1]}⚡</span></div>`).join('')}<button class="good" style="margin-top:10px" onclick="upgradeTech()">Développer une technique</button></div>`}
function renderWorld(c){c.innerHTML=`<div class="card"><h2>🌍 Monde vivant</h2><p class="muted">${S.npcs.length} camarades possèdent leurs propres objectifs et évoluent sans toi.</p>${S.npcs.map(n=>`<div class="npc"><b>${esc(n.name)}</b> <span class="pill">${n.age} ans • ${esc(n.class)}</span><br><span class="small muted">${esc(n.trait)} • objectif : ${esc(n.goal)}</span><br><span class="small">Alter : ${esc(n.quirk)} • relation : ${n.relation}</span></div>`).join('')}</div><div class="card"><h3>🏴 Factions</h3>${Object.entries(FACTIONS).map(([k,f])=>`<div class="faction"><b>${esc(f.name)}</b><br><span class="small muted">${esc(f.desc)}</span><br><span class="small">Affinité : ${S.factions[k]}</span></div>`).join('')}</div><div class="card"><h3>📰 Monde hors champ</h3>${S.worldNews.length?S.worldNews.map(x=>`<div class="logitem">${esc(x)}</div>`).join(''):'<p class="muted">Rien de notable pour le moment.</p>'}</div>`}
function renderEquip(c){let slots={head:'Tête',torso:'Torse',arms:'Bras',legs:'Jambes',support:'Support'};c.innerHTML=`<div class="card"><h2>🎒 Équipement</h2><p class="muted">Les objets doivent être achetés. Les bonus ne s’appliquent que lorsqu’un objet est équipé.</p>${Object.entries(slots).map(([slot,label])=>{let id=S.equipment[slot],inv=S.inventory.filter(x=>EQUIPMENT.find(it=>it[0]===slot&&it[2]===x));return `<div class="shopitem"><div class="row"><b>${label}</b>${id?`<button onclick="unequip('${slot}')">Retirer</button>`:'<span class="pill">Vide</span>'}</div>${id?`<p>${esc(id)}</p>`:''}${inv.length?inv.map(x=>{let it=EQUIPMENT.find(y=>y[2]===x);return `<div class="row"><span>${esc(x)}<br><span class="small muted">${Object.entries(it[4]).map(([k,v])=>`${STAT[k]} ${v>0?'+':''}${v}`).join(' • ')}</span></span><button onclick="equip('${x.replace(/'/g,"\\'")}')">Équiper</button></div>`}).join(''):'<span class="small muted">Aucun objet dans cet emplacement.</span>'}</div>`}).join('')}</div>`}
function renderJournal(c){c.innerHTML=`<div class="card"><h2>📜 Journal</h2>${S.timeline.length?`<div class="log">${[...S.timeline].reverse().map(x=>`<div class="logitem"><span class="small muted">S${x.season} • jour ${x.day} • ${esc(x.kind)}</span><br><b>${esc(x.title)}</b><br>${esc(x.text)}</div>`).join('')}</div>`:'<p class="muted">Ton histoire commence ici.</p>'}</div><div class="card"><h3>🔧 Sauvegarde & IA</h3><div class="footer"><button onclick="save();alert('Sauvegardé.')">💾 Sauvegarder</button><button onclick="exportSave()">📦 Exporter</button><button onclick="importSave()">📥 Importer</button><button onclick="configureAI()">🤖 Configuration IA</button></div><p class="small muted">IA : ${S.ai.enabled?'activée':'hors ligne'} • les règles du jeu restent locales.</p></div>`}
window.addEventListener('beforeunload',save);if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
S=load();if(S&&S.started){scene=null;combat=null}render();
</script></body></html>
