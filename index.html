<script>
'use strict';
const VERSION='17.0', KEY='MHA_ROAD_V17_SAVE';
const $=id=>document.getElementById(id), clamp=(n,a,b)=>Math.max(a,Math.min(b,n)), rnd=n=>Math.floor(Math.random()*n), pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const STAT={force:'Force',vitesse:'Vitesse',defense:'Défense',intelligence:'Intelligence',endurance:'Endurance',controle:'Contrôle',courage:'Courage'};
let S=null,scene=null,combat=null,activeTab='story',shopEvent=null;
const EQUIPMENT=[
['head','Tête','Casquette renforcée',650,{defense:1,vitesse:1},'Un équipement simple et discret.'],['head','Tête','Casque léger',1800,{defense:3},'Protège mieux, mais alourdit légèrement les mouvements.'],['head','Tête','Visière tactique',4200,{intelligence:2,controle:2},'Aide à analyser rapidement une situation.'],
['torso','Torse','Veste matelassée',1200,{defense:3,endurance:1},'Protection quotidienne.'],['torso','Torse','Gilet renforcé',3600,{defense:5,vitesse:-1},'Solide mais peu discret.'],['torso','Torse','Gilet d’intervention',7800,{defense:3,endurance:2,courage:1},'Conçu pour les situations dangereuses.'],
['arms','Bras','Gants d’entraînement',800,{force:2,controle:1},'Pour travailler les mouvements.'],['arms','Bras','Gantelets renforcés',3100,{force:4,controle:1},'Favorise les frappes puissantes.'],['arms','Bras','Brassards de précision',5200,{controle:4,intelligence:1},'Pour les Alters demandant beaucoup de précision.'],
['legs','Jambes','Chaussures de course',1000,{vitesse:2,endurance:1},'Légères et polyvalentes.'],['legs','Jambes','Chaussures renforcées',2900,{vitesse:3,defense:1},'Plus résistantes aux chocs.'],['legs','Jambes','Bottes d’intervention',6500,{vitesse:2,endurance:3,defense:1},'Conçues pour durer sur le terrain.'],
['support','Support','Bracelet d’assistance',2500,{intelligence:2,controle:1},'Petit outil polyvalent.'],['support','Support','Analyseur portable',5600,{intelligence:4,controle:2},'Améliore l’analyse des Alters.'],['support','Support','Module de soutien',9500,{controle:3,endurance:2,force:1},'Équipement avancé à usage spécialisé.']
];
const QF={kinetic:{family:'Cinétique',roots:['impulsion','inertie','accélération','friction','impact','élan'],vectors:['corps','membres','contact','projectile'],scopes:['cible','zone','ligne'],costs:['fatigue musculaire','douleur articulaire','perte de précision']},elemental:{family:'Élémentaire',roots:['chaleur','froid','électricité','brume','lumière','cendre','vent','pression'],vectors:['corps','paumes','souffle','surface'],scopes:['proche','zone','ligne'],costs:['surchauffe','déshydratation','vertiges','perte de contrôle']},spatial:{family:'Spatial',roots:['densité','gravité','distance','pression','ancrage','compression'],vectors:['champ','contact','regard'],scopes:['cible','zone','point'],costs:['migraine','charge mentale','désorientation']},biological:{family:'Biologique',roots:['durcissement','régénération','mutation','élasticité','métabolisme','adaptation'],vectors:['corps','peau','sang','muscles'],scopes:['corps','contact'],costs:['faim','épuisement','douleur']},sensory:{family:'Sensoriel',roots:['vibration','son','écho','perception','résonance','fréquence'],vectors:['voix','contact','regard','objet'],scopes:['cible','zone','ligne'],costs:['acouphènes','surcharge sensorielle','vertiges']},shadow:{family:'Ombre',roots:['ombre','obscurité','silhouette','camouflage','reflet'],vectors:['corps','surface','contact'],scopes:['proche','zone','ligne'],costs:['dépendance à la lumière','froid','fatigue mentale']},material:{family:'Matière',roots:['cristallisation','métal','verre','fibres','liquide','poussière'],vectors:['corps','contact','surface','projection'],scopes:['cible','zone','ligne'],costs:['déshydratation','perte de matière','épuisement']}};
const QPREFIX=['Aube','Fractale','Pulse','Mirage','Vector','Halo','Rift','Flux','Nexus','Echo','Prisme','Drift','Nova','Karma','Umbra','Volt','Météore','Sillage','Orbit','Vanta'];const QTRAITS=['puissance','précision','mobilité','contrôle de zone','défense','entrave','détection','effet retardé','effet cumulatif','contact','distance','soutien','contre-attaque'];
function generateQuirk(){let k=pick(Object.keys(QF)),f=QF[k],root=pick(f.roots),secondary=Math.random()<.6?pick(Object.keys(QF)):null;if(secondary&&secondary!==k)root+=` / ${pick(QF[secondary].roots)}`;let q={id:'q'+Date.now()+rnd(99999),name:`${pick(QPREFIX)} ${root}`,family:f.family,root,vector:pick(f.vectors),scope:pick(f.scopes),cost:pick(f.costs),secondary,description:'',mastery:0,discoveries:[],traits:[],techniques:[]};q.description=`Ton Alter agit sur ${root}, principalement via ${q.vector}, avec une portée naturelle ${q.scope}.`;q.traits=[pick(QTRAITS)];while(q.traits.length<3&&Math.random()<.55){let t=pick(QTRAITS);if(!q.traits.includes(t))q.traits.push(t)}return q}
function discoverQuirk(){if(S.quirk)return;S.quirk=generateQuirk();S.quirkXP=4;S.quirkMastery=0;S.techniques=[];remember(`Ton Alter se manifeste : ${S.quirk.name}. ${S.quirk.description}`,4);addTimeline('Alter découvert',`Ton Alter est ${S.quirk.name}. Sa forme définitive reste inconnue.`,'alter');return `Le phénomène devient compréhensible. Ton Alter semble être ${S.quirk.name}, mais tu ne connais encore qu'une fraction de ses possibilités.`}
function generateTechnique(o={}){if(!S.quirk)return null;let q=S.quirk,e=o.effect||pick(['damage','guard','control','mobility','utility']),focus=o.focus||pick(q.traits),name=`${o.verb||pick(['Percée','Impulsion','Voile','Ancrage','Projection','Rupture','Compression','Déviation','Sillage','Résonance','Expansion'])} ${o.form||pick(['concentrée','en chaîne','à retardement','circulaire','à distance','au contact','défensive','mobile'])}`;let t={id:'t'+Date.now()+rnd(99999),name,cost:o.cost||8+rnd(16),effect:e,power:1+Math.random()*.75,description:`Une application ${o.form||'adaptée'} de ${q.root}, orientée vers ${focus}.`,tags:[focus,o.form||'adaptée'],uses:0};q.techniques.push(t);q.discoveries.push({day:S.day,name:t.name,reason:o.reason||'expérimentation'});S.quirkXP+=4;S.quirkMastery=(S.quirkMastery||0)+1;remember(`Nouvelle capacité : ${t.name}. ${t.description}`,3);return t}
function alterChoiceEvent(){if(!S.quirk)return null;let a=[['Tester la puissance','Chercher une application offensive.','damage','puissance'],['Travailler la défense','Chercher à te protéger ou détourner.','guard','défense'],['Chercher une utilisation technique','Privilégier précision et utilité.','utility','précision'],['Adapter ton Alter au mouvement','Chercher une application mobile.','mobility','mobilité']];return {id:'alterlab_'+S.day+'_'+S.action,type:'Alter',title:'🧬 Ton Alter cherche une nouvelle forme',text:`${S.quirk.name} ne possède pas une liste de techniques prédéfinies. Tes expérimentations déterminent ses capacités.`,choices:a.map(x=>[x[0],x[1],()=>{let t=generateTechnique({verb:x[0].split(' ')[0],effect:x[2],focus:x[3],reason:'expérimentation choisie'});return `Ton expérimentation fait émerger ${t.name}.`}])}}
const FIRST=['Yuto','Mina','Ren','Aiko','Sora','Kenji','Hana','Daichi','Noa','Riku','Mei','Kaito','Aya','Haru','Nana','Toma','Kenta','Emi','Rei','Koki'];
const LAST=['Sato','Kobayashi','Mori','Tanaka','Aoki','Nakamura','Ishida','Fujita','Kato','Sakai'];
const TRAITS=['réservé','ambitieux','protecteur','provocateur','curieux','studieux','imprévisible','sociable','méfiant','compétitif'];
const FACTIONS={
hero:{name:'Voie héroïque',desc:'Ceux qui veulent protéger les autres et gagner leur place parmi les héros.',threshold:0},support:{name:'Support & Technologie',desc:'Ingénieurs, analystes et inventeurs qui préfèrent préparer le terrain.',threshold:0},underground:{name:'Réseau clandestin',desc:'Un milieu ambigu où information, argent et services circulent hors des institutions.',threshold:0},vigilante:{name:'Justiciers indépendants',desc:'Ceux qui pensent que les institutions sont parfois trop lentes.',threshold:0},civil:{name:'Voie civile',desc:'Une vie sans carrière héroïque, mais avec ses propres ambitions.',threshold:0}};
function base(){return {version:VERSION,started:false,player:{name:'',gender:'',personality:'Curieux'},school:'Collège municipal',schoolYear:'4e',age:14,day:1,season:1,action:0,seasonActions:[],seasonHistory:[],money:250,hp:100,maxHp:100,energy:100,maxEnergy:100,rep:0,stats:{force:8,vitesse:8,defense:8,intelligence:8,endurance:8,controle:8,courage:8},equipment:{head:null,torso:null,arms:null,legs:null,support:null},inventory:[],quirk:null,quirkXP:0,techniques:[],relations:{},npcs:[],memories:[],decisions:[],timeline:[],worldNews:[],eventHistory:[],seenEvents:{},eventCooldown:{},storyFlags:{},factions:{hero:0,support:0,underground:0,vigilante:0,civil:0},factionStatus:'undecided',arc:{id:null,name:'Vie quotidienne',progress:0,threads:[]},afterAction:null,seasonSummary:null,injury:0,gameOver:false};}
function normalize(x){let b=base(),s=Object.assign(b,x||{});s.player=Object.assign(b.player,x?.player||{});s.stats=Object.assign(b.stats,x?.stats||{});s.equipment=Object.assign(b.equipment,x?.equipment||{});s.factions=Object.assign(b.factions,x?.factions||{});s.arc=Object.assign(b.arc,x?.arc||{});s.seasonActions=x?.seasonActions||[];s.seasonHistory=x?.seasonHistory||[];s.inventory=x?.inventory||[];s.memories=x?.memories||[];s.decisions=x?.decisions||[];s.timeline=x?.timeline||[];s.worldNews=x?.worldNews||[];s.eventHistory=x?.eventHistory||[];s.npcs=x?.npcs||[];s.relations=x?.relations||{};s.seenEvents=x?.seenEvents||{};s.eventCooldown=x?.eventCooldown||{};return s;}
function save(){if(S){localStorage.setItem(KEY,JSON.stringify(S));}}
function load(){try{let x=localStorage.getItem(KEY);return x?normalize(JSON.parse(x)):null}catch(e){return null}}
function newGame(){if(confirm('Commencer une nouvelle partie ?')){localStorage.removeItem(KEY);S=null;scene=null;combat=null;renderMenu()}}
function exportSave(){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mha-road-v17-save.json';a.click();URL.revokeObjectURL(a.href)}
function importSave(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{S=normalize(JSON.parse(r.result));S.started=true;save();scene=null;render()}catch(e){alert('Sauvegarde invalide.')}};r.readAsText(f)};i.click()}
function startNew(){openCreation()}
function openCreation(){openModal(`<div class="card"><h2>Créer ton personnage</h2><div class="field"><label>Prénom / nom</label><input id="cname" placeholder="Ton nom"></div><div class="field"><label>Genre</label><select id="cgender"><option>Non précisé</option><option>Garçon</option><option>Fille</option></select></div><div class="field"><label>Personnalité dominante</label><select id="cpers"><option>Curieux</option><option>Protecteur</option><option>Ambitieux</option><option>Prudent</option><option>Provocateur</option><option>Réservé</option></select></div><div class="notice">Tu commences au collège. Ton âge et ton évolution scolaire sont gérés par l'histoire : tu n'as rien à choisir ici. Ton Alter n'est pas sélectionné à la création.</div><button class="primary" style="width:100%;margin-top:10px" onclick="createPlayer()">Commencer</button></div>`)}
function createPlayer(){let name=$('cname').value.trim()||'Inconnu';S=base();S.started=true;S.player={name,gender:$('cgender').value,personality:$('cpers').value};generateNPCs();addTimeline('Début','Tu arrives au collège avec une année devant toi. Rien n’est encore décidé.','début');scene=makeEvent('school_start');closeModal();save();render()}
function generateNPCs(){let used=new Set();for(let i=0;i<14;i++){let n;do{n=pick(FIRST)+' '+pick(LAST)}while(used.has(n));used.add(n);let q=pick(['Force','Accélération','Brume','Écho','Cristal','Métamorphose','Lumière','Gravité','Sans révélation']);S.npcs.push({id:'npc'+i,name:n,age:13+rnd(3),class:`${pick(['4e','3e'])} ${pick(['A','B','C','D'])}`,trait:pick(TRAITS),goal:pick(['progresser en cours','trouver sa place','devenir plus fort','protéger quelqu’un','être reconnu','comprendre son Alter','quitter le collège plus tard','se rapprocher d’un groupe']),quirk:q,relation:0,arc:pick(['amitié','rivalité','apprentissage','secret','indépendance']),active:i<8})}}
function addTimeline(title,text,kind='histoire'){S.timeline.push({title,text,kind,day:S.day,season:S.season});S.timeline=S.timeline.slice(-100)}
function remember(text,importance=1){S.memories.push({text,importance,day:S.day,season:S.season});S.memories=S.memories.slice(-80)}
function decide(text){S.decisions.push({text,day:S.day,season:S.season});S.decisions=S.decisions.slice(-60);remember(text,2)}
function schoolContext(){return S.schoolYear==='4e'?'Collège • 4e':S.schoolYear==='3e'?'Collège • 3e':S.school}
function seasonName(){return ['Printemps','Été','Automne','Hiver'][S.season-1]||'Printemps'}
function effective(stat){let n=S.stats[stat]||0,b=0;Object.values(S.equipment).forEach(id=>{let it=EQUIPMENT.find(x=>x[2]===id);if(it)b+=it[4][stat]||0});return n+b}
function equipmentBonus(stat){return effective(stat)-(S.stats[stat]||0)}
function equip(id){let it=EQUIPMENT.find(x=>x[2]===id);if(!it||S.money<it[3])return;let old=S.equipment[it[0]];if(old)return;if(!S.inventory.includes(id))return;S.equipment[it[0]]=id;S.inventory=S.inventory.filter(x=>x!==id);addTimeline('Équipement',`Tu équipes ${id}.`,'équipement');save();render()}
function unequip(slot){let id=S.equipment[slot];if(id){S.inventory.push(id);S.equipment[slot]=null;save();render()}}
function buy(id){let it=EQUIPMENT.find(x=>x[2]===id);if(!it||S.money<it[3]||S.inventory.includes(id)||S.equipment[it[0]]===id)return;S.money-=it[3];S.inventory.push(id);addTimeline('Achat',`Tu achètes ${id} pour ${it[3]} ¥.`,'achat');S.afterAction={title:'Achat effectué',text:`Tu quittes la boutique avec ${id}. Tu devras choisir le bon moment pour l’utiliser.`,effects:[`-${it[3]} ¥`,`Objet ajouté à l’inventaire`]};closeShop();save();render()}
function openShop(){shopEvent={items:EQUIPMENT.filter(x=>!S.inventory.includes(x[2])&&S.equipment[x[0]]!==x[2]).sort(()=>Math.random()-.5).slice(0,8)};render()}
function closeShop(){shopEvent=null}
function statLine(k){let b=equipmentBonus(k);return `<div class="row"><span>${STAT[k]}</span><b>${effective(k)} ${b?`<span class="positive">(+${b})</span>`:''}</b></div>`}
function affinity(id,delta){S.factions[id]=clamp((S.factions[id]||0)+delta,-100,100)}
function evaluateFaction(){let vals=Object.entries(S.factions).sort((a,b)=>b[1]-a[1]);if(vals[0][1]<8)return;let top=vals[0][0];S.factionCandidate=top;remember(`Tes choix commencent à te rapprocher de ${FACTIONS[top].name}.`,1);if(!S.storyFlags.factionHint){S.storyFlags.factionHint=true;addTimeline('Orientation',`Une voie semble progressivement correspondre à ta manière d’agir : ${FACTIONS[top].name}.`,'faction')}}
function factionScoreText(){return Object.entries(S.factions).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row"><span>${FACTIONS[k].name}</span><b>${v>0?'+':''}${v}</b></div>`).join('')}
function applyFactionConsequences(type){if(type==='help')affinity('hero',2),affinity('civil',1);if(type==='study')affinity('support',2);if(type==='risk')affinity('vigilante',2),affinity('hero',1);if(type==='secret')affinity('underground',2);if(type==='avoid')affinity('civil',2);evaluateFaction()}
const EVENT_PARTS={school:{places:['salle de classe','cour','couloir','bibliothèque','gymnase','cantine','salle informatique'],situations:['un travail collectif devient compliqué','une consigne est mal comprise','un élève cache un problème','un exercice prend une tournure inattendue','une rumeur circule','un conflit éclate','un élève demande ton aide','un résultat surprend la classe'],tones:['banal','tendu','curieux','gênant','drôle']},social:{places:['cour','cantine','trajet du retour','quartier','bibliothèque','message'],situations:['une conversation devient personnelle','une invitation arrive','une confidence te surprend','un malentendu apparaît','quelqu’un demande ton avis','une relation change'],tones:['intime','léger','tendu','étrange','émouvant']},alter:{places:['gymnase','terrain vague','salle d’entraînement','cour vide','chez toi'],situations:['une réaction inattendue se produit','un usage jamais essayé fonctionne','le contrecoup apparaît','une application secondaire semble possible','une expérience échoue','ton Alter réagit à une émotion'],tones:['expérimental','dangereux','fascinant','frustrant']},world:{places:['quartier','rue commerçante','gare','parc','centre-ville'],situations:['un incident attire les regards','une rumeur sur un héros circule','un petit problème demande de l’aide','un événement local perturbe la routine','une personne semble te reconnaître','un professionnel intervient'],tones:['urbain','inattendu','inquiétant','ordinaire']},faction:{places:['après les cours','un lieu discret','un événement public','une salle associative'],situations:['quelqu’un observe tes choix','une proposition indirecte apparaît','une information te parvient','une personne teste ta réaction','une porte s’ouvre sans invitation'],tones:['secret','ambigu','prometteur','risqué']},shop:{places:['une boutique spécialisée','un stand temporaire','un atelier de support'],situations:['du matériel inhabituel est exposé','une démonstration attire ton attention','un équipement correspond à ton style','une promotion limitée apparaît'],tones:['commercial','curieux','technique']}};
const CHOICES={school:['aider','observer','confronter','proposer une solution','te retirer'],social:['écouter','dire franchement ce que tu penses','faire une blague','poser une question','prendre tes distances'],alter:['tester','arrêter avant le risque','demander conseil','changer d’approche'],world:['intervenir','observer','chercher de l’aide','partir','poser des questions'],faction:['écouter','refuser','négocier','demander des informations'],shop:['regarder les équipements','discuter avec le vendeur','acheter un objet','revenir plus tard']};
function eventWeights(){return {school:4+(S.action<3?3:0),social:2.5,alter:S.quirk?2.4:1.8,world:1.8,faction:S.factionCandidate?2:.6,shop:S.money>=650?1.4:.2}}function weighted(w){let t=Object.values(w).reduce((a,b)=>a+b,0),r=Math.random()*t;for(let k in w){r-=w[k];if(r<=0)return k}return 'school'}function targetNPC(){return pick(S.npcs.filter(n=>n.active).slice(0,8))}
function proceduralEvent(force){let type=force||weighted(eventWeights()),p=EVENT_PARTS[type],npc=targetNPC(),place=pick(p.places),sit=pick(p.situations),tone=pick(p.tones),sig=`${type}|${place}|${sit}|${npc?.id||tone}`;if(S.eventHistory.slice(-14).some(x=>x.signature===sig))return proceduralEvent(type==='school'?'social':type);let subject=(type==='school'||type==='social')&&npc?npc.name:pick(['un camarade','un professeur','un adulte','un professionnel','un inconnu','un petit groupe']);let extra=type==='school'?` Tu es au ${schoolContext().toLowerCase()}.`:'';if(type==='social'&&npc)extra+=` Votre relation est à ${Math.round(S.relations[npc.id]??npc.relation)}.`;if(type==='alter'&&S.quirk)extra+=` ${S.quirk.name} réagit encore de façon imprévisible.`;if(type==='faction'&&S.factionCandidate)extra+=` Tes choix récents t'ont rapproché de ${FACTIONS[S.factionCandidate].name}.`;let lead={school:'Une situation au collège',social:'Un moment qui compte',alter:'Une piste pour ton Alter',world:'Quelque chose se passe en ville',faction:'Une porte entrouverte',shop:'Une occasion de t’équiper'}[type];let title=`${lead} — ${place}`;let text=`${place[0].toUpperCase()+place.slice(1)}. ${subject} est impliqué : ${sit}. L’ambiance est ${tone}.${extra} Ce qui compte maintenant est ce que ta décision fera évoluer.`;let vs=[...CHOICES[type]],chosen=[];while(chosen.length<4){let v=pick(vs);vs=vs.filter(x=>x!==v);chosen.push(v)}let choices=chosen.map((v,i)=>[v[0].toUpperCase()+v.slice(1),['Une approche prudente.','Une décision qui peut modifier un lien.','Tu prends un risque pour en apprendre davantage.','Une solution pensée pour la suite.'][i],()=>applyProceduralChoice(type,v,npc,i)]);return {id:'proc_'+Date.now()+'_'+rnd(9999),type,title,text,choices,signature,npcId:npc?.id}}
function applyProceduralChoice(type,v,npc,i){let out=[];if(npc){let d=[3,2,-2,-1][i];S.relations[npc.id]=clamp((S.relations[npc.id]??npc.relation)+d,-100,100);npc.relation=S.relations[npc.id];out.push(d>0?`${npc.name} se rapproche de toi`:`La relation avec ${npc.name} devient plus compliquée`)}if(type==='school'){if(/aider|solution/.test(v)){S.energy=Math.max(0,S.energy-5);S.rep++;affinity('hero',2)}else if(/observer/.test(v)){S.stats.intelligence++;affinity('support',2)}else if(/confronter/.test(v)){S.energy=Math.max(0,S.energy-7);S.rep++;affinity('vigilante',2)}else affinity('civil',1)}else if(type==='social'){S.energy=Math.max(0,S.energy-3)}else if(type==='alter'){S.quirkXP+=2;if(i===0)S.stats.force++;if(i===1)S.stats.controle++;if(i===2)S.stats.intelligence++;if(i===3)S.stats.vitesse++;if(Math.random()<.75){let t=generateTechnique({verb:'Adaptation',effect:i===0?'damage':i===1?'guard':'utility',focus:i===0?'puissance':i===1?'défense':'précision',reason:'expérimentation pendant un événement'});out.push(`Nouvelle capacité : ${t.name}`)}}else if(type==='world'){if(i===0){S.rep++;affinity('hero',2)}else if(i===1)S.stats.intelligence++;else if(i===2)S.money+=20;else affinity('civil',1)}else if(type==='faction'){if(i===0||i===2)affinity(S.factionCandidate||'hero',i===0?3:2);if(i===1)affinity('civil',1);if(i===3)S.stats.intelligence++}else if(type==='shop'&&i===2)openShop();if(type!=='shop'&&Math.random()<.18)S.money+=15;return out.length?out.join('. '):'Ton choix modifie subtilement la situation. Certaines conséquences ne seront visibles que plus tard.'}
function makeEvent(force){return proceduralEvent(['school','social','alter','world','faction','shop'].includes(force)?force:null)}
function generateScene(){if(!S||combat||S.afterAction)return;if(S.seasonSummary?.pending){render();return}S.action++;S.day++;S.energy=clamp(S.energy+6,0,S.maxEnergy);worldTick();let sp=null;if(!S.quirk&&S.action>=2&&Math.random()<.32)sp={id:'manifest_'+S.day,type:'Alter',title:'🧬 Le premier signe',text:'Quelque chose réagit autour de toi. Ton corps semble répondre à une force inconnue.',choices:[['Chercher à reproduire le phénomène','Tu veux comprendre.',()=>discoverQuirk()],['Ne rien tenter','Tu refuses de provoquer à nouveau le phénomène.',()=>{remember('Tu as ignoré le premier signe de ton Alter.',2);return 'Tu laisses le phénomène passer.'}],['En parler à quelqu’un','Tu demandes un avis.',()=>{S.stats.intelligence++;return discoverQuirk()}]]};else if(S.quirk&&Math.random()<.24)sp=alterChoiceEvent();scene=sp||makeEvent();S.eventHistory.push({signature:scene.signature||scene.id,title:scene.title,day:S.day,type:scene.type});S.eventHistory=S.eventHistory.slice(-100);S.seasonActions.push({title:scene.title,day:S.day});if(S.seasonActions.length>10)S.seasonActions.shift();if(S.action>=8)S.storyFlags.seasonEnding=true;save();render()}
function choose(i){if(!scene||combat)return;let c=scene.choices[i];if(!c)return;let before={hp:S.hp,energy:S.energy,money:S.money};let result='';try{result=c[2]();}catch(e){result='L’action s’est déroulée de manière imprévue.';console.error(e)}if(result)addTimeline(scene.title,result,'action');decide(`${scene.title} → ${c[0]}`);S.hp=clamp(S.hp,1,S.maxHp);S.energy=clamp(S.energy,0,S.maxEnergy);S.afterAction={title:scene.title,text:result||'Ton choix a fait avancer la situation.',effects:effects(before),eventType:scene.type};scene=null;if(S.seasonActions.length>=12)S.seasonActions.shift();if(S.action>=7){endSeason();return}save();render()}
function effects(b){let e=[];if(S.hp!==b.hp)e.push(`${S.hp-b.hp>0?'+':''}${S.hp-b.hp} PV`);if(S.energy!==b.energy)e.push(`${S.energy-b.energy>0?'+':''}${S.energy-b.energy} énergie`);if(S.money!==b.money)e.push(`${S.money-b.money>0?'+':''}${S.money-b.money} ¥`);return e}
function continueAfter(){S.afterAction=null;generateScene()}
function worldTick(){S.npcs.forEach(n=>{if(Math.random()<.4)n.goal=pick(['progresser en cours','trouver sa place','devenir plus fort','protéger quelqu’un','être reconnu','comprendre son Alter']);if(Math.random()<.22)n.relation=clamp(n.relation+pick([-1,1,1,2]),-100,100)});if(Math.random()<.35){let n=pick(S.npcs);S.worldNews.unshift(`${n.name} semble avancer dans son propre objectif : ${n.goal}.`);S.worldNews=S.worldNews.slice(0,8)}}
function endSeason(){let highs=S.seasonActions.slice(-6).map(x=>x.title),cons=[];if(S.factionStatus!=='undecided')cons.push(`Orientation : ${FACTIONS[S.factionStatus].name}`);if(S.quirk)cons.push(`Alter : ${S.quirk.name}`);if(!cons.length)cons.push('Ton orientation reste ouverte.');S.seasonHistory.push({season:S.season,year:Math.floor((S.day-1)/28)+1,highlights:highs});S.seasonSummary={pending:true,season:S.season,highlights:highs,consequences:cons};S.season=(S.season%4)+1;if(S.season===1){S.age++;if(S.age>=15&&S.schoolYear==='4e')S.schoolYear='3e';else if(S.age>=16&&S.schoolYear==='3e')S.school='Lycée municipal',S.schoolYear='Seconde'}S.action=0;S.seasonActions=[];S.hp=clamp(S.hp+Math.round(S.maxHp*.35),1,S.maxHp);S.energy=S.maxEnergy;worldTick();save();render()}
function startCombat(name){let enemyQ=generateQuirk();combat={enemy:{name,hp:65+rnd(35),maxHp:0,quirk:enemyQ,analyzed:0,playerGuard:false},turn:1,log:['Le combat commence.'],ended:false};combat.enemy.maxHp=combat.enemy.hp;scene=null;render()}
function combatAction(type,index){if(!combat||combat.ended)return;let e=combat.enemy;if(type==='flee'){if(Math.random()<.5){combat.ended=true;combat.log.unshift('Tu parviens à rompre le combat.')}else{combat.log.unshift('Tu n’arrives pas à t’échapper.');enemyTurn()}return save(),render()}if(type==='analyze'){e.analyzed++;combat.log.unshift(e.analyzed>=2?`Alter révélé : ${e.quirk.name}.`:'Tu observes ses mouvements pour comprendre son Alter.');if(e.analyzed>=2)remember(`Tu as découvert l’Alter ${e.quirk.name} de ${e.name}.`,2);enemyTurn();return save(),render()}if(type==='guard'){e.playerGuard=true;combat.log.unshift('Tu te protèges et observes.');enemyTurn();return save(),render()}if(type==='attack'){let d=Math.max(4,Math.round(5+effective('force')*.55+rnd(5)));e.hp-=d;combat.log.unshift(`Ton attaque inflige ${d} dégâts.`);if(e.hp<=0){combatWin();return render()}enemyTurn();return save(),render()}if(type==='tech'&&S.quirk){let t=S.quirk.techniques[index];if(!t||S.energy<t.cost)return;S.energy-=t.cost;t.uses++;let scale=t.effect==='mobility'?effective('vitesse'):t.effect==='guard'?effective('defense'):effective('controle');let d=Math.max(5,Math.round(scale*.45*t.power));if(t.effect==='damage'){e.hp-=d;combat.log.unshift(`${t.name} inflige ${d} dégâts.`)}else if(t.effect==='guard'){e.playerGuard=true;combat.log.unshift(`${t.name} te protège.`)}else if(t.effect==='mobility'){e.hp-=Math.round(d*.8);combat.log.unshift(`${t.name} frappe en mouvement (${Math.round(d*.8)} dégâts).`)}else{e.hp-=Math.round(d*.65);combat.log.unshift(`${t.name} perturbe l’adversaire.`)}S.quirkXP+=2;if(e.hp<=0){combatWin();return render()}enemyTurn();return save(),render()}}
function enemyTurn(){let e=combat.enemy,d=Math.max(3,Math.round(8+rnd(9)-effective('defense')*.2));if(e.playerGuard){d=Math.round(d*.45);e.playerGuard=false}S.hp=clamp(S.hp-d,0,S.maxHp);combat.log.unshift(`${e.name} utilise son Alter et inflige ${d} dégâts.`);combat.turn++;if(S.hp<=0){combat.ended=true;S.hp=Math.max(1,Math.round(S.maxHp*.22));S.injury=2;combat.log.unshift('Tu es mis hors de combat.')}}
function combatWin(){combat.ended=true;combat.log.unshift(`Victoire contre ${combat.enemy.name}.`);S.quirkXP+=7;S.hp=clamp(S.hp+Math.round(S.maxHp*.22),1,S.maxHp);S.energy=clamp(S.energy+18,0,S.maxEnergy);addTimeline('Combat',`Tu remportes un combat contre ${combat.enemy.name}.`,'combat')}
function openModal(html){$('modal').innerHTML=html;$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}
function tab(name){activeTab=name;render()}
function renderMenu(){
  const has=!!(load());
  $('root').innerHTML=`<div class="app menu"><div class="card"><span class="tag">V17.0 • moteur procédural</span><h1>MHA Road</h1><p class="muted">Un RPG narratif dans l’univers de My Hero Academia.</p><div class="feature"><div><b>🎲 Événements générés</b><br><span class="small muted">Les situations sont assemblées selon ton histoire.</span></div><div><b>🧬 Alters évolutifs</b><br><span class="small muted">Les capacités apparaissent par expérimentation.</span></div><div><b>🌍 Monde vivant</b><br><span class="small muted">Les PNJ et factions évoluent avec le temps.</span></div><div><b>📱 Hors connexion</b><br><span class="small muted">Aucune API et aucun coût par génération.</span></div></div><button class="primary" style="width:100%;margin-top:8px" onclick="startNew()">▶ Nouvelle partie</button>${has?`<button class="good" style="width:100%;margin-top:8px" onclick="S=load();S.started=true;render()">↩ Continuer la partie</button>`:''}<button style="width:100%;margin-top:8px" onclick="importSave()">📥 Importer une sauvegarde</button></div></div>`;
}
function render(){if(!S||!S.started){renderMenu();return}let hp=S.hp/S.maxHp*100,en=S.energy/S.maxEnergy*100;$('root').innerHTML=`<div class="app"><div class="top"><div class="brand"><div><h1>MHA Road</h1><span class="small muted">${seasonName()} • action ${S.action}/7</span></div><span class="tag">${schoolContext()}</span></div></div><div class="hud"><div class="hudbox">❤️ <b>${S.hp}/${S.maxHp}</b><div class="bar hp"><i style="width:${hp}%"></i></div></div><div class="hudbox">⚡ <b>${S.energy}/${S.maxEnergy}</b><div class="bar en"><i style="width:${en}%"></i></div></div><div class="hudbox">💰 <b>${S.money} ¥</b></div><div class="hudbox">⭐ <b>${S.rep}</b><span class="small">réputation</span></div></div><div class="tabs">${[['story','📖 Histoire'],['character','👤 Personnage'],['alter','🧬 Alter'],['world','🌍 Monde'],['equip','🎒 Équipement'],['journal','📜 Journal']].map(x=>`<button class="${activeTab===x[0]?'active':''}" onclick="tab('${x[0]}')">${x[1]}</button>`).join('')}</div><div id="content"></div></div>`;renderTab()}
function renderTab(){let c=$('content');if(activeTab==='story')renderStory(c);else if(activeTab==='character')renderCharacter(c);else if(activeTab==='alter')renderAlter(c);else if(activeTab==='world')renderWorld(c);else if(activeTab==='equip')renderEquip(c);else renderJournal(c)}
function renderStory(c){let h='';if(S.afterAction){h+=`<div class="card after"><h3>📖 Ce qui vient de se passer</h3><p>${esc(S.afterAction.text)}</p>${S.afterAction.effects?.length?`<div class="consequence"><b>Conséquences immédiates</b><br>${S.afterAction.effects.map(esc).join(' • ')}</div>`:''}<button class="primary" style="width:100%;margin-top:10px" onclick="continueAfter()">Continuer</button></div>`}if(S.seasonSummary?.pending){h+=`<div class="card"><h2>🎬 Fin de ${seasonName()}</h2><p>La saison est terminée. Voici les éléments qui auront compté.</p><ul>${S.seasonSummary.highlights.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p><b>Orientation :</b> ${S.seasonSummary.consequences.map(esc).join(' • ')}</p><button class="primary" onclick="S.seasonSummary.pending=false;save();generateScene()">Commencer la nouvelle saison</button></div>`}if(combat)h+=renderCombat();else if(scene&&!S.afterAction&&!S.seasonSummary?.pending)h+=`<div class="card scene"><div class="scenehead"><span class="tag">${esc(scene.type)}</span><span class="small muted">Jour ${S.day}</span></div><h2>${esc(scene.title)}</h2><p>${esc(scene.text)}</p>${scene.choices.map((x,i)=>`<button class="choice" onclick="choose(${i})"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></button>`).join('')}</div>`;else if(!S.afterAction&&!S.seasonSummary?.pending)h+=`<div class="card"><p>La journée continue.</p><button class="primary" onclick="generateScene()">Nouvelle situation</button></div>`;if(shopEvent)h+=renderShop();h+=`<div class="card"><div class="footer"><button onclick="save();alert('Sauvegardé.')">💾 Sauvegarder</button><button onclick="newGame()" class="danger">↻ Nouvelle partie</button></div></div>`;c.innerHTML=h}
function renderShop(){return `<div class="card"><div class="scenehead"><h2>🛍️ Boutique</h2><button onclick="closeShop();render()">Fermer</button></div><p class="muted">Tu disposes de <b class="money">${S.money} ¥</b>. Les objets achetés vont dans l’inventaire.</p>${shopEvent.items.map(it=>`<div class="shopitem"><div class="row"><span><b>${esc(it[2])}</b><br><span class="muted">${esc(it[5])}</span><br>${Object.entries(it[4]).map(([k,v])=>`${STAT[k]} ${v>0?'+':''}${v}`).join(' • ')}</span><button ${S.money<it[3]?'disabled':''} onclick="buy('${it[2].replace(/'/g,"\\'")}')">${it[3]} ¥</button></div></div>`).join('')}</div>`}
function renderCombat(){let e=combat.enemy,q=S.quirk;return `<div class="card combat"><div class="scenehead"><h2>⚔️ Combat</h2><span class="tag">Tour ${combat.turn}</span></div><div class="combatgrid"><div><b>${esc(e.name)}</b><div class="small muted">Alter : ${e.analyzed>=2?esc(e.quirk.name):'???'}</div><div class="bar hp"><i style="width:${e.hp/e.maxHp*100}%"></i></div><small>❤️ ${e.hp}/${e.maxHp}</small></div><div><b>${esc(S.player.name)}</b><div class="small muted">${q?esc(q.name):'Alter inconnu'}</div><div class="bar hp"><i style="width:${S.hp/S.maxHp*100}%"></i></div><small>❤️ ${S.hp}/${S.maxHp} • ⚡ ${S.energy}</small></div></div>${combat.ended?`<div class="notice"><b>${esc(combat.log[0])}</b><div class="log">${combat.log.slice(1,5).map(x=>`<div>${esc(x)}</div>`).join('')}</div></div><button class="primary" style="width:100%;margin-top:8px" onclick="combat=null;S.afterAction={title:'Combat terminé',text:'Le combat est terminé. Ton expérience alimentera les prochaines évolutions de ton Alter.',effects:[]};save();render()">Continuer</button>`:`<div class="combat-actions"><button class="choice" onclick="combatAction('attack')"><b>⚔️ Attaque</b><span>Force physique.</span></button><button class="choice" onclick="combatAction('guard')"><b>🛡️ Garde</b><span>Réduit les dégâts reçus.</span></button><button class="choice" onclick="combatAction('analyze')"><b>🔎 Analyser</b><span>Révéler progressivement l’Alter adverse.</span></button><button class="choice" onclick="combatAction('flee')"><b>↩️ Repli</b><span>Tenter de quitter le combat.</span></button></div>${q?`<h3>🧬 Capacités découvertes</h3><div class="combat-actions">${q.techniques.map((t,i)=>`<button class="choice tech" ${S.energy<t.cost?'disabled':''} onclick="combatAction('tech',${i})"><b>${esc(t.name)}</b><span>${t.cost}⚡ • ${esc(t.description)}</span></button>`).join('')||'<p class="muted">Aucune capacité de combat découverte.</p>'}</div>`:''}<div class="log">${combat.log.slice(0,5).map(x=>`<div class="logitem">${esc(x)}</div>`).join('')}</div>`}</div>`}
function renderCharacter(c){c.innerHTML=`<div class="card"><h2>👤 ${esc(S.player.name)}</h2><p class="muted">${esc(S.player.gender)} • ${esc(S.player.personality)} • ${schoolContext()}</p>${Object.keys(STAT).map(statLine).join('')}</div><div class="card"><h3>Orientation</h3>${factionScoreText()}<p class="muted">${S.factionStatus==='undecided'?'Aucune faction ne t’est attribuée. Tes choix font évoluer tes affinités.':`Tu t’orientes actuellement vers <b>${FACTIONS[S.factionStatus].name}</b>.`}</p></div><div class="card"><h3>Progression</h3><p>Jour ${S.day} • réputation ${S.rep} • décisions mémorisées ${S.decisions.length}</p><p class="muted">L’âge n’est pas choisi par le joueur : la progression temporelle le fera évoluer avec l’histoire.</p></div>`}
function renderAlter(c){if(!S.quirk){c.innerHTML=`<div class="card"><h2>🧬 Alter</h2><h3>Non révélé</h3><p>Ton Alter n’est pas choisi à la création. Il émergera dans l’histoire.</p></div>`;return}let q=S.quirk;c.innerHTML=`<div class="card"><h2>🧬 ${esc(q.name)}</h2><span class="tag">${esc(q.family)}</span><p>${esc(q.description)}</p><p class="muted">Vecteur : ${esc(q.vector)} • portée : ${esc(q.scope)} • contrecoup : ${esc(q.cost)}</p><p>Maîtrise : <b>${S.quirkMastery}</b> • XP : <b>${S.quirkXP}</b></p><p>Traits : ${q.traits.map(esc).join(' • ')}</p><h3>Capacités découvertes</h3>${q.techniques.length?q.techniques.map(t=>`<div class="npc"><b>${esc(t.name)}</b><br><span class="small muted">${esc(t.description)} • ${t.cost}⚡</span></div>`).join(''):'<p class="muted">Aucune capacité n’est prédéfinie. Elles apparaissent par expérimentation.</p>'}<button class="good" style="width:100%;margin-top:8px" onclick="scene=alterChoiceEvent();S.afterAction=null;save();render()">🧪 Expérimenter</button></div>`}
function renderWorld(c){c.innerHTML=`<div class="card"><h2>🌍 Monde vivant</h2><p class="muted">${S.npcs.length} camarades possèdent leurs propres objectifs et évoluent sans toi.</p>${S.npcs.map(n=>`<div class="npc"><b>${esc(n.name)}</b> <span class="pill">${n.age} ans • ${esc(n.class)}</span><br><span class="small muted">${esc(n.trait)} • objectif : ${esc(n.goal)}</span><br><span class="small">Alter : ${esc(n.quirk)} • relation : ${n.relation}</span></div>`).join('')}</div><div class="card"><h3>🏴 Factions</h3>${Object.entries(FACTIONS).map(([k,f])=>`<div class="faction"><b>${esc(f.name)}</b><br><span class="small muted">${esc(f.desc)}</span><br><span class="small">Affinité : ${S.factions[k]}</span></div>`).join('')}</div><div class="card"><h3>📰 Monde hors champ</h3>${S.worldNews.length?S.worldNews.map(x=>`<div class="logitem">${esc(x)}</div>`).join(''):'<p class="muted">Rien de notable pour le moment.</p>'}</div>`}
function renderEquip(c){let slots={head:'Tête',torso:'Torse',arms:'Bras',legs:'Jambes',support:'Support'};c.innerHTML=`<div class="card"><h2>🎒 Équipement</h2><p class="muted">Les objets doivent être achetés. Les bonus ne s’appliquent que lorsqu’un objet est équipé.</p>${Object.entries(slots).map(([slot,label])=>{let id=S.equipment[slot],inv=S.inventory.filter(x=>EQUIPMENT.find(it=>it[0]===slot&&it[2]===x));return `<div class="shopitem"><div class="row"><b>${label}</b>${id?`<button onclick="unequip('${slot}')">Retirer</button>`:'<span class="pill">Vide</span>'}</div>${id?`<p>${esc(id)}</p>`:''}${inv.length?inv.map(x=>{let it=EQUIPMENT.find(y=>y[2]===x);return `<div class="row"><span>${esc(x)}<br><span class="small muted">${Object.entries(it[4]).map(([k,v])=>`${STAT[k]} ${v>0?'+':''}${v}`).join(' • ')}</span></span><button onclick="equip('${x.replace(/'/g,"\\'")}')">Équiper</button></div>`}).join(''):'<span class="small muted">Aucun objet dans cet emplacement.</span>'}</div>`}).join('')}</div>`}
function renderJournal(c){c.innerHTML=`<div class="card"><h2>📜 Journal</h2>${S.timeline.length?`<div class="log">${[...S.timeline].reverse().map(x=>`<div class="logitem"><span class="small muted">S${x.season} • jour ${x.day} • ${esc(x.kind)}</span><br><b>${esc(x.title)}</b><br>${esc(x.text)}</div>`).join('')}</div>`:'<p class="muted">Ton histoire commence ici.</p>'}</div><div class="card"><h3>🔧 Sauvegarde</h3><div class="footer"><button onclick="save();alert('Sauvegardé.')">💾 Sauvegarder</button><button onclick="exportSave()">📦 Exporter</button><button onclick="importSave()">📥 Importer</button></div><p class="small muted">Génération procédurale hors connexion • aucune API nécessaire.</p></div>`}
window.addEventListener('beforeunload',save);if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
S=load();if(S&&S.started){scene=null;combat=null}render();
</script></body></html>
