n:9px 0}.scene{border-color:#36547e}.scene h2{margin:2px 0 8px;font-size:21px}.scene p{font-size:16px;white-space:pre-line}.scenehead{display:flex;justify-content:space-between;gap:8px;align-items:start}.choice{display:block;width:100%;text-align:left;margin:7px 0;padding:13px;background:#16233a}.choice b{display:block}.choice span{display:block;font-size:12px;color:#aebbd0;margin-top:3px}.after{border-color:#36547e;background:#101f35}.after h3{margin-top:0}.consequence{border-left:3px solid #60a5fa;padding-left:9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #243149}.npc,.shopitem,.faction{border:1px solid var(--line);border-radius:11px;padding:10px;background:#101a2b;margin:7px 0}.log{display:flex;flex-direction:column;gap:7px}.logitem{padding:8px 10px;background:#101a2b;border-left:3px solid #3b82f6;border-radius:0 9px 9px 0}.combat{border-color:#815117;background:linear-gradient(180deg,#251c11,#111a2b)}.combatgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.combat-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tech{border-color:#41638e;background:#172942}.field{margin:9px 0}.field label{display:block;font-size:12px;color:#aebbd0;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:#0b1425;color:var(--txt)}.modal{position:fixed;inset:0;z-index:100;background:#020617e8;overflow:auto;padding:15px}.modal .card{max-width:680px;margin:25px auto}.menu{min-height:100vh;display:flex;align-items:center}.menu .card{width:100%;padding:20px}.menu h1{font-size:31px;margin:0}.feature{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.feature div{padding:10px;border:1px solid var(--line);border-radius:10px;background:#101a2b}.notice{padding:10px;border:1px solid var(--line);border-radius:10px;background:#0f1a2c}.footer{display:fl </style></head><body><div id="root"></div><div id="modal" class="modal" style="display:none"></div><script>
'use strict';
const VERSION='18.0.1',KEY='MHA_ROAD_V18_SAVE';
const $=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],rnd=n=>Math.floor(Math.random()*n),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const STAT={force:'Force',vitesse:'Vitesse',defense:'Défense',intelligence:'Intelligence',endurance:'Endurance',controle:'Contrôle',courage:'Courage'};
let S=null,scene=null,combat=null,activeTab='story',shopOpen=false;

/* ========================= ALTER ENGINE ========================= */
const ALTER_MATERIALS={
energie:['chaleur','froid','électricité','lumière','son','vent','pression','vibration','fréquence','rayonnement'],
matiere:['métal','verre','cristal','sable','poussière','liquide','fibres','encre','cendre','résine'],
force:['impulsion','inertie','friction','accélération','impact','traction','répulsion','compression','gravité','élan'],
espace:['distance','position','densité','volume','orientation','ancrage','pliage','déplacement'],
corps:['durcissement','élasticité','régénération','métabolisme','adaptation','mutation','division','déformation'],
sens:['perception','mémoire sensorielle','écho','résonance','détection','illusion','attention','orientation'],
vivant:['plantes','toxines','enzymes','spores','champignons','cellules','sang','micro-organismes'],
ome:['ombre','silhouette','reflet','obscurité','camouflage','absence de lumière'],
creation:['construction','matérialisation','assemblage','modelage','copie','impression'],
absorption:['absorption','stockage','conversion','transfert','accumulation','réserve'],
probabilite:['chance','coïncidence','risque','déviation'],
temps:['retard','accélération locale','répétition','persistance']};
const ALTER_FORMS=['contact','regard','voix','souffle','mouvement','peau','sang','projection','champ autour du corps','objet marqué'];
const ALTER_LIMITS=['demande beaucoup d’énergie','fonctionne mieux sous stress','nécessite un contact','perd en précision à distance','provoque des douleurs','demande une préparation','dépend d’un environnement précis','a un effet retardé','ne peut agir que sur une cible à la fois','devient instable lorsqu’il est utilisé trop longtemps'];
const ALTER_COSTS=['fatigue musculaire','migraine','vertiges','déshydratation','surchauffe','douleurs articulaires','surcharge sensorielle','tremblements','perte momentanée de précision','faim intense'];
const ALTER_RULES=['l’effet doit être initié consciemment','l’effet se renforce avec l’élan','l’effet devient plus précis lorsque le joueur ralentit','plus la cible est éloignée, plus le coût augmente','les effets peuvent être stockés brièvement','l’utilisateur doit comprendre la cible pour agir sur elle','la puissance augmente lorsque plusieurs conditions sont réunies'];
const ALTER_NAMES=['Rémanence','Sillage','Point Mort','Ligne de Fuite','Seuil','Éclipse','Prisme','Décalage','Noyau','Miroir','Impulsion','Marée','Filigrane','Résonance','Ancrage','Traverse','Cicatrice','Écho','Friction','Halo','Faille','Cendre','Vertige','Pli'];
function makeAlter(seed){let cats=Object.keys(ALTER_MATERIALS),cat=seed?.category||pick(cats),root=seed?.root||pick(ALTER_MATERIALS[cat]);let q={id:'alter_'+Date.now()+rnd(999999),name:seed?.name||pick(ALTER_NAMES),category:cat,root,form:pick(ALTER_FORMS),rule:pick(ALTER_RULES),limit:pick(ALTER_LIMITS),cost:pick(ALTER_COSTS),range:pick(['corps','contact','courte distance','moyenne distance','zone']),traits:[],mastery:0,xp:0,discoveries:[],techniques:[],potential:pick(['mobilité','attaque','défense','contrôle','soutien','polyvalence']),description:'',hiddenRule:pick(ALTER_RULES)};q.traits=[q.potential,pick(['effet direct','effet progressif','effet cumulatif','effet conditionnel','effet de zone'])];q.description=`Ton Alter agit sur ${root}. Il se manifeste principalement par ${q.form}. ${q.rule.charAt(0).toUpperCase()+q.rule.slice(1)}, mais ${q.limit}.`;return q}
function discoverAlter(kind='normal'){if(S.alter)return null;if(kind==='none'){S.alter={id:'none',name:'Sans Alter',category:'none',root:null,form:null,rule:'aucune capacité innée',limit:'doit compter sur ses propres moyens',cost:null,range:null,traits:['adaptation','équipement','stratégie'],mastery:0,xp:0,discoveries:[],techniques:[],potential:'humain',description:'Tu n’as pas d’Alter. Ton parcours devra se construire autrement.'};remember('Tu découvres que tu es sans Alter.',5);timeline('Découverte','Tu es officiellement sans Alter. Ce n’est pas une fin : c’est une autre trajectoire.','alter');return 'Le verdict tombe : tu es sans Alter. Il n’y aura pas de pouvoir caché qui surgira plus tard. Il faudra construire ta propre voie.'}S.alter=makeAlter();S.quirk=S.alter;remember(`Ton Alter se manifeste : ${S.alter.name}.`,5);timeline('Alter découvert',S.alter.description,'alter');return `Quelque chose se met enfin en place. Ton Alter porte le nom de ${S.alter.name}. Tu comprends son principe général, mais presque tout reste à découvrir.`}
function generateTechnique(intent='unknown'){if(!S.alter||S.alter.id==='none')return null;let q=S.alter,actions={attaque:['frapper','projeter','concentrer','rompre','dévier'],defense:['ancrer','absorber','détourner','figer','amortir'],mobilite:['glisser','bondir','tirer','échanger','alléger'],controle:['marquer','lier','ralentir','déplacer','isoler'],soutien:['transmettre','stabiliser','amplifier','partager','préparer']};let key=intent==='unknown'?pick(Object.keys(actions)):intent,verb=pick(actions[key]),style=pick(['brutalement','avec précision','par étapes','à retardement','en mouvement','à très courte distance','en utilisant l’environnement']);let t={id:'tech_'+Date.now()+rnd(999999),name:`${pick(['Débordement','Sillage','Seuil','Rupture','Fil','Point','Marque','Voile','Chute','Traverse'])} ${pick(['direct','inverse','mobile','ciblé','continu','brisé','silencieux','concentré'])}`,intent:key,cost:8+rnd(14),power:1+Math.random()*.8,uses:0,description:`Tu ${verb} ${q.root} ${style}. Cette capacité découle directement de la règle de ton Alter.`,origin:'expérimentation'};q.techniques.push(t);q.discoveries.push({day:S.day,text:t.description,name:t.name});q.xp+=4;q.mastery++;remember(`Tu découvres ${t.name} : ${t.description}`,3);return t}
function experiment(intent){if(!S.alter)return 'Ton Alter n’est pas encore connu.';if(S.alter.id==='none'){S.stats[ intent==='mobilite'?'vitesse':intent==='attaque'?'force':'intelligence']++;S.money+=intent==='soutien'?20:0;remember(`Tu développes une nouvelle approche sans Alter : ${intent}.`,2);return `Tu travailles ton ${intent} sans pouvoir compter sur un Alter. Ce travail commence à devenir une véritable spécialité.`}if(S.energy<8)return 'Tu es trop épuisé pour mener une expérimentation sérieuse.';S.energy-=8;let t=generateTechnique(intent);if(Math.random()<.2){S.hp=clamp(S.hp-3-rnd(8),1,S.maxHp);return `L’expérience tourne court. Tu n’obtiens pas immédiatement une capacité, mais tu comprends mieux la limite : ${S.alter.limit}.`}return `L’expérimentation fonctionne. Tu découvres ${t.name}. ${t.description}`}
function alterLab(){let opts=[['Chercher une application offensive','Tu cherches ce que ton Alter peut faire lorsqu’il faut imposer ta volonté.','attaque'],['Chercher une application défensive','Tu cherches comment survivre à une attaque ou protéger quelqu’un.','defense'],['Chercher une application de mouvement','Tu veux faire de ton Alter un outil de déplacement.','mobilite'],['Chercher à contrôler plutôt qu’à frapper','Tu expérimentes une utilisation plus subtile.','controle'],['Essayer quelque chose d’inattendu','Tu suis une intuition sans savoir où elle mènera.','soutien']];return {type:'Alter',title:'🧪 Laboratoire improvisé',text:S.alter.id==='none'?'Sans Alter, ton expérimentation consiste à trouver ce que tu peux développer par toi-même.':`Tu connais le principe de ${S.alter.name}, pas toutes ses possibilités. Une expérimentation pourrait révéler une propriété que personne ne t’a enseignée.`,choices:opts.map(o=>[o[0],o[1],()=>experiment(o[2])])}}

/* ========================= WORLD / NPC / FACTIONS ========================= */
const FIRST=['Yuto','Mina','Ren','Aiko','Sora','Kenji','Hana','Daichi','Noa','Riku','Mei','Kaito','Aya','Haru','Nana','Toma','Kenta','Emi','Rei','Koki','Mio','Jun','Rina','Akira','Fumi','Nao'];
const LAST=['Sato','Kobayashi','Mori','Tanaka','Aoki','Nakamura','Ishida','Fujita','Kato','Sakai','Yamada','Okada'];
const PERSONALITIES=['réservé','franc','ambitieux','protecteur','provocateur','curieux','studieux','sociable','méfiant','rêveur','compétitif','calme'];
const GOALS=['progresser sans attirer l’attention','devenir héros','protéger un proche','comprendre son Alter','quitter la ville','être reconnu','prouver quelque chose à sa famille','trouver des amis','devenir indispensable','cacher une faiblesse'];
const FACTIONS={hero:{name:'Agences héroïques',desc:'Protection, secours et formation héroïque.',kind:'hero'},school:{name:'Institutions de formation',desc:'Écoles, professeurs et réseaux éducatifs.',kind:'hero'},support:{name:'Support & technologie',desc:'Ingénieurs, ateliers et spécialistes du matériel.',kind:'neutral'},civil:{name:'Réseau civil',desc:'Commerçants, associations et citoyens organisés.',kind:'neutral'},vigilante:{name:'Justiciers indépendants',desc:'Ceux qui pensent devoir agir sans attendre les institutions.',kind:'grey'},under:{name:'Marché clandestin',desc:'Informations, objets et services hors du cadre légal.',kind:'villain'},villain:{name:'Réseaux criminels',desc:'Groupes qui utilisent les Alters à des fins criminelles.',kind:'villain'},ofa:{name:'Héritiers de One For All',desc:'Une voie rarissime centrée sur la transmission et la maîtrise.',kind:'special'},afo:{name:'Réseau d’All For One',desc:'Un réseau secret autour du vol, du transfert et de la combinaison d’Alters.',kind:'special'}};
function npcAlter(){let r=Math.random();if(r<.07)return discoverNPCAlter('none');return discoverNPCAlter('alter')}
function discoverNPCAlter(kind){if(kind==='none')return {type:'none',name:'Sans Alter',rule:'aucune capacité innée',potential:'humain'};let q=makeAlter();q.mastery=rnd(4);q.xp=rnd(12);return {type:'alter',name:q.name,root:q.root,category:q.category,rule:q.rule,limit:q.limit,potential:q.potential,mastery:q.mastery,xp:q.xp}}
function generateNPCs(){let used=new Set();for(let i=0;i<18;i++){let name;do{name=pick(FIRST)+' '+pick(LAST)}while(used.has(name));used.add(name);let n={id:'npc_'+i,name,age:13+rnd(3),class:`${pick(['4e','3e'])} ${pick(['A','B','C','D'])}`,personality:pick(PERSONALITIES),goal:pick(GOALS),fear:pick(['échouer','être abandonné','perdre le contrôle','décevoir sa famille','être ignoré','blesser quelqu’un']),secret:pick(['aucun pour l’instant','cache ses difficultés scolaires','s’est disputé avec un proche','a peur de son propre Alter','cherche quelque chose en secret','a déjà menti sur ses capacités']),alter:npcAlter(),relation:0,trust:0,respect:0,affinity:pick(['hero','school','civil','support','vigilante','under','villain']),active:i<12,arc:pick(['amitié','rivalité','secret','entraide','ambition','indépendance']),mood:'neutre',lastAction:0};S.npcs.push(n)}}
function affinity(f,v){if(!S.factions[f])S.factions[f]=0;S.factions[f]=clamp(S.factions[f]+v,-20,20);updateFactionStatus()}
function updateFactionStatus(){let entries=Object.entries(S.factions).filter(([k])=>k!=='ofa'&&k!=='afo').sort((a,b)=>b[1]-a[1]);if(entries[0]&&entries[0][1]>=7)S.factionStatus=entries[0][0];else S.factionStatus='undecided'}
function factionText(){let e=Object.entries(S.factions).sort((a,b)=>b[1]-a[1]).slice(0,3);return e.map(([k,v])=>`${FACTIONS[k].name} : ${v}`).join(' • ')}
function worldTick(){S.npcs.forEach(n=>{if(Math.random()<.3)n.mood=pick(['calme','stressé','motivé','distant','curieux']);if(Math.random()<.18)n.goal=pick(GOALS);if(Math.random()<.12)n.relation=clamp(n.relation+pick([-2,-1,1,2]),-20,20);n.lastAction=S.day});if(Math.random()<.3){let n=pick(S.npcs);S.worldNews.unshift(`${n.name} semble évoluer de son côté : ${n.goal}.`);S.worldNews=S.worldNews.slice(0,10)}}

/* ========================= EVENT / CHOICE ENGINE ========================= */
const PLACES=['le couloir','la cour','la salle de classe','la bibliothèque','la sortie du collège','un petit commerce','le gymnase','un arrêt de bus','une rue calme près du collège'];
const TENSIONS=['une rumeur circule','quelqu’un a besoin d’aide','un conflit commence','un adulte demande de l’aide','un camarade cache quelque chose','un objet disparaît','une occasion inattendue se présente','une erreur attire l’attention','un groupe se dispute','quelqu’un observe discrètement la scène'];
const SOCIAL=['un camarade avec qui tu t’entends bien','quelqu’un avec qui la relation est compliquée','un élève que tu connais à peine','un petit groupe d’élèves','un adulte du collège','une personne inconnue'];
const ATMOS=['personne ne semble savoir quoi faire','tout le monde fait semblant de ne rien voir','la tension monte rapidement','la situation pourrait encore être désamorcée','quelque chose paraît inhabituel','le moment semble anodin, mais un détail te gêne'];
function chooseNPC(){let candidates=S.npcs.filter(n=>n.active);if(S.lastNPC){let alt=candidates.filter(n=>n.id!==S.lastNPC);if(alt.length)candidates=alt}let n=pick(candidates.length?candidates:S.npcs);S.lastNPC=n.id;return n}
function eventContext(type){let n=chooseNPC();let faction=Object.entries(S.factions).sort((a,b)=>b[1]-a[1])[0];return {npc:n,place:pick(PLACES),tension:pick(TENSIONS),social:pick(SOCIAL),atmos:pick(ATMOS),faction:faction&&faction[1]>3?faction[0]:null,season:['printemps','été','automne','hiver'][(S.season-1)%4],recent:S.eventHistory.slice(-3).map(x=>x.title),memory:pick(S.memories.slice(-5).map(x=>x.text)||['rien'])}}
function signature(ctx,type){return `${type}|${ctx.tension}|${ctx.place}|${ctx.npc.arc}|${ctx.npc.personality}`}
function generateChoices(ctx,type){let choices=[];let n=ctx.npc;let add=(title,desc,fn)=>choices.push([title,desc,fn]);if(type==='school'){add('Intervenir calmement','Tu cherches d’abord à comprendre avant de prendre parti.',()=>{S.stats.intelligence++;S.stats.courage++;n.trust++;affinity('school',2);return `Tu prends le temps d’écouter. ${n.name} se détend légèrement et te donne une information qu’il n’aurait probablement pas donnée à quelqu’un d’autre.`});add('Prendre le parti de quelqu’un','Tu acceptes le risque de te faire remarquer.',()=>{n.relation++;S.rep++;affinity('hero',2);return `${n.name} se souviendra que tu as pris position. D’autres élèves, eux, ont surtout retenu que tu n’as pas hésité.`});add('Rester en retrait','Tu observes et tu gardes tes informations pour toi.',()=>{S.stats.intelligence++;affinity('civil',1);remember(`Tu as préféré observer lors d’un conflit impliquant ${n.name}.`,2);return `Tu ne règles rien directement, mais tu comprends mieux les rapports de force autour de toi.`});if(n.personality==='provocateur')add('Le confronter directement','Tu refuses de laisser la situation s’envenimer.',()=>{S.courage++;n.respect+=2;affinity('vigilante',2);return `La confrontation est tendue. ${n.name} ne s’attendait pas à ce que tu lui répondes aussi franchement.`})}
else if(type==='social'){add('Lui demander ce qui ne va pas','Tu privilégies la confiance.',()=>{n.trust+=2;n.relation+=2;affinity('civil',1);return `${n.name} hésite, puis accepte de parler. Ce n’est pas une résolution, mais une porte vient de s’ouvrir.`});add('Proposer ton aide','Tu prends le risque de t’impliquer.',()=>{n.trust++;S.courage++;affinity('hero',1);return `Tu proposes ton aide sans savoir si elle sera acceptée. ${n.name} semble sincèrement surpris.`});add('Ne pas insister','Tu respectes son silence.',()=>{n.relation++;return `Tu n’insistes pas. ${n.name} ne te remercie pas, mais ton respect de ses limites ne passe pas inaperçu.`})}
else if(type==='special'){add('Écouter jusqu’au bout','Tu veux comprendre pourquoi cette personne te contacte.',()=>specialChoice('listen'));add('Refuser immédiatement','Tu refuses de t’impliquer dans quelque chose qui te dépasse.',()=>specialChoice('refuse'));add('Demander ce que cela implique','Tu veux connaître le prix avant de décider.',()=>specialChoice('question'))}
else if(type==='faction'){add('Accepter la discussion','Tu veux comprendre qui te contacte.',()=>{if(ctx.faction)affinity(ctx.faction,3);return `La discussion ne constitue pas encore une alliance. Mais quelqu’un, quelque part, vient de te considérer comme intéressant.`});add('Poser tes conditions','Tu refuses de te laisser recruter facilement.',()=>{S.stats.courage++;if(ctx.faction)affinity(ctx.faction,2);return `Tu poses tes limites. L’interlocuteur n’apprécie pas forcément, mais il comprend que tu n’es pas facilement manipulable.`});add('Refuser','Tu préfères garder tes distances.',()=>{if(ctx.faction)affinity(ctx.faction,-1);affinity('civil',1);return `Tu refuses. La porte se referme, mais refuser une première proposition peut avoir autant de conséquences que l’accepter.`})}
else if(type==='alter'){add('Expérimenter maintenant','Tu profites de la situation pour tester ton Alter.',()=>experiment(pick(['attaque','defense','mobilite','controle','soutien'])));add('Observer avant d’agir','Tu cherches d’abord à comprendre le phénomène.',()=>{S.stats.intelligence++;S.alter.xp+=2;return `Tu n’obtiens pas de nouvelle capacité, mais tu comprends un peu mieux la règle : ${S.alter.rule}.`});add('Repousser la limite','Tu acceptes volontairement un risque.',()=>{S.energy=Math.max(0,S.energy-15);if(Math.random()<.5){let t=generateTechnique(pick(['attaque','defense','mobilite','controle']));return `Le risque paie : ${t.name} apparaît. ${t.description}`}S.hp=clamp(S.hp-8,1,S.maxHp);return `Tu échoues et le contrecoup te laisse une douleur persistante. Tu comprends au moins que ton Alter a une limite plus stricte que prévu.`})}
else if(type==='world'){add('Aider immédiatement','Tu privilégies l’urgence.',()=>{S.rep++;affinity('hero',2);S.money+=15;return 'Tu aides sans attendre de savoir si quelqu’un te récompensera. Une personne présente note pourtant ton geste.'});add('Chercher la cause','Tu veux comprendre avant d’agir.',()=>{S.stats.intelligence++;affinity('support',2);return 'Tu remontes la chaîne des événements et découvres un détail qui change ton interprétation de la situation.'});add('Appeler quelqu’un','Tu préfères ne pas gérer seul.',()=>{affinity('school',1);return 'Tu demandes de l’aide. La situation est moins spectaculaire, mais beaucoup plus sûre.'})}
else {add('Acheter ce dont tu as besoin','Une boutique ou un vendeur peut t’équiper.',()=>{openShop();return 'Tu prends le temps de regarder ce qui pourrait réellement t’être utile.'});add('Passer ton chemin','Tu économises ton argent.',()=>{S.money+=5;return 'Tu ne dépenses rien. Ce n’est peut-être pas important aujourd’hui, mais ton argent pourra compter plus tard.'});add('Discuter avec le vendeur','Tu cherches à obtenir une information plutôt qu’un objet.',()=>{S.stats.intelligence++;return 'Le vendeur te parle de matériel et de personnes qui viennent régulièrement ici. Une petite information pourrait resservir.'})}
return choices}
function specialChoice(action){
 if(S.pendingSpecial==='ofa'&&!S.specialPath&&action==='listen')return acquireSpecial('ofa');
 if(S.pendingSpecial==='afo'&&!S.specialPath&&action==='listen')return acquireSpecial('afo');
 if(S.specialPath==='ofa'){
  if(action==='listen'){S.factions.ofa+=4;return 'La personne te parle d’un pouvoir transmis de génération en génération. Elle ne te demande pas de devenir quelqu’un d’autre : elle te prévient simplement que si tu acceptes, la façon dont tu l’utiliseras dépendra entièrement de toi.'}
  if(action==='question'){S.factions.ofa+=2;return 'Tu poses des questions sur la transmission, le contrôle et les conséquences. On te répond qu’aucune technique n’est imposée : la puissance devra devenir la tienne.'}
  S.factions.ofa-=2;return 'Tu refuses. La possibilité ne disparaît pas forcément, mais quelqu’un d’autre devra peut-être porter cette responsabilité.'
 }
 if(S.specialPath==='afo'){
  if(action==='listen'){S.factions.afo+=4;return 'On te révèle l’existence d’un pouvoir capable de voler, stocker et transmettre des Alters. On ne te propose pas de devenir un simple exécutant : on cherche à savoir ce que tu ferais avec un tel pouvoir.'}
  if(action==='question'){S.factions.afo+=2;return 'Tu demandes jusqu’où ce pouvoir peut aller. La réponse est volontairement incomplète : voler un Alter ne signifie pas automatiquement savoir le maîtriser.'}
  S.factions.afo-=2;return 'Tu refuses la proposition. Pour l’instant, personne ne sait si cette décision te protège ou te met une cible dans le dos.'
 }
 if(action==='listen')return 'Tu écoutes sans encore savoir qui est réellement derrière cette proposition.';
 if(action==='question')return 'Tu demandes des précisions. L’interlocuteur comprend que tu ne prendras pas une décision aveugle.';
 return 'Tu refuses de t’engager. La rencontre s’arrête, mais elle pourra laisser une trace.';
}
function acquireSpecial(path){
 S.specialPath=path;
 if(path==='ofa'){
  S.alter={id:'ofa',name:'One For All',category:'hérité',root:'accumulation de puissance',form:'transmission et maîtrise corporelle',rule:'la puissance s’adapte à la manière dont tu l’entraînes',limit:'ton corps doit progressivement apprendre à supporter la puissance',cost:'surcharge musculaire',range:'corps',traits:['puissance','mobilité','héritage'],mastery:0,xp:0,discoveries:[],techniques:[],potential:'façonnage personnel',description:'One For All est un pouvoir transmis. Il ne t’impose pas les techniques d’un précédent porteur : ses expressions dépendront de ton entraînement, de tes choix et de ta manière de combattre.'};S.quirk=S.alter;S.factions.ofa+=5;remember('Tu reçois One For All. Sa forme future dépendra de ta manière de le façonner.',7);timeline('One For All','Un pouvoir transmis entre tes mains. Tu devras lui donner ta propre forme.','alter');return 'Le pouvoir entre en toi. Il est immense, mais il ne vient pas avec un manuel. Tu devras apprendre à en faire quelque chose qui te ressemble.';
 }
 S.alter={id:'afo',name:'All For One',category:'vol',root:'vol et stockage d’Alters',form:'contact',rule:'un Alter volé doit être compris et maîtrisé pour être réellement utile',limit:'le stockage et les combinaisons imposent une charge croissante',cost:'surcharge mentale et corporelle',range:'contact',traits:['vol','stockage','combinaison'],mastery:0,xp:0,discoveries:[],techniques:[],potential:'collection et synergie',description:'All For One permet de voler, stocker et combiner des Alters. La puissance brute ne suffit pas : chaque pouvoir récupéré crée de nouvelles possibilités et de nouvelles contraintes.'};S.quirk=S.alter;S.factions.afo+=5;S.stolenAlters=[];remember('Tu acquiers All For One. La manière dont tu l’utiliseras déterminera ce que tu deviendras.',7);timeline('All For One','Un pouvoir capable de voler et stocker des Alters devient le centre de ta progression.','alter');return 'Tu comprends que ton pouvoir ne consiste pas à apprendre une seule technique. Il peut devenir une collection entière — à condition d’accepter ce que cela implique.';
}
function stealAlterFromNPC(){if(S.specialPath!=='afo'||!S.npcs.length)return 'Tu n’as pas encore All For One.';let n=pick(S.npcs.filter(x=>x.alter?.type==='alter'));if(!n)return 'Aucun Alter compatible n’est actuellement accessible.';if(S.energy<20)return 'Tu n’as pas assez d’énergie pour tenter une opération aussi exigeante.';S.energy-=20;let stolen={name:n.alter.name,root:n.alter.root,category:n.alter.category,rule:n.alter.rule,limit:n.alter.limit,mastery:0};S.stolenAlters.push(stolen);S.alter.discoveries.push({day:S.day,name:stolen.name,text:'Alter volé et stocké.'});S.alter.xp+=8;remember(`Tu voles l’Alter ${stolen.name} à ${n.name}.`,7);return `L’Alter de ${n.name} rejoint ton stock. Tu ne le maîtrises pas encore : All For One te donne l’accès, pas automatiquement la maîtrise.`}
function makeEvent(type){type=type||weightedType();let ctx=eventContext(type),n=ctx.npc;let title,text;if(type==='school'){title=pick(['Une histoire qui circule','Entre deux cours','Quelqu’un a besoin de toi','Une tension dans la classe','Après la sonnerie','Un détail que personne ne remarque']);text=`Au ${ctx.place}, ${ctx.tension}. ${ctx.atmos}. ${ctx.social} se retrouve au centre de la situation. ${n.name} te remarque avant que tu aies décidé si tu veux t’en mêler.`}else if(type==='social'){title=pick(['Une conversation étrange','Un message inattendu','Quelques minutes à l’écart','Une confidence','Un silence inhabituel']);text=`${n.name} vient vers toi dans ${ctx.place}. Son attitude ne ressemble pas à d’habitude. ${ctx.atmos}. Quand tu lui demandes ce qui se passe, il détourne d’abord la conversation.`}else if(type==='special'){let path=S.specialPath||pick(['ofa','afo']);if(!S.specialPath)S.pendingSpecial=path;title=path==='ofa'?'Une proposition impossible à ignorer':'Une personne connaît ton potentiel';text=path==='ofa'?'Quelqu’un te parle d’un pouvoir qui ne devrait pas être transmis à n’importe qui. Il ne prononce pas encore son nom.':'Une personne semble connaître ton Alter, ou l’absence d’Alter, mieux que toi. Elle te propose une rencontre dont les conséquences pourraient dépasser ta vie actuelle.'}else if(type==='faction'){let f=ctx.faction||pick(['hero','support','vigilante','under']);title=pick(['Une proposition discrète','Quelqu’un te cherche','Une porte entrouverte','Une rencontre qui compte']);text=`Tu ne connais pas encore les intentions de la personne en face de toi. Elle semble pourtant connaître certains de tes choix récents. Le groupe qu’elle représente — ${FACTIONS[f].name} — ne te propose pas encore de rejoindre ses rangs. Il veut d’abord voir ce que tu vas répondre.`}else if(type==='alter'){title=pick(['Une propriété inattendue','Ton Alter réagit','Une idée dangereuse','Une limite à comprendre','Un usage auquel tu n’avais pas pensé']);text=`Tu pensais avoir compris ${S.alter.name}. Un détail remet cette certitude en question. ${ctx.atmos}. Tu pourrais essayer quelque chose maintenant, mais personne ne peut te garantir le résultat.`}else if(type==='world'){title=pick(['Quelque chose se passe ailleurs','Une nouvelle circule','Un incident en ville','Un détail inquiétant']);text=`La nouvelle ne te concerne pas directement : ${pick(['un incident a eu lieu dans un quartier voisin','un héros local cherche des informations','une boutique spécialisée reçoit une livraison inhabituelle','un groupe de jeunes parle d’un événement récent'])}. Pourtant, ${ctx.atmos}.`}
else{title=pick(['Une boutique sur ton chemin','Une vitrine intéressante','Le vendeur se souvient de toi','Une occasion à saisir']);text=`Tu passes devant un commerce où plusieurs équipements pourraient t’être utiles. ${ctx.atmos}. Le vendeur reconnaît certains besoins avant même que tu les expliques.`}
return {id:'scene_'+Date.now()+rnd(99999),signature:signature(ctx,type),type,title,text,ctx,choices:generateChoices(ctx,type)}}
function weightedType(){let weights={school:35,social:20,world:12,shop:9,faction:8,alter:S.alter?13:0,special:S.day>=10?3:0};let total=Object.values(weights).reduce((a,b)=>a+b,0),r=Math.random()*total;for(let [k,v] of Object.entries(weights)){r-=v;if(r<=0)return k}return 'school'}
function nextScene(){if(S.afterAction||combat||S.seasonSummary?.pending)return;if(!S.alter&&S.action>=2&&Math.random()<.2){scene={type:'alter',title:'🧬 Quelque chose change',text:'Un phénomène inhabituel se produit. Tu ne sais pas encore s’il s’agit d’un Alter ou d’autre chose.',choices:[['Chercher à comprendre','Tu observes et testes prudemment.',()=>discoverAlter()],['Demander un examen','Tu préfères obtenir un avis extérieur.',()=>discoverAlter()],['Refuser de tirer une conclusion','Tu continues ta journée.',()=>{remember('Tu as remarqué un phénomène inhabituel sans chercher à le nommer.',1);return 'Tu laisses le phénomène derrière toi. Pour l’instant.'}],['Vérifier si tu es sans Alter','Tu veux une réponse définitive.',()=>discoverAlter(Math.random()<.12?'none':'normal')]]};render();return}if(S.alter&&Math.random()<.18){scene=alterLab();render();return}S.action++;S.day++;S.energy=clamp(S.energy+7,0,S.maxEnergy);worldTick();scene=makeEvent();S.eventHistory.push({signature:scene.signature,title:scene.title,type:scene.type,day:S.day});S.eventHistory=S.eventHistory.slice(-120);save();render()}
function choose(i){if(!scene)return;let c=scene.choices[i];if(!c)return;let before={hp:S.hp,energy:S.energy,money:S.money};let result;try{result=c[2]()}catch(e){console.error(e);result='Quelque chose ne s’est pas déroulé comme prévu.'}let effects=[];for(let k of ['hp','energy','money'])if(S[k]!==before[k])effects.push(`${S[k]-before[k]>0?'+':''}${S[k]-before[k]} ${k==='hp'?'PV':k==='energy'?'énergie':'¥'}`);remember(`Choix : ${scene.title} → ${c[0]}`,2);timeline(scene.title,result||'Ton choix a modifié la situation.','choix');S.afterAction={title:scene.title,text:result||'Ton choix a modifié la situation.',effects};scene=null;S.hp=clamp(S.hp,1,S.maxHp);S.energy=clamp(S.energy,0,S.maxEnergy);if(S.action>=7){endSeason();return}save();render()}

function startCombat(name='Adversaire'){let aq=makeAlter(),none=Math.random()<.08;if(none)aq={id:'none',name:'Sans Alter',root:null,category:'none',rule:'aucune capacité innée',limit:'aucune',cost:null,range:null,traits:['combat'],mastery:1,xp:0,techniques:[],description:'Aucune capacité innée.'};combat={enemy:{name,hp:70+rnd(45),maxHp:0,alter:aq,analyzed:0,guard:false},turn:1,log:['Le combat commence.'],ended:false};combat.enemy.maxHp=combat.enemy.hp;scene=null;render()}
function enemyTurn(){let e=combat.enemy,d=Math.max(2,Math.round(7+rnd(8)-(effective('defense')*.18)));if(e.guard){d=Math.round(d*.45);e.guard=false}S.hp=clamp(S.hp-d,0,S.maxHp);combat.log.unshift(`${e.name} te touche et inflige ${d} dégâts.`);combat.turn++;if(S.hp<=0){combat.ended=true;S.hp=Math.max(1,Math.round(S.maxHp*.25));S.injury=2;combat.log.unshift('Tu es mis hors de combat.')}}
function combatAction(type,index){if(!combat||combat.ended)return;let e=combat.enemy;if(type==='flee'){if(Math.random()<.55){combat.ended=true;combat.log.unshift('Tu parviens à rompre le combat.')}else{combat.log.unshift('Impossible de fuir maintenant.');enemyTurn()}return save(),render()}if(type==='analyze'){e.analyzed++;combat.log.unshift(e.analyzed>=2?`Alter révélé : ${e.alter.name}.`:'Tu observes sa posture et son Alter.');if(e.analyzed>=2)remember(`Alter adverse découvert : ${e.alter.name}.`,3);enemyTurn();return save(),render()}if(type==='guard'){e.guard=true;combat.log.unshift('Tu te mets en garde.');enemyTurn();return save(),render()}if(type==='attack'){let d=Math.max(4,Math.round(5+effective('force')*.55+rnd(5)));e.hp-=d;combat.log.unshift(`Ton attaque inflige ${d} dégâts.`);if(e.hp<=0)return winCombat(),render();enemyTurn();return save(),render()}if(type==='tech'&&S.alter&&S.alter.id!=='none'){let t=S.alter.techniques[index];if(!t||S.energy<t.cost)return;S.energy-=t.cost;t.uses++;let stat=t.intent==='attaque'?'force':t.intent==='defense'?'defense':t.intent==='mobilite'?'vitesse':'controle';let d=Math.max(4,Math.round(effective(stat)*.5*t.power));if(t.intent==='defense'){e.guard=true;combat.log.unshift(`${t.name} te protège et modifie ton positionnement.`)}else{e.hp-=Math.round(d*(t.intent==='soutien'?.65:1));combat.log.unshift(`${t.name} fonctionne : ${Math.round(d*(t.intent==='soutien'?.65:1))} dégâts.`)}S.alter.xp+=2;if(e.hp<=0)return winCombat(),render();enemyTurn();return save(),render()}}
function winCombat(){combat.ended=true;combat.log.unshift(`Victoire contre ${combat.enemy.name}.`);if(S.alter&&S.alter.id!=='none')S.alter.xp+=7;S.hp=clamp(S.hp+Math.round(S.maxHp*.2),1,S.maxHp);S.energy=clamp(S.energy+20,0,S.maxEnergy);timeline('Combat',`Tu remportes le combat contre ${combat.enemy.name}.`,'combat')}

const EQUIPMENT=[['head','Tête','Casquette renforcée',650,{defense:1,vitesse:1},'Discrète et légère.'],['head','Tête','Casque léger',1800,{defense:3},'Protection correcte, légèrement encombrante.'],['head','Tête','Visière tactique',4200,{intelligence:2,controle:2},'Analyse rapide et lecture de trajectoires.'],['torso','Torse','Veste matelassée',1200,{defense:3,endurance:1},'Protection quotidienne.'],['torso','Torse','Gilet renforcé',3600,{defense:5,vitesse:-1},'Solide mais lourd.'],['torso','Torse','Gilet d’intervention',7800,{defense:3,endurance:2,courage:1},'Pensé pour les situations dangereuses.'],['arms','Bras','Gants d’entraînement',800,{force:2,controle:1},'Pour travailler les mouvements.'],['arms','Bras','Gantelets renforcés',3100,{force:4,controle:1},'Favorisent les frappes.'],['arms','Bras','Brassards de précision',5200,{controle:4,intelligence:1},'Pour les Alters fins.'],['legs','Jambes','Chaussures de course',1000,{vitesse:2,endurance:1},'Légères.'],['legs','Jambes','Chaussures renforcées',2900,{vitesse:3,defense:1},'Résistent mieux aux chocs.'],['legs','Jambes','Bottes d’intervention',6500,{vitesse:2,endurance:3,defense:1},'Pour les longues interventions.'],['support','Support','Bracelet d’assistance',2500,{intelligence:2,controle:1},'Petit outil polyvalent.'],['support','Support','Analyseur portable',5600,{intelligence:4,controle:2},'Analyse les comportements et les Alters.'],['support','Support','Module de soutien',9500,{controle:3,endurance:2,force:1},'Équipement avancé.'],['support','Support','Kit de premiers secours',1800,{endurance:2,courage:1},'Améliore la récupération après incident.'],['support','Support','Lampe à spectre variable',3200,{intelligence:2,controle:1},'Utile dans certaines situations.'],['arms','Bras','Gants isolants',2700,{defense:2,controle:2},'Spécialisés pour les manipulations délicates.']];
function buy(id){let it=EQUIPMENT.find(x=>x[2]===id);if(!it||S.money<it[3])return;if(S.equipment[it[0]]===id||S.inventory.includes(id))return;S.money-=it[3];S.inventory.push(id);timeline('Achat',`Tu achètes ${id} pour ${it[3]} ¥.`,'équipement');save();render()}
function equip(id){let it=EQUIPMENT.find(x=>x[2]===id);if(!it||!S.inventory.includes(id)||S.equipment[it[0]])return;S.equipment[it[0]]=id;S.inventory=S.inventory.filter(x=>x!==id);timeline('Équipement',`Tu équipes ${id}.`,'équipement');save();render()}
function unequip(slot){if(S.equipment[slot]){S.inventory.push(S.equipment[slot]);S.equipment[slot]=null;save();render()}}
function effective(k){let v=S.stats[k]||0;Object.values(S.equipment).forEach(id=>{let it=EQUIPMENT.find(x=>x[2]===id);if(it)v+=it[4][k]||0});return v}
function shop(){shopOpen=true;render()}
function renderShop(){let slots={head:'Tête',torso:'Torse',arms:'Bras',legs:'Jambes',support:'Support'};return `<div class="card"><div class="scenehead"><h2>🛍️ Boutique</h2><button onclick="shopOpen=false;render()">Fermer</button></div><p>Budget : <b class="money">${S.money} ¥</b>. Les équipements sont achetés, puis doivent être équipés.</p>${Object.entries(slots).map(([slot,label])=>`<h3>${label}</h3>${EQUIPMENT.filter(x=>x[0]===slot).map(it=>`<div class="shopitem"><div class="row"><span><b>${esc(it[2])}</b><br><span class="small muted">${esc(it[5])}</span><br>${Object.entries(it[4]).map(([k,v])=>`${STAT[k]} ${v>0?'+':''}${v}`).join(' • ')}</span><button ${S.money<it[3]||S.inventory.includes(it[2])?'disabled':''} onclick="buy('${it[2].replace(/'/g,"\\'")}')">${it[3]} ¥</button></div></div>`).join('')}`).join('')}</div>`}

function base(){return {version:VERSION,started:false,player:{name:'',gender:'Non précisé',personality:'Curieux'},school:'Collège municipal',schoolYear:'4e',age:14,day:1,season:1,action:0,money:250,hp:100,maxHp:100,energy:100,maxEnergy:100,rep:0,stats:{force:8,vitesse:8,defense:8,intelligence:8,endurance:8,controle:8,courage:8},equipment:{head:null,torso:null,arms:null,legs:null,support:null},inventory:[],alter:null,quirk:null,relations:{},npcs:[],memories:[],decisions:[],timeline:[],worldNews:[],eventHistory:[],factions:{hero:0,school:0,support:0,civil:0,vigilante:0,under:0,villain:0,ofa:0,afo:0},specialPath:null,stolenAlters:[],pendingSpecial:null,factionStatus:'undecided',seasonHistory:[],seasonActions:[],afterAction:null,seasonSummary:null,injury:0,lastNPC:null,storyFlags:{},gameOver:false}}
function normalize(x){let b=base(),s=Object.assign(b,x||{});for(let k of ['player','stats','equipment','factions'])s[k]=Object.assign(b[k],x?.[k]||{});for(let k of ['inventory','npcs','memories','decisions','timeline','worldNews','eventHistory','seasonHistory','seasonActions'])s[k]=x?.[k]||[];if(!s.alter&&s.quirk)s.alter=s.quirk;if(s.alter&&s.alter.id!=='none'){s.alter.techniques=s.alter.techniques||[];s.alter.discoveries=s.alter.discoveries||[]}return s}
function storage(){try{return localStorage}catch(e){return null}}
function save(){try{storage()?.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{let x=storage()?.getItem(KEY);return x?normalize(JSON.parse(x)):null}catch(e){return null}}
function timeline(title,text,kind='histoire'){S.timeline.push({title,text,kind,day:S.day,season:S.season});S.timeline=S.timeline.slice(-120)}
function remember(text,importance=1){S.memories.push({text,importance,day:S.day,season:S.season});S.memories=S.memories.slice(-100)}
function endSeason(){let highlights=S.seasonActions.slice(-7).map(x=>x.title);S.seasonHistory.push({season:S.season,highlights});S.seasonSummary={pending:true,season:S.season,highlights,orientation:factionText()};S.season=(S.season%4)+1;S.action=0;S.seasonActions=[];S.hp=clamp(S.hp+Math.round(S.maxHp*.4),1,S.maxHp);S.energy=S.maxEnergy;if(S.season===1){S.age++;if(S.age>=15&&S.schoolYear==='4e')S.schoolYear='3e';else if(S.age>=16&&S.schoolYear==='3e'){S.school='Lycée municipal';S.schoolYear='Seconde'}}worldTick();save();render()}

function openModal(html){$('modal').innerHTML=html;$('modal').style.display='block'}function closeModal(){$('modal').style.display='none';$('modal').innerHTML=''}
function newGame(){if(confirm('Commencer une nouvelle partie ?')){try{storage()?.removeItem(KEY)}catch(e){}S=null;scene=null;combat=null;renderMenu()}}
function create(){let name=$('cname').value.trim()||'Inconnu';S=base();S.started=true;S.player={name,gender:$('cgender').value,personality:$('cpers').value};generateNPCs();timeline('Début','Tu entres au collège. Ton avenir est encore largement ouvert.','début');remember('Le jeu commence au collège. Ton âge est géré automatiquement par la progression.');closeModal();save();render();setTimeout(()=>{scene={type:'school',title:'Une première journée ordinaire',text:'La journée commence sans événement spectaculaire. Tu ne sais pas encore quels camarades compteront vraiment, ni quelle place tu prendras dans ce monde.',choices:[['Observer les autres','Tu préfères comprendre ton environnement avant d’agir.',()=>{S.stats.intelligence++;return 'Tu repères déjà quelques personnalités qui pourraient compter plus tard.'}],['Aller vers quelqu’un','Tu décides de ne pas rester seul.',()=>{let n=chooseNPC();n.relation++;n.trust++;return `${n.name} accepte de discuter quelques minutes. Ce n’est qu’une rencontre, mais elle peut devenir importante.`}],['Rester seul','Tu profites du calme.',()=>{S.stats.endurance++;return 'Tu prends tes marques tranquillement. Certaines personnes remarquent pourtant ton isolement.'}]]};render()},80)}
function creation(){openModal(`<div class="card"><h2>Créer ton personnage</h2><div class="field"><label>Nom</label><input id="cname" placeholder="Ton nom"></div><div class="field"><label>Genre</label><select id="cgender"><option>Non précisé</option><option>Garçon</option><option>Fille</option></select></div><div class="field"><label>Personnalité dominante</label><select id="cpers"><option>Curieux</option><option>Protecteur</option><option>Ambitieux</option><option>Prudent</option><option>Provocateur</option><option>Réservé</option></select></div><div class="notice">Tu ne choisis ni ton âge ni ton Alter. L’âge évolue avec le temps et l’Alter sera découvert — ou non — par l’histoire.</div><button class="primary" style="width:100%;margin-top:10px" onclick="create()">Commencer</button></div>`)}
function importSave(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{S=normalize(JSON.parse(r.result));S.started=true;save();scene=null;combat=null;render()}catch(e){alert('Sauvegarde invalide.')}};r.readAsText(f)};i.click()}
function exportSave(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mha-road-v18-save.json';a.click()}
function renderMenu(){let has=!!load();$('root').innerHTML=`<div class="app menu"><div class="card"><span class="tag">V18 • refonte moteur</span><h1>MHA Road</h1><p class="muted">RPG narratif procédural dans l’univers de My Hero Academia.</p><div class="feature"><div>🧬 <b>Alter Engine</b><br><span class="small muted">Alters générés, règles, limites et capacités découvertes.</span></div><div>🎭 <b>Event Engine</b><br><span class="small muted">Situations et choix construits depuis le contexte.</span></div><div>👥 <b>PNJ vivants</b><br><span class="small muted">18 personnages avec objectifs, secrets et évolution.</span></div><div>🏴 <b>Factions</b><br><span class="small muted">Héros, villains, neutres et voies intermédiaires.</span></div><div>⚡ <b>OFA / AFO</b><br><span class="small muted">Voies spéciales conçues pour être façonnées par le joueur.</span></div><div>📱 <b>Offline</b><br><span class="small muted">Le moteur fonctionne sans API.</span></div></div><button class="primary" style="width:100%" onclick="creation()">▶ Nouvelle partie</button>${has?`<button class="good" style="width:100%;margin-top:8px" onclick="S=load();render()">↩ Continuer</button>`:''}<button style="width:100%;margin-top:8px" onclick="importSave()">📥 Importer</button></div></div>`}
function tab(t){activeTab=t;render()}
function render(){if(!S||!S.started)return renderMenu();let hp=S.hp/S.maxHp*100,en=S.energy/S.maxEnergy*100;$('root').innerHTML=`<div class="app"><div class="top"><div class="brand"><div><h1>MHA Road</h1><span class="small muted">Saison ${S.season} • action ${S.action}/7 • ${S.schoolYear}</span></div><span class="tag">${esc(S.school)}</span></div></div><div class="hud"><div class="hudbox">❤️ <b>${S.hp}/${S.maxHp}</b><div class="bar hp"><i style="width:${hp}%"></i></div></div><div class="hudbox">⚡ <b>${S.energy}/${S.maxEnergy}</b><div class="bar en"><i style="width:${en}%"></i></div></div><div class="hudbox">💰 <b>${S.money} ¥</b></div><div class="hudbox">⭐ <b>${S.rep}</b><span class="small">réputation</span></div></div><div class="tabs">${[['story','📖 Histoire'],['character','👤 Perso'],['alter','🧬 Alter'],['world','🌍 Monde'],['equip','🎒 Équip.'],['journal','📜 Journal']].map(x=>`<button class="${activeTab===x[0]?'active':''}" onclick="tab('${x[0]}')">${x[1]}</button>`).join('')}</div><div id="content"></div></div>`;renderTab()}
function renderTab(){let c=$('content');if(activeTab==='story')renderStory(c);else if(activeTab==='character')renderCharacter(c);else if(activeTab==='alter')renderAlter(c);else if(activeTab==='world')renderWorld(c);else if(activeTab==='equip')renderEquip(c);else renderJournal(c)}
function renderStory(c){let h='';if(S.afterAction)h+=`<div class="card after"><h3>📖 Ce qui vient de se passer</h3><p>${esc(S.afterAction.text)}</p>${S.afterAction.effects.length?`<div class="consequence">${S.afterAction.effects.map(esc).join(' • ')}</div>`:''}<button class="primary" style="width:100%;margin-top:10px" onclick="S.afterAction=null;nextScene()">Continuer</button></div>`;if(S.seasonSummary?.pending)h+=`<div class="card"><h2>🎬 Fin de saison</h2><p>Les derniers événements :</p><ul>${S.seasonSummary.highlights.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p><b>Affinités :</b> ${esc(S.seasonSummary.orientation)}</p><button class="primary" onclick="S.seasonSummary=null;save();nextScene()">Commencer la suite</button></div>`;if(combat)h+=renderCombat();else if(scene&&!S.afterAction&&!S.seasonSummary?.pending)h+=`<div class="card scene"><div class="scenehead"><span class="tag">${esc(scene.type)}</span><span class="small muted">Jour ${S.day}</span></div><h2>${esc(scene.title)}</h2><p>${esc(scene.text)}</p>${scene.choices.map((x,i)=>`<button class="choice" onclick="choose(${i})"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></button>`).join('')}</div>`;else if(!S.afterAction&&!S.seasonSummary?.pending)h+=`<div class="card"><p>Le monde continue de bouger.</p><button class="primary" onclick="nextScene()">Nouvelle situation</button></div>`;if(shopOpen)h+=renderShop();h+=`<div class="card"><div class="footer"><button onclick="save();alert('Sauvegardé.')">💾 Sauvegarder</button><button class="danger" onclick="newGame()">↻ Nouvelle partie</button></div></div>`;c.innerHTML=h}
function renderCombat(){let e=combat.enemy;return `<div class="card combat"><div class="scenehead"><h2>⚔️ Combat</h2><span class="tag">Tour ${combat.turn}</span></div><div class="combatgrid"><div><b>${esc(e.name)}</b><div class="small muted">Alter : ${e.analyzed>=2?esc(e.alter.name):'???'}</div><div class="bar hp"><i style="width:${e.hp/e.maxHp*100}%"></i></div><small>❤️ ${e.hp}/${e.maxHp}</small></div><div><b>${esc(S.player.name)}</b><div class="small muted">${S.alter?esc(S.alter.name):'Non révélé'}</div><div class="bar hp"><i style="width:${S.hp/S.maxHp*100}%"></i></div><small>❤️ ${S.hp}/${S.maxHp} • ⚡ ${S.energy}</small></div></div>${combat.ended?`<div class="notice"><b>${esc(combat.log[0])}</b></div><button class="primary" style="width:100%;margin-top:8px" onclick="combat=null;S.afterAction={title:'Combat terminé',text:'Le combat est terminé. Ce que tu en retires pourrait influencer tes prochaines décisions.',effects:[]};save();render()">Continuer</button>`:`<div class="combat-actions"><button class="choice" onclick="combatAction('attack')"><b>⚔️ Attaque</b><span>Utiliser tes capacités physiques.</span></button><button class="choice" onclick="combatAction('guard')"><b>🛡️ Défense</b><span>Réduire les dégâts et observer.</span></button><button class="choice" onclick="combatAction('analyze')"><b>🔎 Analyser</b><span>Découvrir progressivement l’Alter adverse.</span></button><button class="choice" onclick="combatAction('flee')"><b>↩️ Fuir</b><span>Essayer de quitter le combat.</span></button></div>${S.alter&&S.alter.id!=='none'?`<h3>🧬 Capacités</h3><div class="combat-actions">${S.alter.techniques.map((t,i)=>`<button class="choice tech" ${S.energy<t.cost?'disabled':''} onclick="combatAction('tech',${i})"><b>${esc(t.name)}</b><span>${t.cost}⚡ • ${esc(t.description)}</span></button>`).join('')||'<p class="muted">Aucune capacité de combat découverte.</p>'}</div>`:''}<div class="log">${combat.log.slice(0,5).map(x=>`<div class="logitem">${esc(x)}</div>`).join('')}</div>`}</div>`}
function renderCharacter(c){let rows=Object.keys(STAT).map(k=>{let b=effective(k)-(S.stats[k]||0);return `<div class="stat"><span>${STAT[k]}</span><b>${effective(k)} ${b?`<span class="positive">(+${b})</span>`:''}</b><br><small>base ${S.stats[k]}</small></div>`}).join('');c.innerHTML=`<div class="card"><h2>👤 ${esc(S.player.name)}</h2><p class="muted">${esc(S.player.personality)} • ${S.age} ans • ${esc(S.school)} ${esc(S.schoolYear)}</p>${rows}</div><div class="card"><h3>🏴 Orientation</h3><p>${esc(factionText())}</p><p class="muted">${S.factionStatus==='undecided'?'Tu n’appartiens encore à aucune faction.':'La tendance dominante est : '+FACTIONS[S.factionStatus].name}</p></div>`}
function renderAlter(c){if(!S.alter){c.innerHTML=`<div class="card"><h2>🧬 Alter</h2><p>Ton Alter n’est pas encore révélé. Il peut aussi s’avérer que tu sois sans Alter.</p></div>`;return}let q=S.alter;if(q.id==='none'){c.innerHTML=`<div class="card"><h2>🧬 Sans Alter</h2><p>Tu n’as pas d’Alter. Cette voie possède sa propre progression.</p><p>Spécialité : ${q.traits.join(' • ')}</p><button class="good" style="width:100%" onclick="scene=alterLab();S.afterAction=null;render()">🧪 Expérimenter</button></div>`;return}c.innerHTML=`<div class="card"><h2>🧬 ${esc(q.name)}</h2><span class="tag">${esc(q.category)} • ${esc(q.root)}</span><p>${esc(q.description)}</p><p class="muted">Règle : ${esc(q.rule)}<br>Limite : ${esc(q.limit)}<br>Contrecoup : ${esc(q.cost)}<br>Portée : ${esc(q.range)}</p><p>Maîtrise : <b>${q.mastery}</b> • XP : <b>${q.xp}</b></p>${q.id==='ofa'?'<div class="notice"><b>OFA se façonne par ton style.</b><br>Les capacités apparaîtront selon ton entraînement, ta manière de combattre et les risques que tu prends.</div>':''}${q.id==='afo'?`<div class="notice"><b>Stock d’Alters : ${S.stolenAlters.length}</b><br>Chaque Alter volé peut devenir une branche de progression différente.</div><button class="warn" style="width:100%;margin-top:8px" onclick="scene={type:'Alter',title:'🕳️ All For One : tenter un vol',text:'Tu peux tenter de voler l’Alter d’une personne accessible. Le pouvoir obtenu ne sera pas automatiquement maîtrisé.',choices:[['Tenter le vol','Une opération risquée.',()=>stealAlterFromNPC()],['Renoncer','Tu observes encore.',()=> 'Tu décides de ne pas voler cet Alter pour le moment.']]};render()">Tenter de voler un Alter</button>`:''}<h3>Capacités découvertes</h3>${q.techniques.length?q.techniques.map(t=>`<div class="npc"><b>${esc(t.name)}</b><br><span class="small muted">${esc(t.description)} • ${t.cost}⚡ • ${t.uses} utilisation(s)</span></div>`).join(''):'<p class="muted">Aucune capacité fixe. Ton Alter se construit avec tes expériences.</p>'}<button class="good" style="width:100%;margin-top:8px" onclick="scene=alterLab();S.afterAction=null;render()">🧪 Expérimenter</button></div>`}
function renderWorld(c){c.innerHTML=`<div class="card"><h2>🌍 Monde vivant</h2><p class="muted">18 PNJ ont leurs propres objectifs, relations et trajectoires.</p>${S.npcs.map(n=>`<div class="npc"><b>${esc(n.name)}</b> <span class="pill">${n.age} ans • ${esc(n.class)}</span><br><span class="small muted">${esc(n.personality)} • objectif : ${esc(n.goal)}</span><br><span class="small">Alter : ${esc(n.alter.name)} • relation ${n.relation} • confiance ${n.trust}</span></div>`).join('')}</div><div class="card"><h3>🏴 Factions</h3>${Object.entries(FACTIONS).map(([k,f])=>`<div class="faction"><b>${esc(f.name)}</b><br><span class="small muted">${esc(f.desc)}</span><br><span class="small">Affinité : ${S.factions[k]||0}</span></div>`).join('')}</div><div class="card"><h3>📰 Ce qui se passe ailleurs</h3>${S.worldNews.length?S.worldNews.map(x=>`<div class="logitem">${esc(x)}</div>`).join(''):'<p class="muted">Le monde est calme pour le moment.</p>'}</div>`}
function renderEquip(c){let slots={head:'Tête',torso:'Torse',arms:'Bras',legs:'Jambes',support:'Support'};c.innerHTML=`<div class="card"><h2>🎒 Équipement</h2><p>Les équipements s’achètent lors des événements boutique. Les bonus ne s’appliquent qu’une fois équipés.</p>${Object.entries(slots).map(([slot,label])=>{let id=S.equipment[slot],inv=S.inventory.filter(x=>EQUIPMENT.some(it=>it[0]===slot&&it[2]===x));return `<div class="shopitem"><div class="row"><b>${label}</b>${id?`<button onclick="unequip('${slot}')">Retirer</button>`:'<span class="pill">Vide</span>'}</div>${id?`<p>${esc(id)}</p>`:''}${inv.map(x=>{let it=EQUIPMENT.find(y=>y[2]===x);return `<div class="row"><span>${esc(x)}<br><span class="small muted">${Object.entries(it[4]).map(([k,v])=>`${STAT[k]} ${v>0?'+':''}${v}`).join(' • ')}</span></span><button onclick="equip('${x.replace(/'/g,"\\'")}')">Équiper</button></div>`}).join('')}</div>`}).join('')}</div><div class="card"><button class="primary" style="width:100%" onclick="shop()">🛍️ Ouvrir la boutique</button></div>`}
function renderJournal(c){c.innerHTML=`<div class="card"><h2>📜 Journal</h2>${S.timeline.length?`<div class="log">${[...S.timeline].reverse().map(x=>`<div class="logitem"><span class="small muted">S${x.season} • jour ${x.day} • ${esc(x.kind)}</span><br><b>${esc(x.title)}</b><br>${esc(x.text)}</div>`).join('')}</div>`:'<p class="muted">Ton histoire commence ici.</p>'}</div><div class="card"><h3>🧠 Mémoire narrative</h3><p>${S.memories.length} souvenirs enregistrés • ${S.decisions.length} décisions importantes.</p></div><div class="card"><div class="footer"><button onclick="save();alert('Sauvegardé.')">💾 Sauvegarder</button><button onclick="exportSave()">📦 Exporter</button><button onclick="importSave()">📥 Importer</button></div></div>`}

window.addEventListener('beforeunload',save);try{S=load();render()}catch(e){console.error(e);S=null;renderMenu()}
</script></body></html>
